            }
        }
        window.onerror = function (msg, url, line, col, err) {
            showError('Runtime Error', msg + '\n\nFile: ' + url + '\nLine: ' + line + ', Col: ' + col + '\n\nStack:\n' + (err ? err.stack : 'No stack'));

        });

            handleReset = () => {

                if (!isNaN(cleanExpr) && cleanExpr.trim() !== '') return parseFloat(cleanExpr) || 0;

        const normalizeCategory = (cat, type) => {

            if (type === 'assets') {
                if (['SAVING', 'SAVINGS', 'Savings', 'Cash', 'Deposit', 'Bank', 'BANK', 'DEPOSIT', 'CASH'].some(k => upper.includes(k))) return 'SAVINGS';
                if (['INVEST', 'STOCK', 'Stock', 'Investment', 'Fund', 'STOCKS', 'EQUITY', 'PORTFOLIO'].some(k => upper.includes(k))) return 'INVESTMENT';
                if (['COIN', 'CRYPTO', 'Coin', 'Bitcoin', 'BTC', 'ETH'].some(k => upper.includes(k))) return 'COIN';
                if (['ESTATE', 'REAL', 'Property', 'Estate', 'Jeonse', 'Apartment', 'REALESTATE', 'PROPERTY', 'LAND'].some(k => upper.includes(k))) return 'REAL_ESTATE';
                if (['PENSION', 'IRP', 'Retirement', 'Pension', 'RETIREMENT'].some(k => upper.includes(k))) return 'PENSION';
                return 'SAVINGS';
            } else if (type === 'budget') {
                if (['INCOME', 'REVENUE', 'Income', 'Salary', 'Pay', 'SALARY', 'PAY'].some(k => upper.includes(k))) return 'INCOME';
                if (['SAVING', 'Saving', 'SAVINGS'].some(k => upper.includes(k)))          return 'SAVING';
                if (['INVEST', 'Investment', 'INVESTMENT'].some(k => upper.includes(k)))                  return 'INVEST';
                if (['EXPENSE', 'EXPENSES', 'Expense', 'Spend', 'Card', 'OUTFLOW'].some(k => upper.includes(k))) return 'EXPENSE';
                return 'EXPENSE';

        const isItemHidden = (item, type, meta) => {
            if (!meta || !meta.hiddenRows || !meta.hiddenRows[type]) return false;
            let normalizedCat = item.category;
            if (type === 'assets') {
                normalizedCat = ASSET_CATEGORIES[item.category] ? item.category : Object.keys(ASSET_CATEGORIES)[0];
            } else if (type === 'budget') {
                normalizedCat = BUDGET_CATEGORIES[item.category] ? item.category : Object.keys(BUDGET_CATEGORIES)[0];
            } else if (type === 'loans') {
                normalizedCat = LOAN_CATEGORIES[item.category] ? item.category : 'DEBT';
            } else if (type === 'stockProfit') {
                normalizedCat = STOCK_PROFIT_CATEGORIES[item.category] ? item.category : Object.keys(STOCK_PROFIT_CATEGORIES)[0];
            } else {

            const itemKey = `${normalizedCat}|${item.category2||''}|${item.name}`;

        const parseCSVLine = (text) => {
            const result = []; let current = ''; let inQuote = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (char === '"') inQuote = !inQuote;
                else if (char === ',' && !inQuote) { result.push(current.trim()); current = ''; } 
                else current += char;
            }
            result.push(current.trim());
            return result.map(cell => cell.replace(/^"|"$/g, '').replace(/""/g, ''));
        };

        const parseDateHeader = (header) => {
            if (!header) return null;
            let cleanHeader = header.replace(/^\uFEFF/, '').trim();
            const matchStandard = cleanHeader.match(/^(\d{4})[-./](\d{1,2})$/);
            if (matchStandard) return `${matchStandard[1]}-${String(matchStandard[2]).padStart(2, '0')}`;
            const matchShort = cleanHeader.match(/^(\d{2})[-./](\d{1,2})$/);
            if (matchShort) return `20${matchShort[1]}-${String(matchShort[2]).padStart(2, '0')}`;
            if (/^\d{6}$/.test(cleanHeader)) return `${cleanHeader.substring(0,4)}-${cleanHeader.substring(4,6)}`;
            const matchKorean = cleanHeader.match(/^(\d{4})년\s*(\d{1,2})월$/);
            if (matchKorean) return `${matchKorean[1]}-${String(matchKorean[2]).padStart(2, '0')}`;
            const months = { jan: '01', feb: '02', mar: '03', apr: '04', may: '05', jun: '06', jul: '07', aug: '08', sep: '09', oct: '10', nov: '11', dec: '12' };
            const lowerHeader = cleanHeader.toLowerCase();
            const matchEngYearFirst = lowerHeader.match(/^(\d{2})[-.\s]([a-z]{3})$/);
            if (matchEngYearFirst && months[matchEngYearFirst[2]]) return `20${matchEngYearFirst[1]}-${months[matchEngYearFirst[2]]}`;
            const matchEngMonthFirst = lowerHeader.match(/^([a-z]{3})[-.\s]?(\d{2,4})$/);
            if (matchEngMonthFirst && months[matchEngMonthFirst[1]]) {
                let year = matchEngMonthFirst[2]; if (year.length === 2) year = '20' + year;
                return `${year}-${months[matchEngMonthFirst[1]]}`;
            }
            return null;
        };

        const processFileUpload = (file, currentData, type, onUpdate, setIsUploading) => {
            if (!file) return;
            setIsUploading(true);
            const parseFile = (encoding) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.onerror = (e) => reject(e);
                    reader.readAsText(file, encoding);
                });
            };
            const processText = (text) => {
                if (text.charCodeAt(0) === 0xFEFF) text = text.substr(1);
                const lines = text.split(/\r\n|\n|\r/).filter(line => line.trim() !== '');
                if (lines.length < 2) return { success: false, message: "Insufficient data." };
                const header = parseCSVLine(lines[0]);
                const monthIndices = {};
                header.forEach((col, idx) => {
                    const parsedDate = parseDateHeader(col);
                    if (parsedDate) monthIndices[parsedDate] = idx;
                });
                if (Object.keys(monthIndices).length === 0) return { success: false, message: "Date columns not found." };
                const newData = JSON.parse(JSON.stringify(currentData));
                Object.keys(monthIndices).forEach(m => {
                    if (!newData[m]) newData[m] = { assets: [], loans: [], budget: [], stockProfit: [] };
                });
                // Detect column layout from header (new Korean format vs old English format)
                const hLower = header.map(h => (h || '').trim().toLowerCase());
                const col1Idx = hLower.indexOf('category') !== -1 ? hLower.indexOf('category') : hLower.indexOf('항목1');
                const col2Idx = hLower.indexOf('subcategory') !== -1 ? hLower.indexOf('subcategory') : hLower.indexOf('항목2');
                const col3Idx = hLower.indexOf('item name') !== -1 ? hLower.indexOf('item name') : (hLower.indexOf('item') !== -1 ? hLower.indexOf('item') : hLower.indexOf('항목3'));
                const colNameIdx = hLower.indexOf('item name') !== -1 ? hLower.indexOf('item name') : (hLower.indexOf('name') !== -1 ? hLower.indexOf('name') : hLower.indexOf('항목명'));
                const colTypeIdx = hLower.indexOf('type') !== -1 ? hLower.indexOf('type') : hLower.indexOf('구분');
                const isNewTripleFormat = col1Idx !== -1 && col2Idx !== -1 && col3Idx !== -1;
                const isNewNameFormat = colNameIdx !== -1;
                for (let i = 1; i < lines.length; i++) {
                    const row = parseCSVLine(lines[i]);
                    if (row.length < 2) continue;
                    let category = '', category2 = '', name = '';
                    if (type === 'stockProfit' && isNewTripleFormat) {
                        // 새 포맷: 항목1(배당금/주식손익), 항목2(Yungki/Sua), 항목3(항목명)
                        const catLabel = (row[col1Idx] || '').trim();
                        category2 = (row[col2Idx] || '').trim();
                        name = (row[col3Idx] || '').trim();
                        const matchedKey = Object.entries(STOCK_PROFIT_CATEGORIES).find(([k, v]) => v.label === catLabel || k === catLabel.toUpperCase() || v.label.toUpperCase() === catLabel.toUpperCase());
                        category = matchedKey ? matchedKey[0] : (catLabel.includes('배당') || catLabel.toLowerCase().includes('dividend') ? 'DIVIDEND' : 'STOCK_PROFIT');
                    } else if (type === 'stockProfit') {
                        // 구형 포맷 호환: 항목명,구분 or 구분,항목명
                        let rawType;
                        if (isNewNameFormat && colTypeIdx !== -1) {
                            name = (row[colNameIdx] || '').trim();
                            rawType = (row[colTypeIdx] || '').trim().toUpperCase();
                        } else {
                            rawType = (row[0] || '').trim().toUpperCase();
                            name = (row[1] || '').trim();
                        }
                        category = (rawType === 'D' || rawType === 'DIVIDEND') ? 'DIVIDEND' : 'STOCK_PROFIT';
                    } else if (isNewTripleFormat && (type === 'assets' || type === 'budget')) {
                        const catLabel = (row[col1Idx] || '').trim();
                        category2 = (row[col2Idx] || '').trim();
                        name = (row[col3Idx] || '').trim();
                        const cats = type === 'assets' ? ASSET_CATEGORIES : BUDGET_CATEGORIES;
                        const matchedKey = Object.entries(cats).find(([k, v]) => v.label === catLabel || k === catLabel.toUpperCase() || v.label.toUpperCase() === catLabel.toUpperCase());
                        category = matchedKey ? matchedKey[0] : normalizeCategory(catLabel, type);
                    } else if (isNewNameFormat && type === 'loans') {
                        name = (row[colNameIdx] || '').trim();
                    } else {
                        category = normalizeCategory((row[0] || '').trim(), type);
                        name = (row[1] || '').trim();
                    }
                    if (!name) continue;
                    Object.entries(monthIndices).forEach(([month, colIdx]) => {
                        const rawVal = row[colIdx] ? row[colIdx].replace(/,/g, '') : '0';
                        const val = parseFloat(rawVal) || 0;
                        if (!newData[month]) newData[month] = { assets: [], loans: [], budget: [], stockProfit: [] };
                        const listKey = type === 'stockProfit' ? 'stockProfit' : type;
                        if (!newData[month][listKey]) newData[month][listKey] = [];
                        const list = newData[month][listKey];
                        const existingItem = list.find(item =>
                            item.name === name &&
                            (item.category || '') === category &&
                            (item.category2 || '') === category2
                        );
                        if (existingItem) {
                            if (type === 'stockProfit') {
                                if (category === 'DIVIDEND') existingItem.dividend = val;
                                else existingItem.profit = val;
                            } else {
                                if (category) existingItem.category = category;
                                if (category2 !== undefined) existingItem.category2 = category2;
                                if (type === 'assets') existingItem.value = val; else existingItem.amount = val;
                            }
                        } else {
                            const newItem = { id: Date.now() + Math.random() + i, name };
                            if (type === 'stockProfit') {
                                newItem.category = category;
                                newItem.category2 = category2;
                                newItem.profit = 0;
                                newItem.dividend = 0;
                                if (category === 'DIVIDEND') newItem.dividend = val;
                                else newItem.profit = val;
                            } else {
                                if (category) newItem.category = category;
                                if (category2) newItem.category2 = category2;
                                if (type === 'assets') newItem.value = val; else newItem.amount = val;
                            }
                            list.push(newItem);
                        }
                    });
                }
                return { success: true, data: newData };
            };
            parseFile('UTF-8').then(text => {
                let result = processText(text);
                if (result.success) { onUpdate(result.data); alert('Data uploaded successfully!'); setIsUploading(false); }
                else {
                    parseFile('EUC-KR').then(textKR => {
                        result = processText(textKR);
                        if (result.success) { onUpdate(result.data); alert('Data uploaded successfully! (EUC-KR)'); }
                        else { alert(`Error: ${result.message}\n(Supported formats: 2024-01, 24.01, Jan 24, etc.)`); }
                        setIsUploading(false);
                    }).catch(() => { alert(`Error: ${result.message}\n(Supported formats: 2024-01, 24.01, Jan 24, etc.)`); setIsUploading(false); });
                }
            }).catch(err => { console.error(err); alert("Failed to read file."); setIsUploading(false); });
        };
 
        const CSV_FILE_NAMES = {
            assets: 'assets_management',
            budget: 'income_expense',
            loans: 'loans_debt',
            stockProfit: 'stock_profits',
        };
 
        const downloadCSV = (data, type) => {
            const months = Object.keys(data).filter(isMonthKey).sort();
            const listKey = type === 'stockProfit' ? 'stockProfit' : type;
            const fileName = CSV_FILE_NAMES[type] || type;
 
            // Collect all unique items preserving order across months
            // For categorized types, key = category|category2|name; for others key = name
            const uniqueItemsOrdered = [];
            const seenKeys = new Set();
            months.forEach(m => {
                (data[m]?.[listKey] || []).forEach(item => {
                    const cat1 = item.category || '';
                    const cat2 = item.category2 || '';
                    const key = `${cat1}|${cat2}|${item.name}`;
                    if (!seenKeys.has(key)) {
                        seenKeys.add(key);
                        uniqueItemsOrdered.push({ name: item.name, category: cat1, category2: cat2, key });
                    }
                });
            });
 
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
 
            if (type === 'assets' || type === 'budget') {
                // Header: Category, Subcategory, Item Name, YYYY-MM, ...
                const categories = type === 'assets' ? ASSET_CATEGORIES : BUDGET_CATEGORIES;
                csvContent += 'Category,Subcategory,Item Name,' + months.join(',') + '\n';
                uniqueItemsOrdered.forEach(({ name, category, category2 }) => {
                    const catLabel = categories[category]?.label || category || '';
                    const row = [`"${catLabel}"`, `"${category2}"`, `"${name}"`];
                    months.forEach(m => {
                        const found = (data[m]?.[listKey] || []).find(i =>
                            i.name === name &&
                            (i.category || '') === category &&
                            (i.category2 || '') === category2
                        );
                        const val = found ? (type === 'assets' ? (found.value ?? 0) : (found.amount ?? 0)) : 0;
                        row.push(val);
                    });
                    csvContent += row.join(',') + '\n';
                });
            } else if (type === 'loans') {
                // Header: Item Name, YYYY-MM, ...
                csvContent += 'Item Name,' + months.join(',') + '\n';
                uniqueItemsOrdered.forEach(({ name }) => {
                    const row = [`"${name}"`];
                    months.forEach(m => {
                        const found = (data[m]?.[listKey] || []).find(i => i.name === name);
                        row.push(found ? (found.amount ?? 0) : 0);
                    });
                    csvContent += row.join(',') + '\n';
                });
            } else if (type === 'stockProfit') {
                // 새 포맷: Category, Subcategory, Item Name, 날짜...
                csvContent += 'Category,Subcategory,Item Name,' + months.join(',') + '\n';
                uniqueItemsOrdered.forEach(({ name, category, category2 }) => {
                    const catLabel = STOCK_PROFIT_CATEGORIES[category]?.label || category || '';
                    const row = [`"${catLabel}"`, `"${category2}"`, `"${name}"`];
                    months.forEach(m => {
                        const found = (data[m]?.[listKey] || []).find(i =>
                            i.name === name &&
                            (i.category || '') === category &&
                            (i.category2 || '') === category2
                        );

                        row.push(val);
                    });
                    csvContent += row.join(',') + '\n';
                });
            }

        // --- Google Sheets Service ---
        const DEFAULT_SPREADSHEET_ID = '1jINVTkUif3YjgUiS3K_Qx3rTDK-bs1SZF3N0oKLguzU';

        const normalizePersonName = (name) => {
            const clean = String(name || '').trim();
            if (['용기', '융기', 'yungki', '융'].some(k => clean.toLowerCase().includes(k))) return 'Yungki';
            if (['수아', 'sua', '수'].some(k => clean.toLowerCase().includes(k))) return 'Sua';
            if (['공동', 'joint', 'both', '공'].some(k => clean.toLowerCase().includes(k))) return 'Joint';
            return clean;
        };

        const parseSalarySheet = (rows) => {
            if (!rows || rows.length < 2) return null;
            const header = rows[0].map(h => String(h || '').trim());
            const yearIndices = {};
            const yearsList = [];
            header.forEach((col, idx) => {
                if (/^\d{4}$/.test(col)) {
                    yearIndices[col] = idx;
                    yearsList.push(col);
                }
            });
            yearsList.sort();
            
            const items = [];
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row || row.length < 2) continue;
                const rawName = String(row[0] || '').trim();
                if (!rawName) continue;
                const normalizedName = normalizePersonName(rawName);
                
                const values = {};
                yearsList.forEach(year => {
                    const colIdx = yearIndices[year];
                    const rawVal = row[colIdx] ? String(row[colIdx]).replace(/,/g, '') : '0';
                    values[year] = parseFloat(rawVal) || 0;
                });
                
                items.push({
                    id: i,
                    name: normalizedName,
                    values: values
                });
            }
            
            return {
                years: yearsList,
                items: items
            };
        };

        const parsePortfolioSheet = (rows, currentExchangeRate) => {
            if (!rows || rows.length < 2) return null;
            const exchangeRateToUse = (typeof currentExchangeRate === 'number' && currentExchangeRate > 0) ? currentExchangeRate : 1380;
            const portfolio = {
                exchangeRate: exchangeRateToUse,
                persons: {
                    sua: { name: '수아', color: '#ec4899', accounts: [], debts: [] },
                    yungki: { name: '융기', color: '#06b6d4', accounts: [], debts: [] }
                },
                priceCache: {},
                lastPriceUpdate: new Date().toISOString()
            };

            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row || row.length < 9) continue;
                const rawOwner = String(row[0] || '').trim();
                const broker = String(row[1] || '').trim();
                const accountName = String(row[2] || '').trim();
                const accountType = String(row[3] || '').trim() || 'STOCK';
                const category = String(row[4] || '').trim();
                const stockName = String(row[5] || '').trim();
                const ticker = String(row[6] || '').trim().toUpperCase();
                const quantity = parseFloat(String(row[7]).replace(/,/g, '')) || 0;
                const avgPrice = parseFloat(String(row[8]).replace(/,/g, '')) || 0;
                const currency = String(row[9] || 'KRW').trim().toUpperCase();
                const currentPrice = parseFloat(String(row[10]).replace(/,/g, '')) || avgPrice;
                const sector = String(row[11] || '').trim() || category;

                if (!rawOwner || !ticker) continue;

                const normalizedOwner = normalizePersonName(rawOwner);
                const ownerKey = normalizedOwner === 'Sua' ? 'sua' : normalizedOwner === 'Yungki' ? 'yungki' : null;
                if (!ownerKey) continue;

                const person = portfolio.persons[ownerKey];
                
                // Find or create account
                let account = person.accounts.find(a => a.broker === broker && a.accountName === accountName);
                if (!account) {
                    account = {
                        id: `${ownerKey}-${broker}-${accountName}`.replace(/\s+/g, '-'),
                        broker,
                        accountName,
                        accountType,
                        holdings: []
                    };
                    person.accounts.push(account);
                }

                // Add holding
                account.holdings.push({
                    id: `sh-${ownerKey}-${i}`,
                    name: stockName,
                    ticker: ticker,
                    market: currency === 'USD' ? 'US' : 'KR',
                    quantity: quantity,
                    avgPrice: avgPrice,
                    currency: currency,
                    category: category,
                    sector: sector
                });

                // Cache the price
                portfolio.priceCache[ticker] = currentPrice;
            }
            return portfolio;
        };

        const buildFinancialDataFromSheets = (sheetsData, currentData) => {

                    const isLease = ['전세', 'lease', 'jeonse', '임대'].some(k => 
                        rawOwner.toLowerCase().includes(k) ||

                    );
                    const category = isLease ? 'LEASE' : 'DEBT';
                    const category2 = normalizePersonName(rawOwner);
                    const name = rawBank + (rawDesc ? ` (${rawDesc})` : '');
                    
                    Object.entries(monthIndices).forEach(([month, colIdx]) => {
                        const rawVal = row[colIdx] ? String(row[colIdx]).replace(/,/g, '') : '0';
                        const val = parseFloat(rawVal) || 0;

            const profitRows = sheetsData['Profit_Raw'] || [];

                    if (!rawCat && !rawOwner && !rawBroker) continue;
                    
                    const isDiv = rawCat.includes('배당') || rawCat.toLowerCase().includes('dividend') || rawCat.toLowerCase().includes('div');
                    const category = isDiv ? 'DIVIDEND' : 'STOCK_PROFIT';
                    const category2 = normalizePersonName(rawOwner);
                    const name = rawBroker;
                    
                    Object.entries(monthIndices).forEach(([month, colIdx]) => {
                        const rawVal = row[colIdx] ? String(row[colIdx]).replace(/,/g, '') : '0';
                        const val = parseFloat(rawVal) || 0;
                        
                        if (!profitMonths[month]) profitMonths[month] = [];
                        profitMonths[month].push({

            // 5. Process Salary_Raw
            const salaryData = parseSalarySheet(sheetsData['Salary_Raw']);
            if (salaryData) {

            // 6. Process Portfolio_Raw (환율은 sheetsData._liveExchangeRate 우선 사용)

        const fetchAllSheets = async (spreadsheetId, token) => {
            if (!window.gapi || !window.gapi.client) {
                throw new Error('Google API Client not loaded');
            }
            window.gapi.client.setToken({ access_token: token });
            try {
                // Get spreadsheet metadata to check available sheet titles
                const metaResponse = await window.gapi.client.sheets.spreadsheets.get({
                    spreadsheetId: spreadsheetId
                });
                const existingSheetTitles = (metaResponse.result.sheets || []).map(s => s.properties.title);
                
                // Filter ranges to fetch only those that actually exist in the spreadsheet
                const validRanges = SHEET_RANGES.filter(range => existingSheetTitles.includes(range));
                
                if (validRanges.length === 0) {
                    return {};
                }

                const response = await window.gapi.client.sheets.spreadsheets.values.batchGet({
                    spreadsheetId: spreadsheetId,
                    ranges: validRanges,
                });
                const valueRanges = response.result.valueRanges;
                const sheetsData = {};
                
                // Map results back to original SHEET_RANGES, defaulting to empty for missing sheets
                SHEET_RANGES.forEach(range => {
                    const validIdx = validRanges.indexOf(range);
                    if (validIdx !== -1) {
                        sheetsData[range] = valueRanges[validIdx]?.values || [];
                    } else {
                        sheetsData[range] = [];
                    }
                });
                return sheetsData;
            } catch (err) {
                console.error('Error fetching sheets:', err);
                throw err;
            }
        };

        // silentMode: true → 자동 재인증 (interaction_required 실패는 조용히 무시)
        // silentMode: false → 수동 연결 (팝업 강제)
        const initGapiAndGis = (clientId, onTokenReceived, onError, autoRequest = false, silentMode = false) => {
            let attempts = 0;
            const check = setInterval(() => {
                attempts++;
                if (window.gapi && window.google && window.google.accounts && window.google.accounts.oauth2) {
                    clearInterval(check);
                    window.gapi.load('client', () => {
                        window.gapi.client.init({
                            discoveryDocs: ['https://sheets.googleapis.com/$discovery/rest?version=v4'],
                        }).then(() => {
                            const client = window.google.accounts.oauth2.initTokenClient({
                                client_id: clientId,
                                scope: 'https://www.googleapis.com/auth/spreadsheets.readonly',
                                callback: (resp) => {
                                    if (resp.error) {
                                        const isSilentFailure = resp.error === 'interaction_required' ||
                                            resp.error === 'access_denied' ||
                                            resp.error === 'popup_closed_by_user' ||
                                            resp.error === 'popup_blocked_by_browser';
                                        if (silentMode && isSilentFailure) {
                                            // silent 재인증 실패 → 조용히 무시 (정상적인 경우)
                                            console.warn('Silent OAuth failed (expected, user must reconnect manually):', resp.error);
                                        } else if (!silentMode && resp.error === 'popup_closed_by_user') {
                                            // 사용자가 팝업을 직접 닫은 경우 → 조용히 처리
                                            console.warn('User closed OAuth popup');
                                        } else {
                                            console.error('OAuth error:', resp);
                                            if (onError) onError(resp.error_description || resp.error);
                                        }
                                    } else {
                                        if (onTokenReceived) onTokenReceived(resp.access_token);
                                    }
                                }
                            });
                            window.tokenClient = client;
                            // 이미 동의한 계정이 있으면 prompt 없이 자동으로 토큰 갱신 시도
                            if (autoRequest) {
                                try {
                                    client.requestAccessToken({ prompt: '' });
                                } catch(e) {
                                    console.warn('Silent token request failed:', e);
                                }
                            }
                        }).catch(err => {
                            console.error('GAPI init error:', err);
                            if (onError) onError(err.message || String(err));
                        });
                    });
                } else if (attempts > 50) {
                    clearInterval(check);
                    if (onError) onError('Google SDKs failed to load. Please check network connection.');
                }
            }, 100);
        };
