                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-2">
                        <div className="flex items-center gap-4"><h2 className="text-2xl font-black text-slate-800 tracking-tighter">Dashboard</h2><div className="h-6 w-px bg-slate-300 mx-2"></div><p className="text-slate-500 text-sm font-bold flex items-center gap-2">{todayStr}<span className="px-2 py-0.5 bg-slate-100 rounded text-xs text-slate-400 font-mono">Today</span></p></div>
                        <div className="flex items-center gap-4 bg-white px-4 py-1.5 rounded-full shadow-sm border border-slate-200"><button onClick={() => handleMonthChange(-1)} className="p-1 hover:bg-slate-100 rounded-full text-slate-400 transition-colors"><Icons.ChevronLeft className="w-4 h-4"/></button><span className="text-base font-extrabold text-indigo-600 min-w-[80px] text-center">{viewDate}</span><button onClick={() => handleMonthChange(1)} className="p-1 hover:bg-slate-100 rounded-full text-slate-400 transition-colors"><Icons.ChevronRight className="w-4 h-4"/></button></div>
                    </div>

                    {/* Executive Summary Banner */}
                    <div className="bg-slate-900 rounded-3xl p-6 lg:p-8 shadow-xl flex flex-col lg:flex-row justify-between items-center gap-8 relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-80 h-80 bg-indigo-500/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/3 pointer-events-none"></div>
                        <div className="relative z-10 flex-1 w-full">
                            <h3 className="text-indigo-400 font-bold text-xs mb-2 uppercase tracking-widest flex items-center gap-2"><Icons.Target className="w-4 h-4"/> FIRE (조기 은퇴) 목표</h3>
                            <div className="flex items-end gap-3 mb-3">
                                <span className="text-4xl font-black text-white tracking-tighter">{formatCurrency(netWorth)}</span>
                                <span className="text-slate-400 font-medium mb-1">/ {formatCurrency(netWorthGoal)} (원)</span>
                            </div>
                            <div className="w-full bg-slate-800 rounded-full h-3 overflow-hidden">
                                <div className="bg-gradient-to-r from-indigo-500 via-purple-500 to-emerald-400 h-3 rounded-full transition-all duration-1000" style={{ width: `${Math.min((netWorth / netWorthGoal) * 100, 100)}%` }}></div>
                            </div>
                            <div className="flex justify-between mt-3 text-sm font-bold">
                                <span className="text-emerald-400">{((netWorth / netWorthGoal) * 100).toFixed(1)}% 달성</span>
                                <button onClick={() => { const val = prompt("새로운 목표 금액(원):", netWorthGoal); if(val && !isNaN(val)) updateGoal('netWorth', Number(val)); }} className="text-slate-500 hover:text-white transition-colors underline underline-offset-4 decoration-slate-700 hover:decoration-white">목표 금액 수정</button>
                            </div>
                        </div>
                        <div className="relative z-10 w-full lg:w-auto flex gap-4">
                             <div className="flex-1 bg-slate-800/50 backdrop-blur-md rounded-2xl p-5 border border-slate-700 min-w-[160px]">
                                <p className="text-slate-400 text-[11px] font-bold uppercase mb-2 tracking-wider">전월 대비 순자산</p>
                                <div className="flex items-center gap-2">
                                    <span className={`text-2xl font-black ${calcYoY(netWorth, prevNetWorth) >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                        {calcYoY(netWorth, prevNetWorth) > 0 ? '+' : ''}{calcYoY(netWorth, prevNetWorth).toFixed(1)}%
                                    </span>
                                </div>
                             </div>
                             <div className="flex-1 bg-slate-800/50 backdrop-blur-md rounded-2xl p-5 border border-slate-700 min-w-[160px]">
                                <p className="text-slate-400 text-[11px] font-bold uppercase mb-2 tracking-wider">연간 패시브 인컴</p>
                                <div className="flex items-center gap-2">
                                    <span className="text-2xl font-black text-indigo-300">{formatCurrency(annualData.profit + annualData.dividend)}</span>
                                </div>
                             </div>
                        </div>
                    </div>

                    {/* Row 1: Scorecards (5개 배치) */}
                    <div className="grid grid-cols-2 lg:grid-cols-5 gap-4">
                        {['total', 'net', 'debt', 'invest', 'annual'].map((id) => (
                            <div key={id}>
                                {renderScoreCard(id)}
                            </div>
                        ))}
                    </div>

                    {/* Row 2: 전체 자산 흐름 (왼쪽), 대출/투자 현황 (오른쪽 분할) */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 h-[400px]">
                                <GlassCard className="p-6 h-full flex flex-col">
                                    <h3 className="font-bold text-slate-800 text-lg flex items-center gap-2 mb-4"><Icons.Activity className="w-5 h-5 text-indigo-600"/> 전체 자산 흐름</h3>
                                    <div className="flex-1"><ResponsiveContainer width="100%" height="100%"><ComposedChart data={fullGrowthData}><defs><linearGradient id="colorTotal" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#4F46E5" stopOpacity={0.1}/><stop offset="95%" stopColor="#4F46E5" stopOpacity={0}/></linearGradient></defs><CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" /><XAxis dataKey="name" fontSize={10} stroke="#94a3b8" tickMargin={10} axisLine={false} tickLine={false} /><YAxis yAxisId="left" fontSize={10} width={45} stroke="#94a3b8" tickFormatter={(val) => `${(val/100000000).toFixed(1)}억`} axisLine={false} tickLine={false} /><YAxis yAxisId="right" orientation="right" fontSize={10} width={30} stroke="#cbd5e1" unit="%" axisLine={false} tickLine={false} /><RechartsTooltip formatter={(val, name) => name === '부채비율' ? `${val}%` : formatCurrency(val)} contentStyle={{ borderRadius: '12px' }} /><Area yAxisId="left" type="monotone" dataKey="총자산" stroke="#4F46E5" strokeWidth={2} fill="url(#colorTotal)" /><Line yAxisId="left" type="monotone" dataKey="순자산" stroke="#10B981" strokeWidth={2} dot={false} /><Line yAxisId="right" type="monotone" dataKey="부채비율" stroke="#f43f5e" strokeWidth={1.5} strokeDasharray="4 4" dot={false} /></ComposedChart></ResponsiveContainer></div>
                                </GlassCard>
                        </div>
                        <div className="lg:col-span-1 flex flex-col gap-6 h-[400px]">
                            <div className="flex-1">
                                <LoanRepaymentCard year={viewYear} data={safeData} goalPercent={loanGoal} onGoalChange={(val) => updateGoal('loan', val)} />
                            </div>
                            <div className="flex-1">
                                <InvestmentStatusCard year={viewYear} data={safeData} goalPercent={investGoal} onGoalChange={(val) => updateGoal('invest', val)} />
                            </div>
                        </div>
                    </div>

                    {/* Row 3: 자산별 성장, 자금 흐름, 자산 포트폴리오 */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="h-64"><GlassCard className="p-6 h-full"><div className="flex items-center justify-between mb-4"><h3 className="font-bold text-slate-800 text-lg flex items-center gap-2"><Icons.Activity className="w-5 h-5 text-indigo-600"/> 자산별 성장</h3></div><div className="h-5/6"><ResponsiveContainer width="100%" height="100%"><LineChart data={assetGrowthData}><CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" /><XAxis dataKey="name" fontSize={10} stroke="#94a3b8" tickMargin={5} axisLine={false} tickLine={false} /><YAxis fontSize={10} width={40} stroke="#94a3b8" tickFormatter={(val) => `${(val/100000000).toFixed(1)}억`} axisLine={false} tickLine={false} /><RechartsTooltip formatter={(val) => formatCurrency(val)} contentStyle={{ borderRadius: '8px', padding: '6px 10px', border: 'none', boxShadow: '0 4px 6px -1px rgba(0, 0, 0, 0.1)' }} itemStyle={{ fontSize: '11px', padding: 0 }} labelStyle={{ fontSize: '11px', marginBottom: '2px' }} /><Legend iconType="circle" wrapperStyle={{ fontSize: '11px', paddingTop: '10px' }} />{Object.keys(ASSET_CATEGORIES).map((key) => (<Line key={key} type="monotone" dataKey={ASSET_CATEGORIES[key].label} stroke={ASSET_CATEGORIES[key].color} strokeWidth={2} dot={{r:0}} activeDot={{r:4}} />))}</LineChart></ResponsiveContainer></div></GlassCard></div>
                        <div className="h-64"><GlassCard className="p-6 h-full"><h3 className="font-bold text-slate-800 text-lg flex items-center gap-2 mb-4"><Icons.Banknote className="w-5 h-5 text-sky-500"/> 자금 흐름</h3><div className="h-5/6"><ResponsiveContainer width="100%" height="100%"><BarChart data={cashFlowData} barGap={4}><CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" /><XAxis dataKey="name" fontSize={10} stroke="#94a3b8" axisLine={false} tickLine={false} /><YAxis fontSize={10} width={40} stroke="#94a3b8" tickFormatter={(val) => `${(val/10000).toFixed(0)}만`} axisLine={false} tickLine={false} /><RechartsTooltip cursor={{fill: '#f8fafc'}} formatter={(val) => formatCurrency(val)} contentStyle={{ borderRadius: '8px', padding: '6px 10px', border: 'none', boxShadow: '0 4px 6px -1px rgba(0, 0, 0, 0.1)' }} itemStyle={{ fontSize: '11px', padding: 0 }} labelStyle={{ fontSize: '11px', marginBottom: '2px' }} /><Legend wrapperStyle={{fontSize:'11px'}} /><Bar dataKey="수입" fill="#38bdf8" radius={[4,4,0,0]} barSize={12} /><Bar dataKey="지출" stackId="out" fill="#fb7185" barSize={12} /><Bar dataKey="저축" stackId="out" fill="#34d399" barSize={12} /><Bar dataKey="투자" stackId="out" fill="#818cf8" radius={[4,4,0,0]} barSize={12} /></BarChart></ResponsiveContainer></div></GlassCard></div>
                        <div className="h-64"><GlassCard className="p-4 flex flex-col h-full"><h3 className="font-bold text-slate-800 text-lg flex items-center gap-2 mb-2"><Icons.PieChart className="w-5 h-5 text-pink-500"/> 자산 포트폴리오</h3><div className="flex-1 flex items-center gap-2 min-h-0"><div className="w-2/5 h-full relative"><ResponsiveContainer width="100%" height="100%"><PieChart><Pie data={portfolioData} cx="50%" cy="50%" innerRadius="60%" outerRadius="90%" paddingAngle={2} dataKey="value" cornerRadius={3} onMouseEnter={(_, index) => setActiveIndex(index)} onMouseLeave={() => setActiveIndex(null)} activeIndex={activeItem === null ? -1 : activeItem} activeShape={renderActiveShape}>{portfolioData.map((entry, index) => (<Cell key={`cell-${index}`} fill={entry.color} stroke="none" />))}</Pie></PieChart></ResponsiveContainer><div className="absolute inset-0 flex items-center justify-center pointer-events-none z-0"><span className="text-[10px] font-bold text-slate-400">Total</span></div></div><div className="w-3/5 h-full flex flex-col justify-center pr-1 overflow-y-auto custom-scrollbar"><div className="space-y-1">{portfolioData.map((entry, index) => (<div key={index} className={`flex justify-between items-center text-[10px] p-1 rounded transition-colors ${activeItem === index ? 'bg-slate-50' : ''}`} onMouseEnter={() => setActiveIndex(index)} onMouseLeave={() => setActiveIndex(null)}><div className="flex items-center gap-1.5 overflow-hidden"><div className="w-2 h-2 rounded-full flex-shrink-0" style={{ backgroundColor: entry.color }}></div><span className="font-bold text-slate-600 truncate" title={entry.name}>{entry.name}</span></div><div className="flex items-center gap-2 flex-shrink-0"><span className="font-bold text-slate-700">{formatCurrency(entry.value)}</span><span className="text-slate-400 font-mono w-8 text-right">{((entry.value/totalAssets)*100).toFixed(0)}%</span></div></div>))}</div></div></div></GlassCard></div>
                    </div>

                    {/* Row 4: 월별 자산 비율, 누적 자산 비율, AI 자산 분석 (1:1:1) */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="h-64"><MonthlyAssetRatioCard date={viewDate} data={safeData} /></div>
                        <div className="h-64"><YearlyRatioCard year={viewYear} data={safeData} /></div>
                        <div className="h-64">
                            <AIAnalysisCard assets={totalAssets} liabilities={liabilitiesExclJeonse} netWorth={netWorth} income={totalIncome} expense={totalExpense} year={viewYear} data={safeData} />
                        </div>
                    </div>

                    {/* Row 7: 메모 */}
                    <div className="grid grid-cols-1 gap-6">
                         <div className="h-48"><MemoCard memo={safeData.meta?.dashboardMemo} onUpdate={(val) => { const n = JSON.parse(JSON.stringify(safeData)); if(!n.meta) n.meta={}; n.meta.dashboardMemo=val; onUpdate(n); }} /></div>
                    </div>
                </div>
            );
        };

        // --- 9. Spreadsheet Component ---
        const GenericSpreadsheet = ({ data = {}, type, onUpdate, categories, hasCategory }) => {
            const safeData = data || {};
            const months = Object.keys(safeData).filter(isMonthKey).sort();
            const listKey = (type === 'stockProfit') ? 'stockProfit' : type;
            const [newItemName, setNewItemName] = useState('');
            const [targetCategory, setTargetCategory] = useState(hasCategory ? Object.keys(categories)[0] : '');
            const [isUploading, setIsUploading] = useState(false);
            const fileInputRef = useRef(null);
            const containerRef = useRef(null);
            
            const [hiddenItems, setHiddenItems] = useState(() => {
                const savedHidden = safeData.meta?.hiddenRows?.[type];
                return new Set(savedHidden || []);
            });
            
            const [showHidden, setShowHidden] = useState(false);
            const [hiddenMonths, setHiddenMonths] = useState(() => {
                const savedHidden = safeData.meta?.hiddenMonths?.[type];
                return new Set(savedHidden || []);
            });
            const [showHiddenMonths, setShowHiddenMonths] = useState(false);
            const [orderedItems, setOrderedItems] = useState({});

            const visibleMonths = useMemo(() => months.filter(m => showHiddenMonths || !hiddenMonths.has(m)), [months, showHiddenMonths, hiddenMonths]);

            // Auto-scroll to current month
            useEffect(() => {
                if (containerRef.current && visibleMonths.length > 0) {
                    const now = new Date();
                    const currentMonthStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
                    
                    setTimeout(() => {
                        const headerCell = containerRef.current.querySelector(`th[data-month="${currentMonthStr}"]`);
                        if (headerCell) {
                            headerCell.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                        } else {
                            const lastHeader = containerRef.current.querySelector('th:last-child');
                            if (lastHeader) {
                                lastHeader.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                            }
                        }
                    }, 150);
                }
            }, [type, visibleMonths.length]); // Re-run when switching spreadsheet types or visibility changes

            useEffect(() => {
                const savedHidden = safeData.meta?.hiddenRows?.[type];
                if (savedHidden) {
                    setHiddenItems(new Set(savedHidden));
                }
            }, [safeData.meta?.hiddenRows, type]);

            useEffect(() => {
                const savedHiddenMonths = safeData.meta?.hiddenMonths?.[type];
                if (savedHiddenMonths) {
                    setHiddenMonths(new Set(savedHiddenMonths));
                }
            }, [safeData.meta?.hiddenMonths, type]);

            const toggleHide = (name) => { 
                const next = new Set(hiddenItems); 
                if (next.has(name)) next.delete(name); 
                else next.add(name); 
                
                setHiddenItems(next); 

                const newData = JSON.parse(JSON.stringify(safeData));
                if (!newData.meta) newData.meta = {};
                if (!newData.meta.hiddenRows) newData.meta.hiddenRows = {};
                newData.meta.hiddenRows[type] = Array.from(next);
                onUpdate(newData);
            };

            const toggleHideMonth = (month) => {
                const next = new Set(hiddenMonths);
                if (next.has(month)) next.delete(month);
                else next.add(month);
                
                setHiddenMonths(next);

                const newData = JSON.parse(JSON.stringify(safeData));
                if (!newData.meta) newData.meta = {};
                if (!newData.meta.hiddenMonths) newData.meta.hiddenMonths = {};
                newData.meta.hiddenMonths[type] = Array.from(next);
                onUpdate(newData);
            };

            useEffect(() => {
                const currentUnique = new Set();
                const tempGroups = hasCategory ? Object.fromEntries(Object.keys(categories).map(k => [k, []])) : { ALL: [] };
                
                Object.values(safeData).forEach(m => { (m[listKey] || []).forEach(i => {
                    if (!currentUnique.has(i.name)) {
                        currentUnique.add(i.name);
                        const cat = hasCategory ? i.category : 'ALL';
                        const validCat = (hasCategory && categories[cat]) ? cat : (hasCategory ? Object.keys(categories)[0] : 'ALL');
                        
                        if(tempGroups[validCat]) {
                            tempGroups[validCat].push({ name: i.name, category: validCat });
                        }
                    }
                }); });

                setOrderedItems(prev => {
                    const next = { ...prev }; 
                    let changed = false;
                    const keys = hasCategory ? Object.keys(categories) : ['ALL'];
                    
                    keys.forEach(cat => {
                        const itemsInGroup = tempGroups[cat] || [];
                        itemsInGroup.sort((a, b) => a.name.localeCompare(b.name));

                        if (JSON.stringify(itemsInGroup) !== JSON.stringify(next[cat])) { next[cat] = itemsInGroup; changed = true; }
                    });
                    return changed ? next : prev;
                });
            }, [safeData, listKey, hasCategory, categories]);

            const handleReorder = (targetCat, fromName, toName, sourceCat) => {
                if (fromName === toName && targetCat === sourceCat) return;
                
                if (hasCategory && targetCat !== sourceCat) {
                    if(confirm(`'${fromName}' 항목을 '${categories[sourceCat]?.label}'에서 '${categories[targetCat]?.label}'(으)로 이동하시겠습니까?`)) {
                        const newData = JSON.parse(JSON.stringify(safeData));
                        
                        Object.keys(newData).forEach(month => {
                            if (isMonthKey(month) && newData[month][listKey]) {
                                const item = newData[month][listKey].find(i => i.name === fromName);
                                if (item) {
                                    item.category = targetCat;
                                }
                            }
                        });
                        
                        onUpdate(newData);
                    }
                }
            };

            const handleDeleteRow = (name) => { if (!confirm(`'${name}' 항목을 정말 삭제하시겠습니까?`)) return; const newData = JSON.parse(JSON.stringify(safeData)); Object.keys(newData).forEach(m => { if (isMonthKey(m) && newData[m][listKey]) newData[m][listKey] = newData[m][listKey].filter(i => i.name !== name); }); onUpdate(newData); };
            
            const handleRename = (oldN, newN) => { 
                if (!newN || oldN === newN) return;
                const newData = JSON.parse(JSON.stringify(safeData)); 
                
                Object.keys(newData).forEach(m => { 
                    if (isMonthKey(m) && newData[m][listKey]) { 
                        const item = newData[m][listKey].find(i => i.name === oldN); 
                        if (item) item.name = newN; 
                    } 
                }); 
                onUpdate(newData); 
            };
            
            const handleCellChange = (month, itemName, field, val, itemCategory) => {
                const newData = JSON.parse(JSON.stringify(safeData));
                if (!newData[month][listKey]) newData[month][listKey] = [];
                const list = newData[month][listKey];
                const idx = list.findIndex(i => i.name === itemName);
                if (idx >= 0) { list[idx][field] = val; } 
                else {
                    const newItem = { id: Date.now(), name: itemName };
                    if (hasCategory) newItem.category = itemCategory || targetCategory || Object.keys(categories)[0];
                    if(type === 'assets') newItem.value = 0; else if(type === 'stockProfit') { newItem.profit = 0; newItem.dividend = 0; } else newItem.amount = 0;
                    newItem[field] = val; list.push(newItem);
                }
                onUpdate(newData);
            };
            const handleAddRow = () => { if(!newItemName) return; const lastMonth = months[months.length-1]; if (lastMonth) { const defaultField = type === 'assets' ? 'value' : type === 'stockProfit' ? 'profit' : 'amount'; handleCellChange(lastMonth, newItemName, defaultField, 0); } setNewItemName(''); };
            
            const handleAddMonth = () => { 
                const last = months[months.length - 1]; 
                let newKey;
                if (!last) {
                    const now = new Date();
                    newKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
                } else {
                    const [y, m] = last.split('-').map(Number); 
                    let ny = y, nm = m + 1; 
                    if (nm > 12) { ny++; nm = 1; } 
                    newKey = `${ny}-${String(nm).padStart(2, '0')}`; 
                }
                
                const newData = JSON.parse(JSON.stringify(safeData)); 
                if (!newData[newKey]) newData[newKey] = { assets: [], loans: [], budget: [], stockProfit: [] }; 
                onUpdate(newData); 
            };

            const handleDeleteMonth = (month) => {
                if (!confirm(`${month} 데이터를 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.`)) return;
                const newData = JSON.parse(JSON.stringify(safeData));
                delete newData[month];
                onUpdate(newData);
            };

            return (
                <GlassCard className="flex flex-col h-[calc(100vh-180px)] overflow-hidden">
                    <div className="p-4 bg-white/50 border-b border-white/50 flex flex-wrap gap-3 justify-between items-center text-xs backdrop-blur-md z-40 relative">
                        <div className="flex gap-2 items-center">
                            {hasCategory && (
                                <select className="p-2 border border-white/60 rounded-xl bg-white/60 backdrop-blur-sm outline-none focus:ring-2 ring-indigo-500/20" value={targetCategory} onChange={(e) => setTargetCategory(e.target.value)}>
                                    {Object.entries(categories).map(([k, v]) => (<option key={k} value={k}>{v.label}</option>))}
                                </select>
                            )}
                            <input type="text" placeholder="항목명 입력" className="p-2 border border-white/60 rounded-xl bg-white/60 w-32 outline-none focus:ring-2 ring-indigo-500/20" value={newItemName} onChange={(e) => setNewItemName(e.target.value)} />
                            <GlassButton onClick={handleAddRow} active><Icons.Plus className="w-3.5 h-3.5"/> 추가</GlassButton>
                        </div>
                        <div className="flex gap-2 items-center">
                            <label className="flex items-center gap-1.5 text-slate-600 cursor-pointer select-none mr-2 px-2 py-1 rounded-lg hover:bg-white/40"><input type="checkbox" checked={showHidden} onChange={e => setShowHidden(e.target.checked)} className="rounded text-indigo-600"/> 숨김 항목</label>
                            <label className="flex items-center gap-1.5 text-slate-600 cursor-pointer select-none mr-2 px-2 py-1 rounded-lg hover:bg-white/40"><input type="checkbox" checked={showHiddenMonths} onChange={e => setShowHiddenMonths(e.target.checked)} className="rounded text-indigo-600"/> 숨김 열</label>
                            <button onClick={handleAddMonth} className="bg-emerald-500 text-white px-3 py-2.5 rounded-xl hover:bg-emerald-600 flex gap-1 font-bold shadow-emerald-200 shadow-md transition-all hover:-translate-y-0.5"><Icons.CalendarPlus className="w-3.5 h-3.5"/> 월 추가</button>
                            <input type="file" accept=".csv" ref={fileInputRef} className="hidden" onChange={(e) => processFileUpload(e.target.files[0], safeData, type, onUpdate, setIsUploading)} />
                            <GlassButton onClick={() => fileInputRef.current.click()} disabled={isUploading}>{isUploading ? <Icons.Loader2 className="w-3.5 h-3.5 animate-spin"/> : <Icons.Upload className="w-3.5 h-3.5"/>} CSV 업로드</GlassButton>
                            <GlassButton onClick={() => downloadCSV(safeData, type)}><Icons.Download className="w-3.5 h-3.5"/> CSV 다운로드</GlassButton>
                        </div>
                    </div>
                    <div className="flex-1 overflow-auto custom-scrollbar bg-white/30 relative">
                        <table className="min-w-max text-sm text-right border-collapse">
                            <thead className="bg-slate-50 text-slate-500 sticky top-0 z-40 shadow-sm">
                                <tr>
                                    <th className="sticky-col-header p-3 text-left border-r-2 border-slate-200 w-48 pl-8 font-bold">항목명</th>
                                    {visibleMonths.map(m => (
                                        <th key={m} className={`p-3 min-w-[110px] border-r border-slate-300 font-bold text-center text-slate-600 group/th relative ${hiddenMonths.has(m) ? 'bg-slate-100/50' : ''}`}>
                                            <div className="flex flex-col items-center justify-center gap-1">
                                                <span className="text-[10px] text-slate-400 font-medium tracking-tighter uppercase">{m.split('-')[0]}</span>
                                                <div className="flex items-center gap-1">
                                                    <span className="text-sm font-black">{m.split('-')[1]}월</span>
                                                    <button 
                                                        onClick={(e) => { e.stopPropagation(); toggleHideMonth(m); }}
                                                        className={`p-1 rounded-md transition-all shadow-sm border ${hiddenMonths.has(m) ? 'bg-emerald-50 border-emerald-200 text-emerald-600' : 'bg-white border-slate-200 text-slate-400 hover:text-indigo-600 hover:border-indigo-200'}`}
                                                        title={hiddenMonths.has(m) ? "열 보이기" : "열 숨기기"}
                                                    >
                                                        {hiddenMonths.has(m) ? <Icons.Eye className="w-3 h-3"/> : <Icons.EyeOff className="w-3 h-3"/>}
                                                    </button>
                                                </div>
                                                <button 
                                                    onClick={(e) => { e.stopPropagation(); handleDeleteMonth(m); }}
                                                    className="opacity-0 group-hover/th:opacity-100 p-1 hover:bg-rose-50 rounded text-slate-300 hover:text-rose-500 transition-all absolute top-1 right-1"
                                                    title="열 삭제"
                                                >
                                                    <Icons.X className="w-2.5 h-2.5"/>
                                                </button>
                                            </div>
                                        </th>
                                    ))}
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-200">
                            {(hasCategory ? Object.keys(categories) : ['ALL']).map(catKey => {
                                const items = orderedItems[catKey] || [];
                                const visibleItems = items.filter(i => showHidden || !hiddenItems.has(i.name));
                                if (hasCategory && visibleItems.length === 0) return null;
                                return (
                                    <React.Fragment key={catKey}>
                                        {hasCategory && (
                                            <tr className={`${categories[catKey].bg} border-y border-slate-200/50`}>
                                                <td className={`sticky-category p-3 text-left font-extrabold ${categories[catKey].text} ${categories[catKey].bg} backdrop-blur-md border-r border-slate-200/50 shadow-sm`}>{categories[catKey].label}</td>
                                                {visibleMonths.map(m => (<td key={m} className={`border-r border-slate-200/50 ${categories[catKey].bg}`}></td>))}
                                            </tr>
                                        )}
                                        {visibleItems.map((item, idx) => (
                                            <React.Fragment key={item.name}>
                                                <SortableRow key={item.name} item={item} category={catKey === 'ALL' ? null : catKey} onDrop={handleReorder} isHidden={hiddenItems.has(item.name)} onToggleHide={() => toggleHide(item.name)} onDelete={() => handleDeleteRow(item.name)} onRename={handleRename}>
                                                    {visibleMonths.map(month => {
                                                        const found = (safeData[month][listKey] || []).find(i => i.name === item.name);
                                                        if (type === 'stockProfit') {
                                                            const profit = found ? (found.profit || 0) : 0;
                                                            const dividend = found ? (found.dividend || 0) : 0;
                                                            return (
                                                                <td key={month} className="p-1 border-r border-slate-100 relative group/cell min-w-[120px]">
                                                                    <div className="flex flex-col gap-1">
                                                                        <div className="flex items-center gap-1 bg-white/40 rounded px-1">
                                                                            <span className="text-[9px] font-bold text-slate-400 w-3">P</span>
                                                                            <CurrencyInput value={profit} onChange={(v) => handleCellChange(month, item.name, 'profit', v, item.category)} className={`flex-1 text-right bg-transparent outline-none text-[11px] font-mono ${profit < 0 ? 'text-blue-500' : profit > 0 ? 'text-rose-500' : 'text-slate-600'}`} />
                                                                        </div>
                                                                        <div className="flex items-center gap-1 bg-indigo-50/30 rounded px-1 border-t border-indigo-100/50">
                                                                            <span className="text-[9px] font-bold text-indigo-400 w-3">D</span>
                                                                            <CurrencyInput value={dividend} onChange={(v) => handleCellChange(month, item.name, 'dividend', v, item.category)} className="flex-1 text-right bg-transparent outline-none text-[11px] font-mono text-emerald-600" />
                                                                        </div>
                                                                    </div>
                                                                </td>
                                                            );
                                                        } else {
                                                            const val = found ? (found.value ?? found.amount ?? 0) : 0;
                                                            const fieldName = type === 'assets' ? 'value' : 'amount';
                                                            return (
                                                                <td key={month} className="p-0 border-r border-slate-300/50 bg-white/30">
                                                                    <CurrencyInput value={val} onChange={(v) => handleCellChange(month, item.name, fieldName, v, item.category)} className="w-full h-full p-3 text-right bg-transparent focus:bg-indigo-100/50 focus:outline-none text-xs font-mono text-slate-700 hover:bg-indigo-50/30 transition-colors"/>
                                                                </td>
                                                            );
                                                        }
                                                    })}
                                                </SortableRow>
                                            </React.Fragment>
                                        ))}
                                        {/* Total Row - Summing ALL items (including hidden ones) */}
                                        {hasCategory && (
                                            <tr className="bg-slate-50 border-t border-slate-200 font-bold text-slate-700">
                                                <td className="sticky-sum-cell p-3 text-right border-r border-slate-200 text-xs">{categories[catKey].label} 합계</td>
                                                {visibleMonths.map(month => {
                                                    const sum = items.reduce((acc, item) => {
                                                        const found = (safeData[month][listKey] || []).find(i => i.name === item.name);
                                                        const val = found ? (found.value ?? found.amount ?? 0) : 0;
                                                        return acc + val;
                                                    }, 0);
                                                    return (
                                                        <td key={month} className="p-3 text-right border-r border-slate-200 text-xs bg-slate-50">
                                                            {formatCurrency(sum)}
                                                        </td>
                                                    );
                                                })}
                                            </tr>
                                        )}
                                    </React.Fragment>
                                );
                            })}
                            </tbody>
                        </table>
                    </div>
                </GlassCard>
            );
        };

        const SalarySheet = ({ data, onUpdate }) => {
            const salaryData = data.salary || { years: Array.from({length: 12}, (_, i) => String(2014 + i)), items: [{ id: 1, name: '융기', values: {} }, { id: 2, name: '수아', values: {} }] };
            const [years, setYears] = useState(salaryData.years);
            const fileInputRef = useRef(null);
            const containerRef = useRef(null);
            
            useEffect(() => { if (data.salary) setYears(data.salary.years); }, [data.salary]);

            // Auto-scroll to current year
            useEffect(() => {
                if (containerRef.current && years.length > 0) {
                    const currentYear = new Date().getFullYear().toString();
                    setTimeout(() => {
                        const headerCell = containerRef.current.querySelector(`th[data-year="${currentYear}"]`);
                        if (headerCell) {
                            headerCell.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                        } else {
                            const lastHeader = containerRef.current.querySelector('th:last-child');
                            if (lastHeader) {
                                lastHeader.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                            }
                        }
                    }, 150);
                }
            }, []);

            const handleValueChange = (itemId, year, val) => {
                const newData = JSON.parse(JSON.stringify(data));
                if (!newData.salary) newData.salary = salaryData;
                const item = newData.salary.items.find(i => i.id === itemId);
                if (item) { item.values[year] = val; onUpdate(newData); }
            };

            const addYear = () => {
                const lastYear = parseInt(years[years.length - 1]);
                const newYear = String(lastYear + 1);
                const newData = JSON.parse(JSON.stringify(data));
                if (!newData.salary) newData.salary = salaryData;
                newData.salary.years.push(newYear);
                newData.salary.items.forEach(item => item.values[newYear] = 0);
                onUpdate(newData);
            };

            const handleDeleteYear = (yearToDelete) => {
                if (!confirm(`${yearToDelete}년 데이터를 삭제하시겠습니까?`)) return;
                const newData = JSON.parse(JSON.stringify(data));
                if (!newData.salary) return;
                
                newData.salary.years = newData.salary.years.filter(y => y !== yearToDelete);
                newData.salary.items.forEach(item => {
                    if (item.values) delete item.values[yearToDelete];
                });
                onUpdate(newData);
            };

            const chartData = years.map(year => {
                const point = { year };
                salaryData.items.forEach(item => point[item.name] = item.values[year] || 0);
                return point;
            });

            const itemTotals = salaryData.items.map(item => ({
                id: item.id,
                name: item.name,
                total: Object.values(item.values).reduce((acc, val) => acc + (Number(val) || 0), 0)
            }));
            const grandTotal = itemTotals.reduce((acc, curr) => acc + curr.total, 0);

            // Witty Level Logic
            const getLevel = (total) => {
                if (total > 2000000000) return { label: '전생에 나라를 구한 재벌', color: 'text-amber-600', emoji: '🏰' };
                if (total > 1000000000) return { label: '자산가 꿈나무', color: 'text-emerald-600', emoji: '🏙️' };
                if (total > 500000000) return { label: '프로 일잘러', color: 'text-indigo-600', emoji: '☕' };
                if (total > 100000000) return { label: '성실한 개미', color: 'text-blue-600', emoji: '🐜' };
                return { label: '열정 가득 새내기', color: 'text-slate-500', emoji: '🥚' };
            };

            const mainLevel = getLevel(grandTotal);

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="bg-gradient-to-r from-indigo-600 to-violet-700 rounded-3xl p-8 text-white shadow-xl relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"></div>
                        <div className="relative z-10">
                            <h2 className="text-sm font-bold uppercase tracking-[0.2em] opacity-80 mb-2">Our Lifetime Earnings</h2>
                            <div className="flex flex-col md:flex-row md:items-end gap-4">
                                <span className="text-5xl font-black tracking-tighter">{formatCurrency(grandTotal)}</span>
                                <span className={`text-lg font-bold bg-white/20 backdrop-blur-md px-4 py-1 rounded-full mb-1 flex items-center gap-2`}>
                                    <span>{mainLevel.emoji}</span>
                                    <span>{mainLevel.label}</span>
                                </span>
                            </div>
                            <p className="mt-4 text-indigo-100 text-sm font-medium">
                                "열심히 번 당신, 고기 사 드세요! 🥩 우리는 오늘보다 내일 더 부자가 될 거예요."
                            </p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {itemTotals.map(it => {
                            const lv = getLevel(it.total);
                            return (
                                <GlassCard key={it.id} className="p-6 border-t-4 border-indigo-500">
                                    <div className="flex justify-between items-start mb-4">
                                        <div>
                                            <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">{it.name} 님의 누적 수령액</span>
                                            <h3 className="text-3xl font-black text-slate-800 tracking-tight mt-1">{formatCurrency(it.total)}</h3>
                                        </div>
                                        <div className="text-2xl">{lv.emoji}</div>
                                    </div>
                                    <div className={`text-xs font-bold ${lv.color} bg-slate-50 px-3 py-1.5 rounded-lg inline-block`}>
                                        Level: {lv.label}
                                    </div>
                                </GlassCard>
                            );
                        })}
                    </div>

                    <GlassCard className="p-6">
                        <div className="flex items-center justify-between mb-6">
                            <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                                <Icons.TrendingUp className="w-5 h-5 text-indigo-600"/> 
                                우리가 걸어온 '부'의 발자취
                            </h3>
                            <div className="text-[10px] text-slate-400 font-bold uppercase">Income History Chart</div>
                        </div>
                        <div className="h-72">
                            <ResponsiveContainer width="100%" height="100%">
                                <LineChart data={chartData}>
                                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                    <XAxis dataKey="year" fontSize={12} stroke="#94a3b8" axisLine={false} tickLine={false} />
                                    <YAxis fontSize={12} width={60} stroke="#94a3b8" tickFormatter={(val) => `${(val/10000).toFixed(0)}만`} axisLine={false} tickLine={false} />
                                    <RechartsTooltip formatter={(val) => formatCurrency(val)} contentStyle={{borderRadius: '16px', border: 'none', boxShadow: '0 10px 15px -3px rgba(0,0,0,0.1)'}} />
                                    <Legend iconType="circle" />
                                    <Line type="monotone" dataKey="융기" stroke="#3b82f6" strokeWidth={4} dot={{r: 4, strokeWidth: 2, fill: '#fff'}} activeDot={{r: 8, strokeWidth: 0}} />
                                    <Line type="monotone" dataKey="수아" stroke="#ec4899" strokeWidth={4} dot={{r: 4, strokeWidth: 2, fill: '#fff'}} activeDot={{r: 8, strokeWidth: 0}} />
                                </LineChart>
                            </ResponsiveContainer>
                        </div>
                    </GlassCard>

                    <GlassCard className="flex flex-col overflow-hidden">
                        <div className="p-5 bg-white/50 border-b border-slate-100 flex justify-between items-center backdrop-blur-md">
                            <div className="flex flex-col">
                                <span className="font-bold text-slate-800 text-sm">연도별 연봉 상세 데이터</span>
                                <span className="text-[10px] text-slate-400 font-medium mt-0.5">단위: 원 (원천징수 영수증 기준 권장)</span>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={addYear} className="bg-indigo-600 text-white px-4 py-2 rounded-xl flex items-center gap-2 hover:bg-indigo-700 transition-all font-bold text-xs shadow-md shadow-indigo-100 active:scale-95">
                                    <Icons.Plus className="w-4 h-4"/> 연도 추가
                                </button>
                                <input type="file" accept=".csv" ref={fileInputRef} className="hidden" onChange={(e) => {
                                    const file = e.target.files[0];
                                    if (!file) return;
                                    const reader = new FileReader();
                                    reader.onload = (ev) => {
                                        const text = ev.target.result;
                                        const lines = text.split(/\r\n|\n|\r/).filter(l => l.trim() !== '');
                                        if (lines.length < 2) return;
                                        const header = lines[0].split(',').map(s => s.trim().replace(/^"|"$/g, ''));
                                        const fileYears = header.slice(1);
                                        const newData = JSON.parse(JSON.stringify(data));
                                        if(!newData.salary) newData.salary = { years: [], items: [] };
                                        const allYears = Array.from(new Set([...newData.salary.years, ...fileYears])).sort();
                                        newData.salary.years = allYears;
                                        for(let i=1; i<lines.length; i++) {
                                            const row = lines[i].split(',').map(s => s.trim().replace(/^"|"$/g, ''));
                                            if(row.length < 2) continue;
                                            const name = row[0];
                                            let item = newData.salary.items.find(it => it.name === name);
                                            if (!item) { item = { id: Date.now() + i, name: name, values: {} }; newData.salary.items.push(item); }
                                            fileYears.forEach((year, idx) => { item.values[year] = parseFloat(row[idx+1] || 0); });
                                        }
                                        onUpdate(newData);
                                        alert("데이터가 성공적으로 불러와졌습니다! 🚀");
                                    };
                                    reader.readAsText(file);
                                }} />
                                <GlassButton onClick={() => fileInputRef.current.click()}><Icons.Upload className="w-3.5 h-3.5"/> 업로드</GlassButton>
                                <GlassButton onClick={() => {
                                    let csv = "data:text/csv;charset=utf-8,\uFEFF";
                                    csv += "Name," + years.join(",") + "\n";
                                    salaryData.items.forEach(item => {
                                        csv += `"${item.name}",` + years.map(y => item.values[y] || 0).join(",") + "\n";
                                    });
                                    const link = document.createElement("a");
                                    link.setAttribute("href", encodeURI(csv));
                                    link.setAttribute("download", "our_salary_history.csv");
                                    document.body.appendChild(link);
                                    link.click();
                                    document.body.removeChild(link);
                                }}><Icons.Download className="w-3.5 h-3.5"/> 다운로드</GlassButton>
                            </div>
                        </div>
                        <div className="overflow-auto custom-scrollbar" ref={containerRef}>
                            <table className="min-w-full text-sm text-right">
                                <thead className="bg-slate-50/80 text-slate-500">
                                    <tr>
                                        <th className="p-4 text-left w-28 font-bold border-r border-slate-100 sticky left-0 bg-slate-50/95 backdrop-blur-sm z-20 shadow-sm">이름</th>
                                        <th className="p-4 w-32 font-black text-indigo-600 border-r border-slate-100 sticky left-28 bg-indigo-50/95 backdrop-blur-sm z-20 shadow-sm">합계</th>
                                        {years.map(year => (
                                            <th key={year} data-year={year} className="p-4 min-w-[110px] font-bold border-r border-slate-100 last:border-0 group/th relative">
                                                <div className="flex items-center justify-center gap-1">
                                                    {year}
                                                    <button 
                                                        onClick={(e) => { e.stopPropagation(); handleDeleteYear(year); }}
                                                        className="opacity-0 group-hover/th:opacity-100 p-1.5 hover:bg-rose-100 rounded-lg text-rose-400 transition-all absolute right-1 top-1/2 -translate-y-1/2"
                                                        title="연도 삭제"
                                                    >
                                                        <Icons.X className="w-3 h-3"/>
                                                    </button>
                                                </div>
                                            </th>
                                        ))}
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {salaryData.items.map((item, idx) => {
                                        const itemTotal = Object.values(item.values).reduce((acc, val) => acc + (Number(val) || 0), 0);
                                        return (
                                            <tr key={item.id} className={`hover:bg-indigo-50/20 transition-colors group/tr ${idx % 2 === 0 ? 'bg-white' : 'bg-slate-50/30'}`}>
                                                <td className="p-4 text-left font-extrabold text-slate-700 bg-white sticky left-0 border-r border-slate-100 z-10 group-hover/tr:bg-indigo-50/50 transition-colors">{item.name}</td>
                                                <td className="p-4 text-right font-black text-indigo-600 bg-indigo-50/30 sticky left-28 border-r border-slate-100 z-10 group-hover/tr:bg-indigo-100/50 transition-colors">{formatCurrency(itemTotal)}</td>
                                                {years.map(year => (
                                                    <td key={year} className="p-0 border-r border-slate-100/50">
                                                        <CurrencyInput value={item.values[year] || 0} onChange={(val) => handleValueChange(item.id, year, val)} className="w-full h-full p-4 text-right bg-transparent focus:bg-white outline-none text-xs font-mono text-slate-600 hover:bg-white transition-all"/>
                                                    </td>
                                                ))}
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </GlassCard>
                </div>
            );
        };


        // --- 11. Sync Modal Component ---
        const SyncModal = ({ isOpen, onClose, currentId, onSyncIdChange }) => {
            const [inputValue, setInputValue] = useState('');
            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 animate-fade-in" onClick={onClose}>
                    <div className="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl m-4" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center mb-6">
                            <h3 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                                <div className="p-2 bg-indigo-100 rounded-lg text-indigo-600"><Icons.Cloud className="w-5 h-5"/></div>
                                기기 연동 (Data Sync)
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icons.X className="w-5 h-5"/></button>
                        </div>
                        
                        <div className="space-y-6">
                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                <label className="block text-xs font-bold text-slate-500 uppercase mb-2">현재 기기 연동 키 (Current Sync ID)</label>
                                <div className="flex gap-2">
                                    <code className="flex-1 bg-white border border-slate-200 rounded-lg p-3 text-xs font-mono text-slate-600 break-all select-all">
                                        {currentId}
                                    </code>
                                    <button 
                                        onClick={() => { navigator.clipboard.writeText(currentId); alert('복사되었습니다!'); }}
                                        className="p-3 bg-white border border-slate-200 rounded-lg text-slate-500 hover:text-indigo-600 hover:border-indigo-200 transition-colors"
                                    >
                                        <Icons.Copy className="w-4 h-4"/>
                                    </button>
                                </div>
                                <p className="text-[10px] text-slate-400 mt-2">
                                    * 이 키를 복사하여 다른 기기의 "기존 데이터 불러오기"에 입력하면 데이터가 연동됩니다.
                                </p>
                            </div>

                            <div className="border-t border-slate-100 pt-6">
                                <label className="block text-sm font-bold text-slate-700 mb-2">다른 기기의 데이터 불러오기</label>
                                <div className="flex gap-2">
                                    <input 
                                        type="text" 
                                        value={inputValue}
                                        onChange={(e) => setInputValue(e.target.value)}
                                        placeholder="연동 키 입력 (UUID)" 
                                        className="flex-1 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                                    />
                                    <button 
                                        onClick={() => {
                                            if(confirm('새로운 연동 키로 데이터를 불러오시겠습니까? 기존 데이터는 덮어씌워질 수 있습니다.')) {
                                                onSyncIdChange(inputValue.trim());
                                                onClose();
                                            }
                                        }}
                                        disabled={!inputValue.trim()}
                                        className="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                                    >
                                        불러오기
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 12. Main App ---
        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [user, setUser] = useState(null);
            const [syncId, setSyncId] = useState(() => localStorage.getItem('fm_sync_id') || crypto.randomUUID());
            const [theme, setTheme] = useState(() => localStorage.getItem('theme') || 'light');

            useEffect(() => {
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                localStorage.setItem('theme', theme);
            }, [theme]);

            const toggleTheme = () => setTheme(prev => prev === 'light' ? 'dark' : 'light');
            
            const [financialData, setFinancialData] = useState(() => {
                const saved = localStorage.getItem('financialData');
                const parsed = saved ? JSON.parse(saved) : generateInitialData();
                
                // Data Migration: Ensure new fields exist and cover 2014~2025
                const startYear = 2014;
                const endYear = 2025;
                const targetYears = [];
                for (let y = startYear; y <= endYear; y++) targetYears.push(String(y));

                if (!parsed.salary) {
                    parsed.salary = {
                        years: targetYears,
                        items: [
                            { id: 1, name: '융기', values: {} },
                            { id: 2, name: '수아', values: {} }
                        ]
                    };
                      // Initialize values to 0
                    parsed.salary.items.forEach(item => {
                        targetYears.forEach(y => item.values[y] = 0);
                    });
                } else {
                    // Update existing salary data to include 2014~2025 range if missing
                    const existingYears = new Set(parsed.salary.years);
                    let changed = false;
                    targetYears.forEach(y => {
                        if (!existingYears.has(y)) {
                            parsed.salary.years.push(y);
                            parsed.salary.items.forEach(item => {
                                if (item.values[y] === undefined) item.values[y] = 0;
                            });
                            changed = true;
                        }
                    });
                    if (changed) {
                        parsed.salary.years.sort();
                    }
                }

                if (!parsed.meta) parsed.meta = {};
                if (!parsed.meta.goals) parsed.meta.goals = { loan: 30, invest: 30, netWorth: 1000000000 };
                if (!parsed.meta.layout) parsed.meta.layout = {};
                if (!parsed.meta.hiddenRows) parsed.meta.hiddenRows = {};

                return parsed;
            });


            const [lastUpdated, setLastUpdated] = useState(Date.now());
            const [isSyncing, setIsSyncing] = useState(false);
            const [showSyncModal, setShowSyncModal] = useState(false);

            const updateFinancialData = (newData) => {
                setFinancialData(newData);
                setLastUpdated(Date.now());
            };

            useEffect(() => { localStorage.setItem('financialData', JSON.stringify(financialData)); }, [financialData]);
            useEffect(() => { if (!auth) return; const initAuth = async () => { if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token); else await signInAnonymously(auth); }; initAuth(); const unsubscribe = onAuthStateChanged(auth, setUser); return () => unsubscribe(); }, []);
            useEffect(() => { if (!user || !db) return; localStorage.setItem('fm_sync_id', syncId); const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'financial_sheets', syncId); const unsubscribe = onSnapshot(docRef, (docSnap) => { if (docSnap.exists()) { const cloudData = docSnap.data(); setFinancialData(prev => { if (JSON.stringify(prev) !== JSON.stringify(cloudData)) { return cloudData; } return prev; }); setLastUpdated(Date.now()); } }); return () => unsubscribe(); }, [user, syncId]);
            useEffect(() => { if (!user || !db) return; setIsSyncing(true); const timeoutId = setTimeout(async () => { try { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'financial_sheets', syncId), financialData); setIsSyncing(false); } catch (err) { console.error(err); } }, 1500); return () => clearTimeout(timeoutId); }, [financialData, user, syncId]);

            const handleResetData = () => { if (confirm("모든 데이터를 삭제하고 초기화하시겠습니까?")) { const initial = generateInitialData(); setFinancialData(initial); localStorage.removeItem('financialData'); } };

            const TABS = [
                {id: 'dashboard',  label: '대시보드',      icon: Icons.LayoutDashboard},
                {id: 'assets',     label: '자산 관리',     icon: Icons.Table2},
                {id: 'budget',     label: '수입/지출',     icon: Icons.Banknote},
                {id: 'loans',      label: '대출 관리',     icon: Icons.CreditCard},
                {id: 'stocks',     label: '주식 실현 손익', icon: Icons.CandlestickChart},
                {id: 'salary',     label: '연봉 관리',     icon: Icons.TrendingUp},
            ];

            const activeTabLabel = TABS.find(t => t.id === activeTab)?.label;

            return (
                <ErrorBoundary>
                    <div className="h-screen bg-[#F8FAFC] font-sans text-slate-800 selection:bg-slate-800 selection:text-white overflow-hidden flex flex-col">
                        {/* Removed playful blurred circles for a professional executive look */}
                        
                        {/* Sync Modal (Inline for brevity) */}
                        {showSyncModal && (
                            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 animate-fade-in" onClick={() => setShowSyncModal(false)}>
                                <div className="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl m-4" onClick={e => e.stopPropagation()}>
                                    <h3 className="text-xl font-bold mb-4">기기 연동</h3>
                                    <div className="bg-slate-50 p-4 rounded-xl mb-4 border border-slate-200"><label className="text-xs font-bold text-slate-500 block mb-2">현재 ID</label><code className="block bg-white p-2 rounded border border-slate-200 text-xs">{syncId}</code></div>
                                    <input type="text" placeholder="불러올 ID 입력" className="w-full p-3 border rounded-xl mb-4 text-sm" onKeyDown={(e) => { if(e.key === 'Enter') { if(confirm('데이터를 불러오시겠습니까?')) { setSyncId(e.target.value); setShowSyncModal(false); } } }} />
                                    <button onClick={() => setShowSyncModal(false)} className="w-full bg-slate-100 py-3 rounded-xl font-bold text-slate-600">닫기</button>
                                </div>
                            </div>
                        )}

                        {/* [MODIFIED] Top Navigation Bar (Replaced Sidebar) */}
                        <div className="sticky top-0 z-50 bg-white/80 backdrop-blur-xl border-b border-slate-200 shadow-sm shrink-0">
                            <div className="flex items-center justify-between px-6 lg:px-10 h-16 max-w-[1600px] mx-auto">
                                <div className="flex items-center gap-6">
                                    <div className="flex items-center gap-2 text-indigo-600 mr-4">
                                        <Icons.LayoutDashboard className="w-8 h-8" />
                                        <span className="text-xl font-black tracking-tighter text-slate-900 hidden sm:inline">FinMaster</span>
                                    </div>
                                    
                                    {/* Navigation Tabs */}
                                    <nav className="hidden md:flex items-center gap-1 overflow-x-auto no-scrollbar">
                                        {TABS.map(tab => (
                                            <button 
                                                key={tab.id} 
                                                onClick={() => setActiveTab(tab.id)} 
                                                className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${
                                                    activeTab === tab.id 
                                                    ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200' 
                                                    : 'text-slate-500 hover:bg-slate-100 hover:text-indigo-600'
                                                }`}
                                            >
                                                <tab.icon className={`w-4 h-4 ${activeTab === tab.id ? 'text-white' : 'text-slate-400'}`}/> 
                                                {tab.label}
                                            </button>
                                        ))}
                                    </nav>
                                </div>

                                <div className="flex items-center gap-3">
                                    <button onClick={() => setShowSyncModal(true)} className="text-xs font-bold text-slate-500 hover:text-indigo-600 flex items-center gap-1.5 transition-colors px-3 py-1.5 rounded-lg bg-white/50 hover:bg-white border border-transparent hover:border-indigo-100"><Icons.Cloud className={`w-3.5 h-3.5 ${isSyncing ? 'animate-pulse text-indigo-500' : ''}`}/><span className="hidden sm:inline">{isSyncing ? '저장 중...' : '연동'}</span></button>
                                    <button onClick={handleResetData} className="text-xs text-slate-400 hover:text-rose-500 flex items-center gap-1 transition-colors px-2 py-1 rounded-lg hover:bg-rose-50" title="초기화"><Icons.RefreshCw className="w-4 h-4"/></button>
                                </div>
                            </div>

                            {/* Mobile Nav (Visible only on small screens) */}
                            <div className="md:hidden overflow-x-auto no-scrollbar px-4 py-2 border-t border-slate-100 flex gap-2">
                                {TABS.map(tab => (
                                    <button 
                                        key={tab.id} 
                                        onClick={() => setActiveTab(tab.id)} 
                                        className={`flex-shrink-0 flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                                            activeTab === tab.id 
                                            ? 'bg-indigo-600 text-white' 
                                            : 'text-slate-500 bg-slate-50'
                                        }`}
                                    >
                                        {tab.label}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="flex-1 flex flex-col relative z-10 overflow-hidden">
                            <main className="flex-1 overflow-auto p-4 lg:p-8 custom-scrollbar">
                                <div className="max-w-[1600px] mx-auto space-y-6 pb-20">
                                    {activeTab === 'dashboard'  && <Dashboard key={lastUpdated} data={financialData} onUpdate={updateFinancialData} />}
                                    {activeTab === 'assets' && <GenericSpreadsheet data={financialData} type="assets" onUpdate={updateFinancialData} categories={ASSET_CATEGORIES} hasCategory={true} />}
                                    {activeTab === 'budget' && <GenericSpreadsheet data={financialData} type="budget" onUpdate={updateFinancialData} categories={BUDGET_CATEGORIES} hasCategory={true} />}
                                    {activeTab === 'loans' && <GenericSpreadsheet data={financialData} type="loans" onUpdate={updateFinancialData} hasCategory={false} />}
                                    {activeTab === 'stocks' && <GenericSpreadsheet data={financialData} type="stockProfit" onUpdate={updateFinancialData} hasCategory={false} />}
                                    {activeTab === 'salary' && <SalarySheet data={financialData} onUpdate={updateFinancialData} />}
                                </div>
                            </main>
                        </div>
                    </div>
                </ErrorBoundary>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
