                                        onChange={(e) => setLocalSpreadsheetId(e.target.value)}
                                        placeholder="Enter your Google Sheets Spreadsheet ID"
                                        className="w-full text-xs font-mono bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-cyan-500/50 transition-colors"
                                    />
                                    <span className="text-[9px] text-slate-500 mt-1 block">The unique alphanumeric string from your sheet's URL.</span>
                                </div>
                            </div>

                            <div className="flex items-center gap-2 pt-2">
                                <GlassButton onClick={handleSaveConfig} className="flex-1 justify-center py-2 border-white/10 text-white">
                                    Save Configuration
                                </GlassButton>
                                {googleToken ? (
                                    <button onClick={handleDisconnect} className="px-4 py-2 text-xs font-bold bg-rose-500/10 border border-rose-500/30 text-rose-400 rounded-lg hover:bg-rose-500/20 transition-all">
                                        Disconnect
                                    </button>
                                ) : (
                                    <button onClick={handleConnect} className="px-4 py-2 text-xs font-bold bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 rounded-lg hover:bg-cyan-500/20 transition-all">
                                        Connect & Fetch
                                    </button>
                                )}
                            </div>

                            {sdkError && (
                                <div className="text-xs text-rose-400 bg-rose-500/5 border border-rose-500/20 rounded-xl p-3 font-mono">
                                    Error: {sdkError}
                                </div>
                            )}
                        </GlassCard>

                        {/* Integration Status Card */}
                        <GlassCard className="p-6 space-y-4">
                            <h3 className="text-sm font-bold uppercase tracking-wider text-fuchsia-400 font-grotesk flex items-center gap-2">
                                <Icons.Activity className="w-4 h-4"/> Sync & Health Metrics
                            </h3>

                            <div className="space-y-3 text-xs font-mono">
                                <div className="flex justify-between py-1.5 border-b border-white/5">
                                    <span className="text-slate-400">Auth Status</span>
                                    <span className={googleToken ? "text-emerald-400 font-bold" : "text-rose-400 font-bold"}>
                                        {googleToken ? "AUTHORIZED" : "NOT AUTHORIZED"}
                                    </span>
                                </div>
                                <div className="flex justify-between py-1.5 border-b border-white/5">
                                    <span className="text-slate-400">Sync Status</span>
                                    <span className={`font-bold ${sheetSyncStatus.status === 'success' ? 'text-emerald-400' : sheetSyncStatus.status === 'fetching' ? 'text-amber-400 animate-pulse' : 'text-slate-400'}`}>
                                        {sheetSyncStatus.status.toUpperCase()}
                                    </span>
                                </div>
                                <div className="flex justify-between py-1.5 border-b border-white/5">
                                    <span className="text-slate-400">Last Synced</span>
                                    <span className="text-slate-200">{formatLastSync(sheetSyncStatus.lastSync)}</span>
                                </div>
                                <div className="flex justify-between py-1.5 border-b border-white/5">
                                    <span className="text-slate-400">Auto Refresh</span>
                                    <select 
                                        value={autoRefreshInterval} 
                                        onChange={(e) => {
                                            const v = parseInt(e.target.value);
                                            setAutoRefreshInterval(v);
                                            localStorage.setItem('sheets_refresh_interval', String(v));
                                        }}
                                        className="bg-[#0f1026] text-slate-200 border border-white/10 rounded px-2 py-0.5 text-xs focus:outline-none focus:border-cyan-500/50"
                                    >
                                        <option value={300000}>Every 5 min</option>
                                        <option value={900000}>Every 15 min</option>
                                        <option value={1800000}>Every 30 min</option>
                                        <option value={0}>Manual Only</option>
                                    </select>
                                </div>
                            </div>

                            {googleToken && (
                                <div className="pt-2">
                                    <GlassButton onClick={() => triggerSync(googleToken, googleSpreadsheetId)} disabled={sheetSyncStatus.status === 'fetching'} className="w-full justify-center py-2 text-cyan-400 border-cyan-500/20">
                                        <Icons.RefreshCw className={`w-3.5 h-3.5 ${sheetSyncStatus.status === 'fetching' ? 'animate-spin' : ''}`} />
                                        Refresh Data Now
                                    </GlassButton>
                                </div>
                            )}
                        </GlassCard>
                    </div>

                    {/* Sheet Rows Info Card */}
                    <GlassCard className="p-6 space-y-4">
                        <h3 className="text-sm font-bold uppercase tracking-wider text-cyan-400 font-grotesk flex items-center gap-2">
                            <Icons.Table2 className="w-4 h-4"/> Loaded Sheets Summary
                        </h3>
                        
                        <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                            {SHEET_RANGES.map(range => {
                                const details = sheetSyncStatus.sheets?.[range];
                                const hasData = details && details.rows > 0;
                                return (
                                    <div key={range} className="p-3 bg-white/5 rounded-xl border border-white/10 flex flex-col items-center justify-center text-center">
                                        <div className="text-[10px] font-bold text-slate-400 mb-1">{range}</div>
                                        <div className={`text-lg font-black font-grotesk ${hasData ? 'text-cyan-400' : 'text-slate-500'}`}>
                                            {hasData ? `${details.rows} rows` : '0 rows'}
                                        </div>
                                        <div className={`text-[8px] font-mono mt-1 ${hasData ? 'text-emerald-400' : 'text-slate-500'}`}>
                                            {hasData ? 'LOADED' : 'PENDING'}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </GlassCard>

                    {/* How-to instructions */}
                    <GlassCard className="p-6 space-y-3">
                        <h3 className="text-sm font-bold uppercase tracking-wider text-slate-200 font-grotesk flex items-center gap-1.5">
                            <Icons.Info className="w-4 h-4 text-cyan-400"/> Google Sheets API Integration Guide
                        </h3>
                        <div className="text-xs text-slate-400 space-y-2 leading-relaxed">
                            <p>1. Go to <a href="https://console.cloud.google.com" target="_blank" rel="noreferrer" className="text-cyan-400 underline">Google Cloud Console</a>, search for <strong>Google Sheets API</strong>, and enable it.</p>
                            <p>2. Configure the <strong>OAuth Consent Screen</strong> and add the <code>.../auth/spreadsheets.readonly</code> scope.</p>
                            <p>3. Create <strong>OAuth 2.0 Client ID</strong> credentials for a <strong>Web Application</strong>. Add your dashboard's URL to the <strong>Authorized JavaScript origins</strong>.</p>
                            <p>4. Copy the Client ID and paste it above, then click <strong>Connect & Fetch</strong> to grant access to your Google Sheets files.</p>
                        </div>
                    </GlassCard>
                </div>
            );
        };

        // --- Base UI Components ---
        const GlassCard = ({ children, className = "", onClick }) => (
            <div onClick={onClick} className={`quantum-card rounded-2xl transition-all duration-300 ${className}`}>
                {children}
            </div>
        );

        const GlassButton = ({ children, onClick, active, className = "", disabled }) => (
            <button onClick={onClick} disabled={disabled} className={`px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition-all duration-200 ${active ? 'bg-indigo-600 text-white border border-indigo-500 shadow-sm' : 'quantum-btn text-slate-700 dark:text-slate-300'} ${disabled ? 'opacity-50 cursor-not-allowed' : ''} ${className}`}>
                {children}
            </button>
        );

        const CollapsibleCard = ({ title, icon: Icon, children, className = "", initialOpen = true, headerExtra, noPadding = false }) => {
            const [isOpen, setIsOpen] = useState(initialOpen);
            return (
                <GlassCard className={`flex flex-col transition-all duration-300 ${isOpen ? '' : 'h-auto'} ${className}`}>
                    <div className="p-4 flex items-center justify-between cursor-pointer hover:bg-white/5 rounded-t-2xl transition-colors select-none" onClick={() => setIsOpen(!isOpen)}>
                        <div className="flex items-center gap-2">
                            {Icon && <div className="p-1.5 rounded-lg bg-cyan-500/10 border border-cyan-500/20 text-cyan-400"><Icon className="w-4 h-4" /></div>}
                            <h3 className="font-bold text-slate-200 text-xs sm:text-sm uppercase tracking-wider font-grotesk">{title}</h3>
                        </div>
                        <div className="flex items-center gap-2">
                            {headerExtra && <div onClick={e => e.stopPropagation()}>{headerExtra}</div>}
                            <div className="text-slate-500">
                                {isOpen ? <Icons.ChevronUp className="w-4 h-4" /> : <Icons.ChevronDown className="w-4 h-4" />}
                            </div>
                        </div>
                    </div>
                    {isOpen && (
                        <div className={`${noPadding ? '' : 'px-6 pb-6'} flex-1 flex flex-col min-h-0 animate-fade-in`}>
                            {children}
                        </div>
                    )}
                </GlassCard>
            );
        };

        // ─── Monthly Performance Report Card ───────────────────────────
        const PerformanceReport = ({ data = {}, viewDate }) => {
            const safeData = data || {};
            const currentData = safeData[viewDate] || { assets: [], loans: [], budget: [], stockProfit: [] };
            const prevMonthKey = getPreviousMonth(viewDate);
            const prevData = safeData[prevMonthKey] || null;

            const reStats = useMemo(() => {
                const list = safeData.realEstate || [];
                return {
                    totalValue: list.reduce((acc, item) => acc + (evaluateFormula(item.currentValue) || 0), 0),
                    ownedDebt: list.filter(i => i.ownershipType === 'OWN' || !i.ownershipType).reduce((acc, i) => acc + (evaluateFormula(i.loan) || 0) + (evaluateFormula(i.deposit) || 0), 0)
                };
            }, [safeData.realEstate]);

            const calcTotals = (monthData, meta) => {
                if (!monthData) return null;
                const assets  = (monthData.assets  || []).filter(a => !isItemHidden(a, 'assets',  meta)).reduce((s, a) => s + (evaluateFormula(a.value)  || 0), 0);
                const loans   = (monthData.loans   || []).filter(l => normalizeCategory(l.category, 'loans') !== 'LEASE' && !isItemHidden(l, 'loans', meta)).reduce((s, l) => s + (evaluateFormula(l.amount) || 0), 0);
                const income  = (monthData.budget  || []).filter(b => normalizeCategory(b.category, 'budget') === 'INCOME'  && !isItemHidden(b, 'budget', meta)).reduce((s, b) => s + (evaluateFormula(b.amount) || 0), 0);
                const expense = (monthData.budget  || []).filter(b => normalizeCategory(b.category, 'budget') === 'EXPENSE' && !isItemHidden(b, 'budget', meta)).reduce((s, b) => s + (evaluateFormula(b.amount) || 0), 0);
                const invest  = (monthData.budget  || []).filter(b => normalizeCategory(b.category, 'budget') === 'INVEST'  && !isItemHidden(b, 'budget', meta)).reduce((s, b) => s + (evaluateFormula(b.amount) || 0), 0);
                const liquid  = (monthData.assets  || []).filter(a => normalizeCategory(a.category, 'assets') === 'SAVINGS' && !isItemHidden(a, 'assets',  meta)).reduce((s, a) => s + (evaluateFormula(a.value)  || 0), 0);
                const stockPnl  = (monthData.stockProfit || []).filter(i => i.category === 'STOCK_PROFIT' && !isItemHidden(i, 'stockProfit', meta)).reduce((s, i) => s + (evaluateFormula(i.profit)   || 0), 0);
                const dividend  = (monthData.stockProfit || []).filter(i => i.category === 'DIVIDEND'     && !isItemHidden(i, 'stockProfit', meta)).reduce((s, i) => s + (evaluateFormula(i.dividend) || 0), 0);
                const totalAssetsWithRE = assets + reStats.totalValue;
                const totalLoansWithRE  = loans  + reStats.ownedDebt;
                return { assets: totalAssetsWithRE, loans: totalLoansWithRE, netWorth: totalAssetsWithRE - totalLoansWithRE, income, expense, invest, liquid, stockPnl, dividend };
            };

            const curr = useMemo(() => calcTotals(currentData, safeData.meta), [currentData, safeData.meta, reStats, viewDate]);
            const prev = useMemo(() => calcTotals(prevData,    safeData.meta), [prevData,    safeData.meta, reStats]);

            const hasAssets = (currentData.assets || []).length > 0 || reStats.totalValue > 0;
            const hasBudget = (currentData.budget || []).length > 0;
            const isReportReady = hasAssets && hasBudget;

            const metrics = useMemo(() => {
                if (!curr) return null;
                const assetGrowth    = prev && prev.assets > 0 ? ((curr.assets - prev.assets) / prev.assets) * 100 : null;
                const savingsRate    = curr.income > 0 ? ((curr.income - curr.expense) / curr.income) * 100 : null;
                const investRate     = curr.income > 0 ? (curr.invest / curr.income) * 100 : null;
                const netWorthDelta  = prev !== null ? curr.netWorth - prev.netWorth : null;
                const debtRatio      = curr.netWorth > 0 ? (curr.loans / curr.netWorth) * 100 : curr.loans > 0 ? 999 : 0;
                const prevDebtRatio  = prev && prev.netWorth > 0 ? (prev.loans / prev.netWorth) * 100 : prev && prev.loans > 0 ? 999 : 0;
                const debtRatioDelta = prev !== null ? debtRatio - prevDebtRatio : null;
                const emergencyIdx   = curr.expense > 0 ? curr.liquid / curr.expense : null;
                const stockContrib   = curr.income > 0 ? ((curr.stockPnl + curr.dividend) / curr.income) * 100 : null;

                let score = 0;
                score += assetGrowth  !== null ? Math.min(15, Math.max(0, (assetGrowth  / 1)  * 15)) : 7.5;
                score += savingsRate  !== null ? Math.min(20, Math.max(0, (savingsRate  / 20) * 20)) : 10;
                score += investRate   !== null ? Math.min(15, Math.max(0, (investRate   / 15) * 15)) : 7.5;
                score += netWorthDelta !== null ? (netWorthDelta >= 0 ? 15 : Math.max(0, 15 + (netWorthDelta / (Math.abs((prev && prev.netWorth) || 1))) * 15)) : 7.5;
                score += debtRatio <= 40 ? 15 : debtRatio >= 200 ? 0 : Math.max(0, 15 - ((debtRatio - 40) / 160) * 15);
                score += emergencyIdx !== null ? Math.min(10, (emergencyIdx / 6) * 10) : 5;
                score += stockContrib !== null ? (stockContrib >= 0 ? Math.min(10, stockContrib / 2) : 0) : 5;
                score = Math.round(Math.min(100, Math.max(0, score)));

                const grade = score >= 90 ? { label: 'A+', desc: 'Excellent', color: 'text-amber-400',   bg: 'from-amber-500/20 to-yellow-500/10',   border: 'border-amber-500/30',   emoji: '🏆' }
                    : score >= 75 ?          { label: 'A',  desc: 'Good',      color: 'text-emerald-400', bg: 'from-emerald-500/20 to-teal-500/10',   border: 'border-emerald-500/30', emoji: '✅' }
                    : score >= 50 ?          { label: 'B',  desc: 'Caution',   color: 'text-amber-400',   bg: 'from-amber-500/15 to-orange-500/10',   border: 'border-amber-500/30',   emoji: '⚠️' }
                    :                        { label: 'C',  desc: 'Alert',     color: 'text-rose-400',    bg: 'from-rose-500/20 to-red-500/10',       border: 'border-rose-500/30',    emoji: '🚨' };

                const metricList = [
                    { key: 'assetGrowth',   label: '자산 증가율',     value: assetGrowth,   format: v => `${v >= 0 ? '+' : ''}${v.toFixed(2)}%`, bar: assetGrowth !== null ? Math.min(100, Math.max(0, assetGrowth * 50 + 50)) : 50,   status: assetGrowth === null ? 'na' : assetGrowth >= 1 ? 'good' : assetGrowth >= 0 ? 'warn' : 'bad', hint: '전달 대비 총자산 증감률. +1% 이상 목표.',   arrow: assetGrowth !== null ? (assetGrowth >= 0 ? '↑' : '↓') : null, invertArrow: false },
                    { key: 'savingsRate',   label: '저축률',           value: savingsRate,   format: v => `${v.toFixed(1)}%`,                      bar: savingsRate !== null ? Math.min(100, Math.max(0, (savingsRate / 40) * 100)) : 50, status: savingsRate === null ? 'na' : savingsRate >= 20 ? 'good' : savingsRate >= 10 ? 'warn' : 'bad', hint: '(수입−지출)÷수입. 20% 이상 권장.',         arrow: null, invertArrow: false },
                    { key: 'investRate',    label: '투자 집중도',      value: investRate,    format: v => `${v.toFixed(1)}%`,                      bar: investRate !== null ? Math.min(100, Math.max(0, (investRate / 30) * 100)) : 50,   status: investRate === null ? 'na' : investRate >= 15 ? 'good' : investRate >= 5 ? 'warn' : 'bad',     hint: '투자금÷수입. 15% 이상 권장.',               arrow: null, invertArrow: false },
                    { key: 'netWorthDelta', label: '순자산 증가',      value: netWorthDelta, format: v => `${v >= 0 ? '+' : ''}${formatCurrency(Math.round(v))}`, bar: netWorthDelta !== null && prev && Math.abs(prev.netWorth) > 0 ? Math.min(100, Math.max(0, (netWorthDelta / Math.abs(prev.netWorth)) * 1000 + 50)) : 50, status: netWorthDelta === null ? 'na' : netWorthDelta > 0 ? 'good' : netWorthDelta === 0 ? 'warn' : 'bad', hint: '이번달 순자산(자산−부채) 변화액.', arrow: netWorthDelta !== null ? (netWorthDelta >= 0 ? '↑' : '↓') : null, invertArrow: false },
                    { key: 'debtRatio',     label: '부채비율',         value: debtRatio,     format: v => v >= 900 ? 'N/A' : `${v.toFixed(1)}%`,   bar: Math.min(100, Math.max(0, (debtRatio / 200) * 100)),  status: debtRatio < 40 ? 'good' : debtRatio < 100 ? 'warn' : 'bad', hint: '부채÷순자산. 40% 미만 권장.',  arrow: debtRatioDelta !== null ? (debtRatioDelta <= 0 ? '↓' : '↑') : null, arrowGood: debtRatioDelta !== null && debtRatioDelta <= 0, invertArrow: true },
                    { key: 'emergency',     label: '비상금 지수',      value: emergencyIdx,  format: v => `${v.toFixed(1)}개월`,                   bar: emergencyIdx !== null ? Math.min(100, (emergencyIdx / 12) * 100) : 50, status: emergencyIdx === null ? 'na' : emergencyIdx >= 6 ? 'good' : emergencyIdx >= 3 ? 'warn' : 'bad', hint: '유동자산÷월지출. 6개월 이상 권장.', arrow: null, invertArrow: false },
                    { key: 'stockContrib',  label: '주식수익 기여율',  value: stockContrib,  format: v => `${v >= 0 ? '+' : ''}${v.toFixed(1)}%`,  bar: stockContrib !== null ? Math.min(100, Math.max(0, (stockContrib / 20) * 100 + 50)) : 50, status: stockContrib === null ? 'na' : stockContrib > 5 ? 'good' : stockContrib >= 0 ? 'warn' : 'bad', hint: '(주식손익+배당)÷수입.',           arrow: stockContrib !== null ? (stockContrib >= 0 ? '↑' : '↓') : null, invertArrow: false },
                ];

                const summaryParts = [];
                if (assetGrowth  !== null) summaryParts.push(assetGrowth >= 1 ? `총 자산이 전달 대비 ${assetGrowth.toFixed(1)}% 증가했습니다.` : assetGrowth >= 0 ? `총 자산은 전달과 유사한 수준입니다.` : `총 자산이 전달 대비 ${Math.abs(assetGrowth).toFixed(1)}% 감소했습니다.`);
                if (savingsRate  !== null) summaryParts.push(savingsRate >= 20 ? `저축률 ${savingsRate.toFixed(1)}%로 목표(20%)를 초과 달성했습니다.` : savingsRate >= 0 ? `저축률이 ${savingsRate.toFixed(1)}%로, 목표(20%) 달성이 필요합니다.` : `이번 달 지출이 수입을 초과했습니다.`);
                if (emergencyIdx !== null && emergencyIdx < 6) summaryParts.push(`비상금이 ${emergencyIdx.toFixed(1)}개월치로 권장 기준(6개월)에 미치지 못합니다.`);

                const recommendations = [];
                if (debtRatio >= 40)                           recommendations.push({ icon: '🏦', text: `부채비율 ${debtRatio >= 900 ? 'N/A' : debtRatio.toFixed(1) + '%'}로 대출 상환 검토를 권장합니다.` });
                if (savingsRate !== null && savingsRate < 20)  recommendations.push({ icon: '💰', text: `저축률 ${savingsRate.toFixed(1)}%로 지출 절감이 필요합니다.` });
                if (emergencyIdx !== null && emergencyIdx < 3) recommendations.push({ icon: '⚡', text: `비상금이 ${emergencyIdx.toFixed(1)}개월치로 매우 부족합니다. 즉시 확충 권장.` });
                if (investRate !== null && investRate < 5)     recommendations.push({ icon: '📈', text: `투자 비율이 ${investRate.toFixed(1)}%로 낮습니다. 투자 확대를 고려하세요.` });
                if (recommendations.length === 0)              recommendations.push({ icon: '🎯', text: '모든 주요 지표가 목표 범위 내에 있습니다. 현재 기조를 유지하세요.' });

                return { metricList, score, grade, summary: summaryParts.join(' '), recommendations };
            }, [curr, prev]);

            const statusBg    = { good: 'bg-emerald-500', warn: 'bg-amber-500', bad: 'bg-rose-500', na: 'bg-slate-600' };
            const statusLabel = { good: 'GOOD', warn: 'WARN', bad: 'LOW',  na: 'N/A' };
            const statusText  = { good: 'text-emerald-400', warn: 'text-amber-400', bad: 'text-rose-400', na: 'text-slate-500' };

            if (!isReportReady) {
                return (
                    <GlassCard className="p-6 border-l-4 border-slate-600">
                        <div className="flex items-center gap-3 mb-4">
                            <div className="p-1.5 rounded-lg bg-slate-500/10 border border-slate-500/20 text-slate-400"><Icons.Activity className="w-4 h-4" /></div>
                            <h3 className="font-bold text-slate-300 text-sm uppercase tracking-wider font-grotesk">Monthly Performance Report</h3>
                            <span className="text-[10px] font-mono text-slate-500 bg-slate-500/10 px-2 py-0.5 rounded border border-slate-500/20">{viewDate}</span>
                        </div>
                        <div className="flex flex-col sm:flex-row items-start sm:items-center gap-6 py-2">
                            <div className="flex-shrink-0 w-14 h-14 rounded-full bg-slate-800/80 border border-slate-600/40 flex items-center justify-center">
                                <span className="text-2xl">⏳</span>
                            </div>
                            <div className="flex-1">
                                <p className="text-sm font-bold text-slate-300 mb-3">리포트를 생성하려면 구글시트 데이터가 필요합니다</p>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                    <div className={`flex items-center gap-2 text-xs px-3 py-2 rounded-lg border ${hasAssets ? 'border-emerald-500/30 bg-emerald-500/10 text-emerald-400' : 'border-slate-600/30 bg-slate-800/50 text-slate-500'}`}>
                                        <span>{hasAssets ? '✅' : '❌'}</span><span className="font-bold">Assets 데이터</span>
                                    </div>
                                    <div className={`flex items-center gap-2 text-xs px-3 py-2 rounded-lg border ${hasBudget ? 'border-emerald-500/30 bg-emerald-500/10 text-emerald-400' : 'border-slate-600/30 bg-slate-800/50 text-slate-500'}`}>
                                        <span>{hasBudget ? '✅' : '❌'}</span><span className="font-bold">Income/Expense 데이터</span>
                                    </div>
                                </div>
                                <p className="text-[10px] text-slate-500 mt-3">구글시트에 데이터를 입력하고 동기화하면 자동으로 리포트가 생성됩니다.</p>
                            </div>
                        </div>
                    </GlassCard>
                );
            }

            if (!metrics) return null;
            const { metricList, score, grade, summary, recommendations } = metrics;

            return (
                <GlassCard className={`border-l-4 ${grade.border} overflow-hidden`}>
                    <div className="px-6 pt-5 pb-4 flex flex-wrap items-center justify-between gap-3 border-b border-white/5">
                        <div className="flex items-center gap-3">
                            <div className="p-1.5 rounded-lg bg-cyan-500/10 border border-cyan-500/20 text-cyan-400"><Icons.Activity className="w-4 h-4" /></div>
                            <h3 className="font-bold text-slate-200 text-base uppercase tracking-wider font-grotesk">Monthly Performance Report</h3>
                            <span className="text-xs font-mono text-cyan-400 bg-cyan-500/10 px-2 py-0.5 rounded border border-cyan-500/20">{viewDate}</span>
                        </div>
                        <span className="text-[11px] font-bold text-slate-500 uppercase tracking-wider font-grotesk">vs {prevMonthKey}</span>
                    </div>
                    <div className="px-6 py-5">
                        <div className="grid grid-cols-1 lg:grid-cols-[200px_1fr] gap-6">
                            {/* 종합 점수판 */}
                            <div className={`flex flex-col items-center justify-center bg-gradient-to-br ${grade.bg} border ${grade.border} rounded-2xl p-5 relative overflow-hidden min-h-[180px]`}>
                                <div className="absolute top-0 right-0 w-20 h-20 rounded-full bg-white/10 blur-2xl -translate-y-1/2 translate-x-1/2 pointer-events-none" />
                                <div className="relative z-10 text-center">
                                    <div className="text-4xl mb-2">{grade.emoji}</div>
                                    <div className={`text-6xl font-black font-grotesk ${grade.color} leading-none`}>{score}</div>
                                    <div className="text-slate-400 text-xs font-bold mt-1 font-grotesk">/ 100점</div>
                                    <div className={`mt-3 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full border ${grade.border} ${grade.color} text-sm font-black font-grotesk`}>
                                        Grade <span className="text-xl leading-none">{grade.label}</span>
                                    </div>
                                    <div className={`text-xs font-bold mt-1 ${grade.color} opacity-70`}>{grade.desc}</div>
                                </div>
                            </div>
                            {/* 지표 바 */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-4">
                                {metricList.map(m => (
                                    <div key={m.key}>
                                        <div className="flex items-center justify-between mb-1.5">
                                            <div className="flex items-center gap-1.5">
                                                <span className={`text-[10px] font-black px-1.5 py-0.5 rounded ${statusText[m.status]} bg-white/5 border border-white/5`}>{statusLabel[m.status]}</span>
                                                <span className="text-xs font-bold text-slate-300">{m.label}</span>
                                            </div>
                                            <div className="flex items-center gap-1">
                                                {m.arrow && (
                                                    <span className={`text-xs font-black ${m.invertArrow ? (m.arrowGood ? 'text-emerald-400' : 'text-rose-400') : (m.arrow === '↑' ? 'text-emerald-400' : 'text-rose-400')}`}>{m.arrow}</span>
                                                )}
                                                <span className={`text-sm font-extrabold font-grotesk ${statusText[m.status]}`}>
                                                    {m.value !== null ? m.format(m.value) : '—'}
                                                </span>
                                            </div>
                                        </div>
                                        <div className="w-full bg-white/5 rounded-full h-2 overflow-hidden">
                                            <div className={`h-full rounded-full transition-all duration-700 ${statusBg[m.status]}`} style={{ width: `${Math.min(100, Math.max(2, m.bar))}%`, opacity: m.status === 'na' ? 0.3 : 1 }} />
                                        </div>
                                        <div className="text-[10px] text-slate-600 mt-0.5">{m.hint}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                        {summary && (
                            <div className="mt-5 px-4 py-3 bg-white/3 border border-white/8 rounded-xl">
                                <div className="flex items-center gap-1.5 mb-2">
                                    <Icons.Edit2 className="w-3.5 h-3.5 text-cyan-400" />
                                    <span className="text-[11px] font-black text-cyan-400 uppercase tracking-widest font-grotesk">이달의 분석 요약</span>
                                </div>
                                <p className="text-sm text-slate-300 leading-relaxed">{summary}</p>
                            </div>
                        )}
                        <div className="mt-3 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
                            {recommendations.map((r, i) => (
                                <div key={i} className="flex items-start gap-2 px-3 py-2.5 rounded-xl bg-white/3 border border-white/8 text-xs text-slate-400 leading-snug">
                                    <span className="text-base flex-shrink-0 mt-0.5">{r.icon}</span>
                                    <span>{r.text}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </GlassCard>
            );
        };

        // ─── Reports View ────────────────────────────────────────────────
        const ReportsView = ({ data = {} }) => {
            const safeData = data || {};
            const meta = safeData.meta || {};

            // 모든 월 키 수집
            const allMonths = Object.keys(safeData).filter(isMonthKey).sort();
            const availableYears = [...new Set(allMonths.map(m => m.substring(0, 4)))].sort().reverse();

            const [selectedYear, setSelectedYear] = useState(() => {
                if (availableYears.length > 0) return availableYears[0];
                return new Date().getFullYear().toString();
            });
            const [selectedMonth, setSelectedMonth] = useState(null);

            // 부동산 통계 (PerformanceReport와 동일한 로직)
            const reStats = useMemo(() => {
                const list = safeData.realEstate || [];
                return {
                    totalValue: list.reduce((acc, item) => acc + (evaluateFormula(item.currentValue) || 0), 0),
                    ownedDebt: list.filter(i => i.ownershipType === 'OWN' || !i.ownershipType)
                        .reduce((acc, i) => acc + (evaluateFormula(i.loan) || 0) + (evaluateFormula(i.deposit) || 0), 0)
                };
            }, [safeData.realEstate]);

            // 월별 지표 계산
            const calcMonthMetrics = (monthKey) => {
                const monthData = safeData[monthKey];
                if (!monthData) return null;
                const assets   = (monthData.assets  || []).filter(a => !isItemHidden(a, 'assets',  meta)).reduce((s, a) => s + (evaluateFormula(a.value)  || 0), 0);
                const loans    = (monthData.loans   || []).filter(l => normalizeCategory(l.category, 'loans') !== 'LEASE' && !isItemHidden(l, 'loans', meta)).reduce((s, l) => s + (evaluateFormula(l.amount) || 0), 0);
                const income   = (monthData.budget  || []).filter(b => normalizeCategory(b.category, 'budget') === 'INCOME'  && !isItemHidden(b, 'budget', meta)).reduce((s, b) => s + (evaluateFormula(b.amount) || 0), 0);
                const expense  = (monthData.budget  || []).filter(b => normalizeCategory(b.category, 'budget') === 'EXPENSE' && !isItemHidden(b, 'budget', meta)).reduce((s, b) => s + (evaluateFormula(b.amount) || 0), 0);
                const invest   = (monthData.budget  || []).filter(b => normalizeCategory(b.category, 'budget') === 'INVEST'  && !isItemHidden(b, 'budget', meta)).reduce((s, b) => s + (evaluateFormula(b.amount) || 0), 0);
                const liquid   = (monthData.assets  || []).filter(a => normalizeCategory(a.category, 'assets') === 'SAVINGS' && !isItemHidden(a, 'assets',  meta)).reduce((s, a) => s + (evaluateFormula(a.value)  || 0), 0);
                const stockPnl = (monthData.stockProfit || []).filter(i => i.category === 'STOCK_PROFIT' && !isItemHidden(i, 'stockProfit', meta)).reduce((s, i) => s + (evaluateFormula(i.profit)   || 0), 0);
                const dividend = (monthData.stockProfit || []).filter(i => i.category === 'DIVIDEND'     && !isItemHidden(i, 'stockProfit', meta)).reduce((s, i) => s + (evaluateFormula(i.dividend) || 0), 0);
                const totalAssets  = assets + reStats.totalValue;
                const totalLoans   = loans  + reStats.ownedDebt;
                const netWorth = totalAssets - totalLoans;
                const savingsRate  = income > 0 ? ((income - expense) / income) * 100 : null;
                const investRate   = income > 0 ? (invest / income) * 100 : null;
                const debtRatio    = netWorth > 0 ? (totalLoans / netWorth) * 100 : (totalLoans > 0 ? 999 : 0);
                const emergencyIdx = expense > 0 ? liquid / expense : null;
                const stockContrib = income > 0 ? ((stockPnl + dividend) / income) * 100 : null;
                const hasData = (monthData.assets || []).length > 0 && (monthData.budget || []).length > 0;
                return { assets: totalAssets, loans: totalLoans, netWorth, income, expense, invest, liquid, stockPnl, dividend, savingsRate, investRate, debtRatio, emergencyIdx, stockContrib, hasData };
            };

            // 선택 연도의 12개 월 데이터
            const yearMonths = useMemo(() => Array.from({ length: 12 }, (_, i) => {
                const monthKey = `${selectedYear}-${String(i + 1).padStart(2, '0')}`;
                const metrics = calcMonthMetrics(monthKey);
                const prevKey = getPreviousMonth(monthKey);
                const prevMetrics = calcMonthMetrics(prevKey);
                const netWorthDelta = (metrics && prevMetrics) ? metrics.netWorth - prevMetrics.netWorth : null;
                const assetGrowth = (metrics && prevMetrics && prevMetrics.assets > 0) ? ((metrics.assets - prevMetrics.assets) / prevMetrics.assets) * 100 : null;

                let score = null;
                let grade = null;
                if (metrics && metrics.hasData) {
                    let s = 0;
                    s += assetGrowth !== null ? Math.min(15, Math.max(0, (assetGrowth / 1) * 15)) : 7.5;
                    s += metrics.savingsRate !== null ? Math.min(20, Math.max(0, (metrics.savingsRate / 20) * 20)) : 10;
                    s += metrics.investRate !== null ? Math.min(15, Math.max(0, (metrics.investRate / 15) * 15)) : 7.5;
                    s += netWorthDelta !== null ? (netWorthDelta >= 0 ? 15 : Math.max(0, 15 + (netWorthDelta / Math.abs(prevMetrics?.netWorth || 1)) * 15)) : 7.5;
                    s += metrics.debtRatio <= 40 ? 15 : metrics.debtRatio >= 200 ? 0 : Math.max(0, 15 - ((metrics.debtRatio - 40) / 160) * 15);
                    s += metrics.emergencyIdx !== null ? Math.min(10, (metrics.emergencyIdx / 6) * 10) : 5;
                    s += metrics.stockContrib !== null ? (metrics.stockContrib >= 0 ? Math.min(10, metrics.stockContrib / 2) : 0) : 5;
                    score = Math.round(Math.min(100, Math.max(0, s)));
                    grade = score >= 90 ? { label: 'A+', color: 'text-amber-400', bg: 'bg-amber-500/10', border: 'border-amber-500/30', emoji: '🏆' }
                          : score >= 75 ? { label: 'A',  color: 'text-emerald-400', bg: 'bg-emerald-500/10', border: 'border-emerald-500/30', emoji: '✅' }
                          : score >= 50 ? { label: 'B',  color: 'text-amber-400', bg: 'bg-amber-500/10', border: 'border-amber-500/30', emoji: '⚠️' }
                          :               { label: 'C',  color: 'text-rose-400', bg: 'bg-rose-500/10', border: 'border-rose-500/30', emoji: '🚨' };
                }
                return { monthKey, month: i + 1, metrics, prevMetrics, netWorthDelta, assetGrowth, score, grade };
            }), [selectedYear, safeData, reStats]);

            // 연간 KPI 계산
            const annualKPI = useMemo(() => {
                const monthsWithData = yearMonths.filter(m => m.metrics && m.metrics.hasData);
                if (monthsWithData.length === 0) return null;
                const totalIncome  = monthsWithData.reduce((s, m) => s + m.metrics.income, 0);
                const totalExpense = monthsWithData.reduce((s, m) => s + m.metrics.expense, 0);
                const totalInvest  = monthsWithData.reduce((s, m) => s + m.metrics.invest, 0);
                const avgSavings   = totalIncome > 0 ? ((totalIncome - totalExpense) / totalIncome) * 100 : null;
                const avgDebtRatio = monthsWithData.reduce((s, m) => s + m.metrics.debtRatio, 0) / monthsWithData.length;
                // 연간 순자산 변화: 마지막 달 - 1년전 같은 달
                const lastM = monthsWithData[monthsWithData.length - 1];
                const firstM = monthsWithData[0];
                const netWorthDelta = lastM && firstM ? lastM.metrics.netWorth - firstM.metrics.netWorth : null;
                return { totalIncome, totalExpense, totalInvest, avgSavings, avgDebtRatio, netWorthDelta, monthCount: monthsWithData.length };
            }, [yearMonths]);

            const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

            return (
                <div className="space-y-6 animate-fade-in">
                    {/* ── 헤더 ── */}
                    <div className="flex items-center justify-between flex-wrap gap-3">
                        <div className="flex items-center gap-3">
                            <div className="p-2.5 rounded-xl bg-cyan-500/10 border border-cyan-500/20 text-cyan-400">
                                <Icons.Activity className="w-5 h-5" />
                            </div>
                            <div>
                                <h2 className="text-xl font-black text-white font-grotesk tracking-tight">Monthly Reports</h2>
                                <p className="text-xs text-slate-500">자산관리사 관점의 월별 재무 성과 분석</p>
                            </div>
                        </div>
                        {/* 연도 선택 */}
                        <div className="flex items-center gap-2">
                            {availableYears.map(y => (
                                <button key={y} onClick={() => { setSelectedYear(y); setSelectedMonth(null); }}
                                    className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all font-grotesk ${selectedYear === y ? 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/30' : 'text-slate-400 bg-white/5 border border-white/5 hover:border-white/20'}`}>
                                    {y}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* ── 연간 KPI 4개 ── */}
                    {annualKPI && (
                        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                            {[
                                { label: '연간 순자산 변화', value: annualKPI.netWorthDelta, format: v => `${v >= 0 ? '+' : ''}${formatCurrency(Math.round(v))}`, color: annualKPI.netWorthDelta >= 0 ? 'text-emerald-400' : 'text-rose-400', icon: Icons.TrendingUp, sub: `${annualKPI.monthCount}개월 누적` },
                                { label: '연평균 저축률', value: annualKPI.avgSavings, format: v => `${v.toFixed(1)}%`, color: annualKPI.avgSavings >= 20 ? 'text-emerald-400' : annualKPI.avgSavings >= 10 ? 'text-amber-400' : 'text-rose-400', icon: Icons.Coins, sub: '목표 20% 이상' },
                                { label: '연간 총 투자금액', value: annualKPI.totalInvest, format: v => formatCurrency(v), color: 'text-indigo-400', icon: Icons.CandlestickChart, sub: `수입 대비 ${annualKPI.totalIncome > 0 ? ((annualKPI.totalInvest/annualKPI.totalIncome)*100).toFixed(1) : 0}%` },
                                { label: '평균 부채비율', value: annualKPI.avgDebtRatio, format: v => v >= 900 ? 'N/A' : `${v.toFixed(1)}%`, color: annualKPI.avgDebtRatio < 40 ? 'text-emerald-400' : annualKPI.avgDebtRatio < 100 ? 'text-amber-400' : 'text-rose-400', icon: Icons.Building2, sub: '목표 40% 미만' },
                            ].map((kpi, i) => (
                                <GlassCard key={i} className="p-4 flex flex-col gap-2">
                                    <div className="flex items-center justify-between">
                                        <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">{kpi.label}</span>
                                        <div className="p-1.5 rounded-lg bg-white/5 text-slate-400"><kpi.icon className="w-3.5 h-3.5" /></div>
                                    </div>
                                    <div className={`text-2xl font-black font-grotesk ${kpi.color}`}>
                                        {kpi.value !== null ? kpi.format(kpi.value) : '—'}
                                    </div>
                                    <div className="text-[10px] text-slate-600 font-medium">{kpi.sub}</div>
                                </GlassCard>
                            ))}
                        </div>
                    )}

                    {/* ── 월별 카드 그리드 ── */}
                    <div className="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-6 gap-3">
                        {yearMonths.map(({ monthKey, month, metrics, netWorthDelta, assetGrowth, score, grade }) => {
                            const isSelected = selectedMonth === monthKey;
                            const hasData = metrics && metrics.hasData;
                            return (
                                <button key={monthKey} onClick={() => setSelectedMonth(isSelected ? null : monthKey)}
                                    className={`relative text-left p-3 rounded-2xl border transition-all duration-200 ${
                                        isSelected
                                            ? `${grade?.bg || 'bg-cyan-500/10'} ${grade?.border || 'border-cyan-500/30'} shadow-lg scale-[1.03]`
                                            : hasData
                                                ? 'bg-white/3 border-white/8 hover:bg-white/6 hover:border-white/15 hover:-translate-y-0.5'
                                                : 'bg-white/1 border-white/5 opacity-40 cursor-default'
                                    }`}
                                    disabled={!hasData}>
                                    {/* 월 이름 */}
                                    <div className="flex items-center justify-between mb-2">
                                        <span className="text-[10px] font-black text-slate-400 uppercase font-grotesk">{MONTH_NAMES[month - 1]}</span>
                                        {hasData && grade && (
                                            <span className={`text-[9px] font-black px-1.5 py-0.5 rounded-full ${grade.bg} ${grade.color} border ${grade.border}`}>
                                                {grade.label}
                                            </span>
                                        )}
                                    </div>
                                    {hasData ? (
                                        <>
                                            {/* 점수 */}
                                            <div className={`text-2xl font-black font-grotesk leading-none mb-1 ${grade?.color || 'text-white'}`}>{score}</div>
                                            <div className="text-[9px] text-slate-500 mb-2">/ 100</div>
                                            {/* 순자산 변화 */}
                                            {netWorthDelta !== null && (
                                                <div className={`text-[10px] font-bold ${netWorthDelta >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                                    {netWorthDelta >= 0 ? '↑' : '↓'} {formatCurrency(Math.abs(Math.round(netWorthDelta)))}
                                                </div>
                                            )}
                                            {/* 저축률 바 */}
                                            {metrics.savingsRate !== null && (
                                                <div className="mt-2">
                                                    <div className="flex justify-between mb-0.5">
                                                        <span className="text-[8px] text-slate-600">저축률</span>
                                                        <span className={`text-[8px] font-bold ${metrics.savingsRate >= 20 ? 'text-emerald-400' : 'text-amber-400'}`}>{metrics.savingsRate.toFixed(0)}%</span>
                                                    </div>
                                                    <div className="w-full bg-white/5 rounded-full h-1 overflow-hidden">
                                                        <div className={`h-full rounded-full ${metrics.savingsRate >= 20 ? 'bg-emerald-500' : metrics.savingsRate >= 10 ? 'bg-amber-500' : 'bg-rose-500'}`}
                                                             style={{ width: `${Math.min(100, Math.max(0, metrics.savingsRate))}%` }} />
                                                    </div>
                                                </div>
                                            )}
                                            {/* 선택 인디케이터 */}
                                            {isSelected && (
                                                <div className="absolute bottom-1 left-1/2 -translate-x-1/2 w-3 h-1 rounded-full bg-cyan-400" />
                                            )}
                                        </>
                                    ) : (
                                        <div className="text-[10px] text-slate-600 mt-2 font-medium">No data</div>
                                    )}
                                </button>
                            );
                        })}
                    </div>

                    {/* ── 상세 드릴다운 패널 ── */}
                    {selectedMonth && (
                        <div className="animate-fade-in">
                            <div className="flex items-center gap-2 mb-4">
                                <div className="h-px flex-1 bg-white/5" />
                                <span className="text-xs font-bold text-cyan-400 font-grotesk px-3 py-1 bg-cyan-500/10 border border-cyan-500/20 rounded-full">
                                    {selectedMonth} 상세 분석
                                </span>
                                <div className="h-px flex-1 bg-white/5" />
                            </div>

                            {/* 기존 PerformanceReport 재활용 */}
                            <PerformanceReport data={safeData} viewDate={selectedMonth} />

                            {/* 추가: 수입/지출 상세 브레이크다운 */}
                            {(() => {
                                const mData = safeData[selectedMonth];
                                if (!mData || !mData.budget || mData.budget.length === 0) return null;
                                const incomeItems  = mData.budget.filter(b => normalizeCategory(b.category, 'budget') === 'INCOME'  && !isItemHidden(b, 'budget', meta));
                                const expenseItems = mData.budget.filter(b => normalizeCategory(b.category, 'budget') === 'EXPENSE' && !isItemHidden(b, 'budget', meta));
                                const investItems  = mData.budget.filter(b => normalizeCategory(b.category, 'budget') === 'INVEST'  && !isItemHidden(b, 'budget', meta));
                                const totalIncome  = incomeItems.reduce((s, b)  => s + (evaluateFormula(b.amount) || 0), 0);
                                const totalExpense = expenseItems.reduce((s, b) => s + (evaluateFormula(b.amount) || 0), 0);
                                const totalInvest  = investItems.reduce((s, b)  => s + (evaluateFormula(b.amount) || 0), 0);
                                const groupByName = (items) => {
                                    const map = new Map();
                                    items.forEach(item => {
                                        const name = (item.name || '').trim();
                                        const amt = evaluateFormula(item.amount) || 0;
                                        if (map.has(name)) {
                                            map.get(name).amount += amt;
                                            map.get(name).count += 1;
                                        } else {
                                            map.set(name, { name, amount: amt, count: 1 });
                                        }
                                    });
                                    return Array.from(map.values());
                                };
                                const renderItems = (items, totalForRatio, color) => {
                                    const grouped = groupByName(items).sort((a, b) => b.amount - a.amount);
                                    return grouped.map((item, idx) => {
                                    const amt = item.amount;
                                    const pct = totalForRatio > 0 ? (amt / totalForRatio) * 100 : 0;
                                    return (
                                        <div key={idx} className="flex items-center gap-2 py-1.5 border-b border-white/5 last:border-0">
                                            <div className="flex-1 min-w-0">
                                                <div className="flex items-center justify-between mb-0.5">
                                                    <div className="flex items-center gap-1.5 min-w-0">
                                                        <span className="text-xs text-slate-300 font-medium truncate">{item.name}</span>
                                                        {item.count > 1 && (
                                                            <span className="text-[9px] font-bold text-slate-500 bg-white/5 border border-white/10 rounded px-1 flex-shrink-0">×{item.count}</span>
                                                        )}
                                                    </div>
                                                    <span className="text-xs font-bold text-slate-200 font-grotesk ml-2 flex-shrink-0">{formatCurrency(amt)}</span>
                                                </div>
                                                <div className="w-full bg-white/5 rounded-full h-1 overflow-hidden">
                                                    <div className={`h-full rounded-full ${color}`} style={{ width: `${Math.min(100, pct)}%` }} />
                                                </div>
                                            </div>
                                            <span className="text-[10px] text-slate-500 w-8 text-right flex-shrink-0">{pct.toFixed(0)}%</span>
                                        </div>
                                    );
                                });};
                                return (
                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 mt-4">
                                        <GlassCard className="p-5">
                                            <div className="flex items-center gap-2 mb-4">
                                                <div className="p-1.5 rounded-lg bg-emerald-500/10 text-emerald-400"><Icons.TrendingUp className="w-4 h-4" /></div>
                                                <div>
                                                    <h4 className="text-xs font-bold text-slate-200 uppercase tracking-wider">수입 내역</h4>
                                                    <p className="text-[10px] text-slate-500">Total {formatCurrency(totalIncome)}</p>
                                                </div>
                                            </div>

        const CurrencyInput = ({ value, onChange, className }) => {
            const [localValue, setLocalValue] = useState(String(value || 0));
            const [isEditing, setIsEditing] = useState(false);

            const calculate = (expression) => {
                if (typeof expression !== 'string') return expression;
                try {
                    const cleanExpr = expression.replace(/,/g, '').replace(/^=/, '');
                    if (!isNaN(cleanExpr) && cleanExpr.trim() !== '') return parseFloat(cleanExpr) || 0;
                    // Calculate simple arithmetic formulas
                    const result = Function(`'use strict'; return (${cleanExpr})`)();
                    return typeof result === 'number' ? result : 0;
                } catch (e) { return 0; }
            };

            useEffect(() => {
                if (!isEditing) {
                    const displayVal = (typeof value === 'string' && /[\+\-\*\/\(\)]/.test(value)) 
                        ? calculate(value) 
                        : value;
                    setLocalValue(formatNumberWithCommas(displayVal));
                }
            }, [value, isEditing]);

            const handleBlur = () => {
                setIsEditing(false);
                const cleanInput = localValue.replace(/,/g, '').trim();
                const isFormula = /[\+\-\*\/\(\)]/.test(cleanInput) && isNaN(cleanInput);
                const finalValue = isFormula ? cleanInput : (parseFloat(cleanInput) || 0);
                onChange(finalValue);
                setLocalValue(formatNumberWithCommas(calculate(cleanInput)));
            };

            return (
                <input 
                    type="text" 
                    value={localValue}
                    onChange={(e) => setLocalValue(e.target.value)}
                    onFocus={() => { setIsEditing(true); setLocalValue(String(value || 0).replace(/,/g, '')); }}

            const savingsRate = income > 0 ? ((income - expense) / income) * 100 : 0;
            let assetStatus = "Stable", assetColor = "text-emerald-400", assetBg = "bg-emerald-500";
