    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(241, 245, 249, 0.5); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .dark .custom-scrollbar::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.5s ease-out forwards; }

        .sticky-col-header { 
            position: sticky; 
            left: 0; 
            z-index: 50 !important; 
            background-color: rgba(248, 250, 252, 0.98); 
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px); 
            border-right: 2px solid #e2e8f0 !important;
        }
        .sticky-col-cell { 
            position: sticky; 
            left: 0; 
            z-index: 40 !important; 
            background-color: rgba(255, 255, 255, 0.98); 
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px); 
            border-right: 2px solid #e2e8f0 !important;
        }
        .sticky-sum-cell { 
            position: sticky; 
            left: 0; 
            z-index: 40 !important; 
            background-color: rgba(241, 245, 249, 0.98); 
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px); 
            border-right: 2px solid #cbd5e1 !important;
            font-weight: 800;
        }
        
        .dark .sticky-col-header { background-color: rgba(15, 23, 42, 0.95); border-right-color: #334155 !important; }
        .dark .sticky-col-cell { background-color: rgba(15, 23, 42, 0.95); border-right-color: #334155 !important; }
        .dark .sticky-sum-cell { background-color: rgba(30, 41, 59, 0.95); border-right-color: #475569 !important; }

        .sticky-category { 
            position: sticky; 
            left: 0; 
            z-index: 45 !important; 
            border-right: 2px solid rgba(0,0,0,0.05) !important;
        }
        .cursor-move { cursor: move; }
        
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

            Settings: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
            Flag: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></svg>,
            ShieldCheck: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>,
        };

        // --- Error Boundary & Utilities ---
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            componentDidCatch(error, errorInfo) { console.error("App Error:", error, errorInfo); }
            handleReset = () => {
                if (confirm("데이터를 초기화하고 복구하시겠습니까?")) {
                    localStorage.removeItem('financialData');
                    localStorage.removeItem('fm_sync_id'); 
                    window.location.reload();
                }
            };
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50 p-6 text-center">
                            <Icons.AlertOctagon className="w-16 h-16 text-rose-500 mb-4" />
                            <h2 className="text-2xl font-bold text-slate-800 mb-2">시스템 오류 발생</h2>
                            <p className="text-slate-600 mb-6">오류 내용: {this.state.error?.message || "알 수 없는 오류"}</p>
                            <button onClick={this.handleReset} className="bg-rose-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-rose-700 transition-colors shadow-lg">데이터 초기화 및 복구</button>
                        </div>
                    );
                }
                return this.props.children; 
            }
        }

        const formatCurrency = (value) => {
            if (typeof value !== 'number' || isNaN(value)) return '0';
            return new Intl.NumberFormat('ko-KR', { style: 'decimal', maximumFractionDigits: 0 }).format(value);
        };

        const formatNumberWithCommas = (value) => {
            if (!value && value !== 0) return '';
            return String(value).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        };

        const getPreviousMonth = (ym) => {
            if (!ym || typeof ym !== 'string') return '2024-01';
            const [y, m] = ym.split('-').map(Number);
            if (isNaN(y) || isNaN(m)) return '2024-01';
            let py = y - 1, pm = m; 
            if (py < 2024) return ym;
            return `${py}-${String(pm).padStart(2, '0')}`;
        };

        const isMonthKey = (key) => /^\d{4}-\d{2}$/.test(key);

        const generateInitialData = () => {
            const data = {};
            data['2024-01'] = { assets: [], loans: [], budget: [], stockProfit: [] };
            data.meta = { sortOrder: {}, dashboardMemo: '', hiddenRows: {}, goals: { loan: 30, invest: 30, netWorth: 1000000000 }, dashboardLayout: {} };
            // Initialize salary data with expanded range (2014~)
            const startYear = 2014;
            const endYear = 2025;
            const years = [];
            for (let y = startYear; y <= endYear; y++) years.push(String(y));
            
            data.salary = {
                years: years,
                items: [
                    { id: 1, name: '융기', values: {} },
                    { id: 2, name: '수아', values: {} }
                ]
            };
            // Initialize values to 0
            data.salary.items.forEach(item => {
                years.forEach(y => item.values[y] = 0);
            });
            
            return data;
        };

        const ASSET_CATEGORIES = {
            SAVINGS:       { label: '예적금',   color: '#3B82F6', bg: 'bg-blue-50',    text: 'text-blue-700' }, 
            INVESTMENT:    { label: '주식',     color: '#8B5CF6', bg: 'bg-violet-50',  text: 'text-violet-700' }, 
            COIN:          { label: '코인',     color: '#F59E0B', bg: 'bg-amber-50',   text: 'text-amber-700' }, 
            REAL_ESTATE:   { label: '부동산',   color: '#10B981', bg: 'bg-emerald-50', text: 'text-emerald-700' }, 
            PENSION:       { label: '연금',     color: '#EC4899', bg: 'bg-pink-50',    text: 'text-pink-700' }  
        };

        const BUDGET_CATEGORIES = {
            INCOME:  { label: '수입', type: 'income',  bg: 'bg-sky-100',  text: 'text-sky-900' },
            SAVING:  { label: '저축', type: 'expense', bg: 'bg-teal-50',  text: 'text-teal-700' }, 
            INVEST:  { label: '투자', type: 'expense', bg: 'bg-indigo-50', text: 'text-indigo-700' }, 
            EXPENSE: { label: '지출', type: 'expense', bg: 'bg-rose-50',  text: 'text-rose-700' },        
        };

        const normalizeCategory = (cat, type) => {
             if (!cat) return '';
            const upper = String(cat).toUpperCase().trim();
            if (type === 'assets') {
                if (['SAVING', 'SAVINGS', '예적금', '현금', '적금', '예금', '저축', 'BANK', 'DEPOSIT'].some(k => upper.includes(k))) return 'SAVINGS';
                if (['INVEST', 'STOCK', '주식', '증권', '펀드'].some(k => upper.includes(k))) return 'INVESTMENT';
                if (['COIN', 'CRYPTO', '코인', '비트코인'].some(k => upper.includes(k))) return 'COIN';
                if (['ESTATE', 'REAL', '부동산', '전세', '보증금', '아파트', '주택', 'REALESTATE'].some(k => upper.includes(k))) return 'REAL_ESTATE';
                if (['PENSION', 'IRP', '퇴직연금', '연금'].some(k => upper.includes(k))) return 'PENSION';
                if (ASSET_CATEGORIES[upper]) return upper;
                return 'SAVINGS'; 
            }
            if (type === 'budget') {
                if (['수입', '급여', '월급'].some(k => upper.includes(k))) return 'INCOME';
                if (['저축', '적금'].some(k => upper.includes(k)))          return 'SAVING';
                if (['투자'].some(k => upper.includes(k)))                  return 'INVEST';
                if (['지출', '소비', '카드'].some(k => upper.includes(k))) return 'EXPENSE';
                if (BUDGET_CATEGORIES[upper]) return upper;
                return 'EXPENSE'; 
            }
            if (type === 'loans') {
                if (upper === 'LEASE' || upper.includes('전세')) return 'LEASE';
                return 'LOAN';
            }
            return upper;
        };

        // ... (CSV Parsing functions remain same) ...
        const parseCSVLine = (text) => {
            const result = []; let current = ''; let inQuote = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (char === '"') inQuote = !inQuote;
                else if (char === ',' && !inQuote) { result.push(current.trim()); current = ''; } 
                else current += char;
            }
            result.push(current.trim());
            return result.map(cell => cell.replace(/^"|"$/g, '').replace(/""/g, ''));
        };

        const parseDateHeader = (header) => {
            if (!header) return null;
            let cleanHeader = header.replace(/^\uFEFF/, '').trim();
            const matchStandard = cleanHeader.match(/^(\d{4})[-./](\d{1,2})$/);
            if (matchStandard) return `${matchStandard[1]}-${String(matchStandard[2]).padStart(2, '0')}`;
            const matchShort = cleanHeader.match(/^(\d{2})[-./](\d{1,2})$/);
            if (matchShort) return `20${matchShort[1]}-${String(matchShort[2]).padStart(2, '0')}`;
            if (/^\d{6}$/.test(cleanHeader)) return `${cleanHeader.substring(0,4)}-${cleanHeader.substring(4,6)}`;
            const matchKorean = cleanHeader.match(/^(\d{4})년\s*(\d{1,2})월$/);
            if (matchKorean) return `${matchKorean[1]}-${String(matchKorean[2]).padStart(2, '0')}`;
            const months = { jan: '01', feb: '02', mar: '03', apr: '04', may: '05', jun: '06', jul: '07', aug: '08', sep: '09', oct: '10', nov: '11', dec: '12' };
            const lowerHeader = cleanHeader.toLowerCase();
            const matchEngYearFirst = lowerHeader.match(/^(\d{2})[-.\s]([a-z]{3})$/);
            if (matchEngYearFirst && months[matchEngYearFirst[2]]) return `20${matchEngYearFirst[1]}-${months[matchEngYearFirst[2]]}`;
            const matchEngMonthFirst = lowerHeader.match(/^([a-z]{3})[-.\s]?(\d{2,4})$/);
            if (matchEngMonthFirst && months[matchEngMonthFirst[1]]) {
                let year = matchEngMonthFirst[2]; if (year.length === 2) year = '20' + year;
                return `${year}-${months[matchEngMonthFirst[1]]}`;
            }
            return null;
        };

        const processFileUpload = (file, currentData, type, onUpdate, setIsUploading) => {
            if (!file) return;
            setIsUploading(true);
            const parseFile = (encoding) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.onerror = (e) => reject(e);
                    reader.readAsText(file, encoding);
                });
            };
            const processText = (text) => {
                if (text.charCodeAt(0) === 0xFEFF) text = text.substr(1);
                const lines = text.split(/\r\n|\n|\r/).filter(line => line.trim() !== '');
                if (lines.length < 2) return { success: false, message: "데이터가 부족합니다." };
                const header = parseCSVLine(lines[0]);
                const monthIndices = {};
                header.forEach((col, idx) => {
                    const parsedDate = parseDateHeader(col);
                    if (parsedDate) monthIndices[parsedDate] = idx;
                });
                if (Object.keys(monthIndices).length === 0) return { success: false, message: "날짜 컬럼을 찾을 수 없습니다." };
                const newData = JSON.parse(JSON.stringify(currentData));
                Object.keys(monthIndices).forEach(m => {
                    if (!newData[m]) newData[m] = { assets: [], loans: [], budget: [], stockProfit: [] };
                });
                for (let i = 1; i < lines.length; i++) {
                    const row = parseCSVLine(lines[i]);
                    if (row.length < 2) continue;
                    let category = ''; let name = '';
                    if (type === 'stockProfit') {
                        const rawType = (row[0] || '').trim().toUpperCase();
                        category = (rawType === 'PROFIT' || rawType === 'DIVIDEND') ? rawType : 'PROFIT'; 
                        name = (row[1] || '').trim();
                    } else {
                        category = normalizeCategory((row[0] || '').trim(), type); 
                        name = (row[1] || '').trim(); 
                    }
                    if (!name) continue;
                    Object.entries(monthIndices).forEach(([month, colIdx]) => {
                        const rawVal = row[colIdx] ? row[colIdx].replace(/,/g, '') : '0';
                        const val = parseFloat(rawVal) || 0;
                        if (!newData[month]) newData[month] = { assets: [], loans: [], budget: [], stockProfit: [] }; 
                        const listKey = type === 'stockProfit' ? 'stockProfit' : type;
                        if (!newData[month][listKey]) newData[month][listKey] = [];
                        const list = newData[month][listKey];
                        const existingItem = list.find(item => item.name === name);
                        if (existingItem) {
                            if (type === 'stockProfit') {
                                if (category === 'DIVIDEND') existingItem.dividend = val; else existingItem.profit = val;
                            } else {
                                if (category) existingItem.category = category;
                                if (type === 'assets') existingItem.value = val; else existingItem.amount = val;
                            }
                        } else {
                            const newItem = { id: Date.now() + Math.random() + i, name };
                            if (type === 'stockProfit') {
                                newItem.profit = 0; newItem.dividend = 0;
                                if (category === 'DIVIDEND') newItem.dividend = val; else newItem.profit = val;
                            } else {
                                if (category) newItem.category = category;
                                if (type === 'assets') newItem.value = val; else newItem.amount = val;
                            }
                            list.push(newItem);
                        }
                    });
                }
                return { success: true, data: newData };
            };
            parseFile('UTF-8').then(text => {
                let result = processText(text);
                if (result.success) { onUpdate(result.data); alert('데이터 업로드 완료!'); setIsUploading(false); } 
                else {
                    parseFile('EUC-KR').then(textKR => {
                        result = processText(textKR);
                        if (result.success) { onUpdate(result.data); alert('데이터 업로드 완료! (EUC-KR)'); } 
                        else { alert(`오류: ${result.message}\n(지원 형식: 2024-01, 24.01, 2024년 1월 등)`); }
                        setIsUploading(false);
                    }).catch(() => { alert(`오류: ${result.message}\n(지원 형식: 2024-01, 24.01, 2024년 1월 등)`); setIsUploading(false); });
                }
            }).catch(err => { console.error(err); alert("파일 읽기 실패"); setIsUploading(false); });
        };

        const downloadCSV = (data, type) => {
            const months = Object.keys(data).filter(isMonthKey).sort();
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
            let header = (type === 'stockProfit') ? "Type,Item" : "Category,Item";
            months.forEach(m => header += `,${m}`);
            csvContent += header + "\n";
            const listKey = type === 'stockProfit' ? 'stockProfit' : type;
            const uniqueItemsMap = new Map();
            months.forEach(m => { (data[m]?.[listKey] || []).forEach(item => { if (!uniqueItemsMap.has(item.name)) uniqueItemsMap.set(item.name, item.category || ''); }); });
            uniqueItemsMap.forEach((category, name) => {
                if (type === 'stockProfit') {
                    const rowProfit = [`PROFIT`, `"${name}"`];
                    const rowDividend = [`DIVIDEND`, `"${name}"`];
                    months.forEach(m => {
                        const found = (data[m]?.[listKey] || []).find(i => i.name === name);
                        rowProfit.push(found ? (found.profit || 0) : 0);
                        rowDividend.push(found ? (found.dividend || 0) : 0);
                    });
                    csvContent += rowProfit.join(",") + "\n" + rowDividend.join(",") + "\n";
                } else {
                    const row = [`"${category}"`, `"${name}"`];
                    months.forEach(m => {
                        const found = (data[m]?.[listKey] || []).find(i => i.name === name);
                        let val = 0;
                        if (found) { if (type === 'assets') val = found.value; else val = found.amount; }
                        row.push(val);
                    });
                    csvContent += row.join(",") + "\n";
                }
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `${type}_data.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // --- Base UI Components ---
        const GlassCard = ({ children, className = "", onClick }) => (
            <div onClick={onClick} className={`bg-white/90 backdrop-blur-xl border border-slate-100 shadow-sm rounded-2xl transition-all duration-300 hover:shadow-lg hover:-translate-y-1 ${className}`}>
                {children}
            </div>
        );

        const GlassButton = ({ children, onClick, active, className = "", disabled }) => (
            <button onClick={onClick} disabled={disabled} className={`px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition-all duration-200 border ${active ? 'bg-indigo-600 text-white border-indigo-500 shadow-sm' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:text-indigo-600'} ${disabled ? 'opacity-50 cursor-not-allowed' : ''} ${className}`}>
                {children}
            </button>
        );

        const CurrencyInput = ({ value, onChange, className }) => {
            const [localValue, setLocalValue] = useState(formatNumberWithCommas(value));
            const [isEditing, setIsEditing] = useState(false);
            useEffect(() => { if (!isEditing) setLocalValue(formatNumberWithCommas(value)); }, [value, isEditing]);
            const calculate = (expression) => {
                try {
                    const cleanExpr = expression.replace(/,/g, '');
                    if (cleanExpr.startsWith('=')) { const formula = cleanExpr.substring(1); if (/[^0-9+\-*/().\s]/.test(formula)) return null; return new Function('return ' + formula)(); }
                    return parseFloat(cleanExpr);
                } catch (e) { return null; }
            };
            const handleBlur = () => {
                setIsEditing(false);
                const result = calculate(localValue);
                if (result !== null && !isNaN(result) && isFinite(result)) { const finalVal = Math.round(result); onChange(finalVal); setLocalValue(formatNumberWithCommas(finalVal)); } 
                else { setLocalValue(formatNumberWithCommas(value)); }
            };
            return (
                <input type="text" value={localValue} onChange={(e) => setLocalValue(e.target.value)} onFocus={() => { setIsEditing(true); setLocalValue(value === 0 ? '' : String(value)); }} onBlur={handleBlur} onKeyDown={(e) => e.key === 'Enter' && e.target.blur()} className={`bg-transparent border-none outline-none w-full text-right font-medium text-slate-700 placeholder:text-slate-300 focus:ring-0 ${className}`} />
            );
        };

        const SortableRow = ({ item, category, onDrop, children, isHidden, onToggleHide, onDelete, onRename }) => {
            const [isEditing, setIsEditing] = useState(false);
            const [newName, setNewName] = useState(item.name);
            useEffect(() => { setNewName(item.name); }, [item.name]);
            const handleDragStart = (e) => { if (isEditing) { e.preventDefault(); return; } e.dataTransfer.setData('app/json', JSON.stringify({ name: item.name, category })); };
            const handleDrop = (e) => { e.preventDefault(); try { const data = JSON.parse(e.dataTransfer.getData('app/json')); if (data.name !== item.name) onDrop(category, data.name, item.name, data.category); } catch (err) {} };
            const saveName = () => { if (newName && newName !== item.name) onRename(item.name, newName); setIsEditing(false); };
            return (
                <tr draggable={!isEditing} onDragStart={handleDragStart} onDragOver={(e) => e.preventDefault()} onDrop={handleDrop} className={`group transition-colors border-b border-slate-200 last:border-0 hover:bg-indigo-50/30 odd:bg-white/50 even:bg-slate-50/50 ${isHidden ? 'opacity-40 bg-slate-100/50' : ''}`}>
                    <td className="sticky-col-cell border-r-2 border-slate-200 align-middle">
                        <div className="flex items-center gap-2 p-3 min-w-[220px]">
                            <div className="cursor-grab active:cursor-grabbing p-1.5 hover:bg-white rounded-lg text-slate-400 transition-colors"><Icons.GripVertical className="w-4 h-4" /></div>
                            <button onClick={(e) => { e.stopPropagation(); onToggleHide(); }} className="p-1.5 text-slate-400 hover:text-indigo-500 rounded-lg hover:bg-white transition-colors">{isHidden ? <Icons.EyeOff className="w-3.5 h-3.5"/> : <Icons.Eye className="w-3.5 h-3.5"/>}</button>
                            {isEditing ? (
                                <div className="flex items-center flex-1">
                                    <input autoFocus type="text" value={newName} onChange={(e) => setNewName(e.target.value)} onBlur={saveName} onKeyDown={(e) => { if (e.key === 'Enter' && !e.nativeEvent.isComposing) saveName(); }} className="bg-white border border-indigo-300 rounded-lg px-2 py-1 text-sm w-full focus:outline-none shadow-sm text-left" onClick={(e) => e.stopPropagation()} />
                                    <button onClick={saveName} className="p-1.5 text-emerald-600 ml-1"><Icons.Check className="w-3.5 h-3.5" /></button>
                                </div>
                            ) : (
                                <div className="flex items-center flex-1 min-w-0 cursor-text group/edit" onClick={() => setIsEditing(true)}>
                                    <span className="truncate text-sm font-bold text-slate-700 flex-1 text-left" title={item.name}>{item.name}</span>
                                    <button className="p-1.5 text-slate-300 hover:text-indigo-600 opacity-0 group-hover/edit:opacity-100 transition-opacity"><Icons.Edit2 className="w-3.5 h-3.5" /></button>
                                </div>
                            )}
                            <button onClick={(e) => { e.stopPropagation(); onDelete(); }} className="p-1.5 text-slate-300 hover:text-rose-500 rounded-lg ml-1 opacity-0 group-hover:opacity-100 transition-opacity"><Icons.Trash2 className="w-3.5 h-3.5" /></button>
                        </div>
                    </td>
                    {children}
                </tr>
            );
        };

        const renderActiveShape = (props) => {
            const { cx, cy, innerRadius, outerRadius, startAngle, endAngle, fill } = props;
            return (
                <g>
                    <Sector cx={cx} cy={cy} innerRadius={innerRadius} outerRadius={outerRadius + 6} startAngle={startAngle} endAngle={endAngle} fill={fill} />
                    <Sector cx={cx} cy={cy} startAngle={startAngle} endAngle={endAngle} innerRadius={outerRadius + 6} outerRadius={outerRadius + 10} fill={fill} />
                </g>
            );
        };

        // --- Widget Components ---

        const CompactScoreCard = ({ title, value, yoy, icon: Icon, colorClass, tooltip, breakdown }) => {
            let trendColor = 'text-slate-400', trendBg = 'bg-slate-100', TrendIcon = Icons.TrendingUp;
            if (yoy !== undefined && yoy !== null && !isNaN(yoy) && value !== 0) {
                if (yoy > 0) { trendColor = 'text-rose-600'; trendBg = 'bg-rose-50'; TrendIcon = Icons.TrendingUp; } 
                else if (yoy < 0) { trendColor = 'text-blue-600'; trendBg = 'bg-blue-50'; TrendIcon = Icons.TrendingDown; }
            }
            let valueColor = colorClass || 'text-slate-800';
            if (title.includes('손익') || title.includes('수익')) { if (value > 0) valueColor = 'text-rose-600'; else if (value < 0) valueColor = 'text-blue-600'; }
            return (

                 <div className="flex items-center gap-1.5 mb-2"><div className="p-1 rounded bg-white text-indigo-600 shadow-sm"><Icons.Calendar className="w-3 h-3"/></div><span className="text-[10px] font-bold text-slate-500 uppercase tracking-wider">{year}년 누적 실적</span></div>

            </div>

        const SalarySheet = ({ data, onUpdate }) => {

                    const header = lines[0].split(',').map(s => s.trim().replace(/^"|"$/g, ''));

                            <div className="flex gap-2">
                                <button onClick={addYear} className="bg-indigo-600 text-white px-3 py-1.5 rounded-lg flex items-center gap-1 hover:bg-indigo-700 transition-colors"><Icons.Plus className="w-3.5 h-3.5"/> 연도 추가</button>
                                <input type="file" accept=".csv" ref={fileInputRef} className="hidden" onChange={(e) => processSalaryFileUpload(e.target.files[0])} />

                                <GlassButton onClick={downloadSalaryCSV}><Icons.Download className="w-3.5 h-3.5"/> 다운로드</GlassButton>
                            </div>
                        </div>
                        <div className="overflow-auto custom-scrollbar">
                            <table className="min-w-full text-sm text-right">
                                <thead className="bg-slate-50 text-slate-500">
                                    <tr>
                                        <th className="p-3 text-left w-24 font-bold border-r border-slate-200 sticky left-0 bg-slate-50 z-10">이름</th>
                                        <th className="p-3 w-28 font-black text-indigo-600 border-r border-slate-200 sticky left-24 bg-slate-50 z-10">누계</th>

                                                        onClick={(e) => { e.stopPropagation(); handleDeleteYear(year); }}

                                                    </button>

    {salaryData.items.map((item, idx) => {
        const itemTotal = Object.values(item.values).reduce((acc, val) => acc + (Number(val) || 0), 0);

                    </td>

            </tr>
        );
    })}
</tbody>
                            </table>
                        </div>

            if (assetStatus === "위험") { adviceTitle = "재무 구조 개선이 시급합니다."; adviceDetail = "부채 비율이 위험 수준입니다. 고정 지출을 줄이고 부채 상환을 최우선으로 하세요."; } 
            else if (budgetStatus === "적자") { adviceTitle = "지출 통제가 필요합니다."; adviceDetail = "수입보다 지출이 많습니다. 불필요한 소비를 점검하고 예산을 다시 세우세요."; }

                                    <span
                                        className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${
                                            assetStatus === "안정"
                                                ? "bg-emerald-500/20 text-emerald-300"
                                                : assetStatus === "주의"
                                                    ? "bg-amber-500/20 text-amber-300"

                                    <span
                                        className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${
                                            budgetStatus === "양호"

        const MonthlyAssetRatioCard = ({ date, data }) => {
             const stats = useMemo(() => {
                const budget = data[date]?.budget || [];
                const income = budget.filter(b => (b.category === 'INCOME' || normalizeCategory(b.category || b.name, 'budget') === 'INCOME')).reduce((a,b) => a + (Number(b.amount) || 0), 0);
                const expense = budget.filter(b => (b.category === 'EXPENSE' || normalizeCategory(b.category || b.name, 'budget') === 'EXPENSE')).reduce((a,b) => a + (Number(b.amount) || 0), 0);
                const saving = budget.filter(b => (b.category === 'SAVING' || normalizeCategory(b.category || b.name, 'budget') === 'SAVING')).reduce((a,b) => a + (Number(b.amount) || 0), 0);
                const invest = budget.filter(b => (b.category === 'INVEST' || normalizeCategory(b.category || b.name, 'budget') === 'INVEST')).reduce((a,b) => a + (Number(b.amount) || 0), 0);
