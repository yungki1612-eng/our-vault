    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {

        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fade-in 0.5s ease-out forwards;
        }

        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-slide-up-fade {
            animation: slideUpFade 0.65s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        /* ===== Recharts Tooltip Glassmorphism Customization ===== */
        .recharts-tooltip-wrapper {
            outline: none !important;
            box-shadow: none !important;
            border: none !important;
        }
        .recharts-tooltip-wrapper:focus, .recharts-tooltip-wrapper:active {
            outline: none !important;
            box-shadow: none !important;
            border: none !important;
        }
        .recharts-default-tooltip {
            background: rgba(15, 23, 42, 0.85) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 12px !important;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.05), 0 0 15px 0 rgba(49, 130, 246, 0.15) !important;

        .recharts-tooltip-label {

            font-family: 'Space Grotesk', sans-serif !important;
        }
        .recharts-tooltip-item {
            font-size: 11px !important;
            padding: 1px 0 !important;
        }

        /* Gyroscope/Mobile 3D Spinner */
        .gyro-container {
            width: 14px;
            height: 14px;
            position: relative;
            perspective: 80px;
            display: inline-block;
            vertical-align: middle;
        }
        .gyro-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 1px solid rgba(49, 130, 246, 0.4);
            border-radius: 50%;
        }
        .gyro-ring-1 {
            animation: gyro-rotate-1 2.5s linear infinite;
            border-color: rgba(16, 185, 129, 0.6); /* emerald */
        }
        .gyro-ring-2 {
            animation: gyro-rotate-2 2.5s linear infinite;
            border-color: rgba(49, 130, 246, 0.6); /* blue */
        }
        .gyro-ring-3 {
            animation: gyro-rotate-3 2.5s linear infinite;
            border-color: rgba(236, 72, 153, 0.6); /* pink */
        }
        .gyro-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 3px;
            height: 3px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 6px #10b981;
        }

        @keyframes gyro-rotate-1 {
            0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(360deg) rotateY(180deg) rotateZ(360deg); }
        }
        @keyframes gyro-rotate-2 {
            0% { transform: rotateX(120deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(480deg) rotateY(360deg) rotateZ(180deg); }
        }
        @keyframes gyro-rotate-3 {
            0% { transform: rotateX(240deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(600deg) rotateY(180deg) rotateZ(540deg); }
        }

        /* ===== Quantum Glassmorphism Theme ===== */
        .quantum-card {
            background: rgba(255, 255, 255, 0.03) !important;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37) !important;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .quantum-card:hover {
            background: rgba(255, 255, 255, 0.05) !important;
            border-color: rgba(49, 130, 246, 0.25) !important;
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.45), 0 0 24px 0 rgba(49, 130, 246, 0.12) !important;
            transform: translateY(-2px);
        }

        .quantum-btn {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .quantum-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.12) !important;
            border-color: rgba(255, 255, 255, 0.25) !important;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.2) !important;
            transform: translateY(-1px);
        }

        .quantum-bg {
            background: radial-gradient(circle at 50% 50%, #0f1026 0%, #070814 100%) !important;
            color: #e2e8f0 !important;
        }

        /* Smooth floating blobs */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.15;
            pointer-events: none;
            animation: float 20s ease-in-out infinite;
        }

        .blob-blue {
            background: #06b6d4;
            width: 400px;
            height: 400px;
            top: -100px;
            left: -100px;
        }

        .blob-purple {
            background: #8b5cf6;
            width: 500px;
            height: 500px;
            bottom: -150px;
            right: -100px;
            animation-delay: -5s;
        }

        .blob-pink {
            background: #ec4899;
            width: 350px;
            height: 350px;
            top: 40%;
            left: 50%;
            animation-delay: -10s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(30px, -50px) scale(1.1);
            }

            66% {
                transform: translate(-20px, 20px) scale(0.95);
            }
        }

        /* ===== Refined Excel-Style Spreadsheet ===== */
        /* Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;

        .custom-scrollbar::-webkit-scrollbar-thumb {

        .pulse-ambient {

        .sticky-col-header {

        .sticky-c2-hdr {

        .cursor-move {

        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {

        html {

</head>

<body class="bg-[#08090e] text-slate-200 font-sans selection:bg-indigo-500/30 overflow-hidden">
    <div id="root"></div>

    <script>
        function showError(msg, detail) {
            var root = document.getElementById("root");
            if (root) {
                root.innerHTML = '<div style="padding:40px;font-family:monospace;background:#0f1026;color:#f87171;min-height:100vh;box-sizing:border-box"><h2 style="color:#f43f5e;margin-bottom:8px;font-size:20px">🚨 ' + msg + '</h2><pre style="white-space:pre-wrap;font-size:11px;background:rgba(255,0,0,0.1);padding:16px;border-radius:8px;border:1px solid rgba(255,0,0,0.3);overflow:auto;max-height:80vh">' + detail + '</pre></div>';
            }
        }
        window.onerror = function (msg, url, line, col, err) {
            showError("Runtime Error", msg + "

File: " + url + "
Line: " + line + ", Col: " + col + "

Stack:
" + (err ? err.stack : "No stack"));
            return true;
        };
        window.addEventListener("unhandledrejection", function (e) {
            showError("Unhandled Promise Rejection", String(e.reason));
        });
    </script>

    <script type="module" src="/src/main.jsx"></script>
</body>
