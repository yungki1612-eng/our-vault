                                <Icons.Calculator className="w-5 h-5" />
                            </div>
                            <h4 className="text-lg font-bold text-slate-800">대출 시뮬레이터</h4>
                        </div>
                        <div className="flex bg-slate-100 p-1 rounded-xl gap-1">
                            {['level', 'principal', 'maturity'].map((t) => (
                                <button 
                                    key={t}
                                    onClick={() => setType(t)}
                                    className={`px-3 py-1.5 rounded-lg text-[10px] font-bold transition-all ${type === t ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}
                                >
                                    {t === 'level' ? '원리금균등' : t === 'principal' ? '원금균등' : '만기일시'}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-10 flex-1">
                        <div className="space-y-6">
                            <SliderInput 
                                label="매매 가격" value={purchasePrice} min={50000000} max={2000000000} step={10000000} unit="원" 
                                formatter={(v) => (v / 100000000).toFixed(1) + '억'} onChange={setPurchasePrice} 
                            />
                            <SliderInput 
                                label="자기자본 비율" value={equityRatio} min={0} max={100} unit="%" 
                                onChange={setEquityRatio} 
                            />
                            <SliderInput 
                                label="대출 금리" value={rate} min={1} max={15} step={0.1} unit="%" 
                                onChange={setRate} 
                            />
                            <div className="grid grid-cols-2 gap-4">
                                <SliderInput 
                                    label="대출 기간" value={term} min={1} max={50} unit="년" 
                                    onChange={setTerm} 
                                />
                                <SliderInput 
                                    label="거치 기간" value={gracePeriod} min={0} max={Math.min(term, 10)} unit="년" 
                                    onChange={setGracePeriod} 
                                />
                            </div>

                            <div className="p-5 bg-indigo-600 rounded-2xl text-white shadow-xl shadow-indigo-100 relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full blur-2xl -translate-y-1/2 translate-x-1/2"></div>
                                <div className="relative z-10 flex flex-col gap-4">
                                    <div>
                                        <p className="text-[10px] font-bold text-indigo-100 uppercase tracking-widest opacity-80 mb-1">예상 대출 금액</p>
                                        <h3 className="text-2xl font-black">{formatCurrency(loanAmount)}</h3>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4 pt-4 border-t border-indigo-500">
                                        <div>
                                            <p className="text-[10px] font-bold text-indigo-100 opacity-80">월 상환액{type === 'principal' ? '(최대)' : ''}</p>
                                            <p className="text-lg font-black">{formatCurrency(results.monthlyPayment)}</p>
                                        </div>
                                        <div>
                                            <p className="text-[10px] font-bold text-indigo-100 opacity-80">총 이자 지출</p>
                                            <p className="text-lg font-black">{formatCurrency(results.totalInterest)}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="flex flex-col">
                            <p className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-4">연도별 원금/이자 납입 비중</p>
                            <div className="flex-1 min-h-[300px]">
                                <ResponsiveContainer width="100%" height="100%">
                                    <BarChart data={results.yearlyData} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                        <XAxis dataKey="name" fontSize={10} stroke="#94a3b8" axisLine={false} tickLine={false} />
                                        <YAxis fontSize={10} stroke="#94a3b8" axisLine={false} tickLine={false} tickFormatter={(v) => (v / 10000).toFixed(0) + '만'} />
                                        <RechartsTooltip 
                                            cursor={{fill: '#f8fafc'}}
                                            formatter={(v) => formatCurrency(v)}
                                            contentStyle={{ borderRadius: '12px', border: 'none', boxShadow: '0 10px 15px -3px rgba(0,0,0,0.1)' }}
                                        />
                                        <Legend iconType="circle" wrapperStyle={{ fontSize: '10px', paddingTop: '20px' }} />
                                        <Bar dataKey="원금" stackId="a" fill="#6366f1" radius={[0, 0, 0, 0]} />
                                        <Bar dataKey="이자" stackId="a" fill="#fb7185" radius={[4, 4, 0, 0]} />
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    </div>
                </GlassCard>
            );
        };

        const LoanTrendGraph = ({ data }) => {
            const months = useMemo(() => Object.keys(data).filter(isMonthKey).sort(), [data]);
            
            const uniqueLoanNames = useMemo(() => {
                const names = new Set();
                months.forEach(m => {
                    (data[m]?.loans || []).forEach(loan => names.add(loan.name));
                });
                return Array.from(names);
            }, [data, months]);

            const graphData = useMemo(() => months.map(m => {
                const point = { name: m };
                (data[m]?.loans || []).forEach(loan => {
                    point[loan.name] = Number(loan.amount) || 0;
                });
                return point;
            }), [data, months]);

            const colors = ['#f43f5e', '#8b5cf6', '#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#06b6d4'];

            return (
                <GlassCard className="p-6 h-full">
                    <div className="flex items-center justify-between mb-6">
                        <div className="flex items-center gap-2">
                            <div className="p-2 bg-rose-100 rounded-lg text-rose-600">
                                <Icons.TrendingDown className="w-5 h-5" />
                            </div>
                            <h4 className="text-lg font-bold text-slate-800">대출별 잔액 추이</h4>
                        </div>
                        <div className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Loan Analytics</div>
                    </div>
                    <div className="h-64 sm:h-72">
                        <ResponsiveContainer width="100%" height="100%">
                            <LineChart data={graphData}>
                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                <XAxis dataKey="name" fontSize={10} stroke="#94a3b8" tickMargin={10} axisLine={false} tickLine={false} />
                                <YAxis fontSize={10} width={60} stroke="#94a3b8" tickFormatter={(val) => `${(val/10000).toFixed(0)}만`} axisLine={false} tickLine={false} />
                                <RechartsTooltip 
                                    formatter={(val, name) => [formatCurrency(val), name]} 
                                    contentStyle={{ borderRadius: '16px', border: 'none', boxShadow: '0 10px 15px -3px rgba(0,0,0,0.1)', padding: '12px' }} 
                                />
                                <Legend iconType="circle" wrapperStyle={{ fontSize: '11px', paddingTop: '10px' }} />
                                {uniqueLoanNames.map((loanName, index) => (
                                    <Line 
                                        key={loanName}
                                        type="monotone" 
                                        dataKey={loanName} 
                                        name={loanName}
                                        stroke={colors[index % colors.length]} 
                                        strokeWidth={3} 
                                        dot={{r: 3, strokeWidth: 2, fill: '#fff'}} 
                                        activeDot={{r: 6, strokeWidth: 0}} 
                                    />
                                ))}
                            </LineChart>
                        </ResponsiveContainer>
                    </div>
                </GlassCard>
            );
        };

        const LoanManagement = ({ data, onUpdate }) => {
            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="grid grid-cols-1 gap-6">
                        <LoanCalculator />
                    </div>
                    <div className="grid grid-cols-1 gap-6">
                        <LoanTrendGraph data={data} />
                    </div>
                    <GenericSpreadsheet data={data} type="loans" onUpdate={onUpdate} hasCategory={false} />
                </div>
            );
        };

        function App() {
            const [user, setUser] = useState(null);
            const [syncId, setSyncId] = useState(() => localStorage.getItem('fm_sync_id') || generateUUID());
            const [financialData, setFinancialData] = useState(() => {
                const saved = localStorage.getItem('financialData');
                const parsed = saved ? JSON.parse(saved) : generateInitialData();
                if (!parsed.salary) parsed.salary = generateInitialData().salary;
                if (!parsed.meta) parsed.meta = {}; if (!parsed.meta.goals) parsed.meta.goals = { loan: 30, invest: 30, netWorth: 1000000000 }; if (!parsed.meta.hiddenRows) parsed.meta.hiddenRows = {};
                return parsed;
            });
            const [lastUpdated, setLastUpdated] = useState(Date.now());
            const [isSyncing, setIsSyncing] = useState(false);
            const [showSyncModal, setShowSyncModal] = useState(false);
            const updateFinancialData = (newData) => { setFinancialData(newData); setLastUpdated(Date.now()); };
            useEffect(() => { localStorage.setItem('financialData', JSON.stringify(financialData)); }, [financialData]);
            useEffect(() => { if (!auth) return; const initAuth = async () => { if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await auth.signInWithCustomToken(__initial_auth_token); else await auth.signInAnonymously(); }; initAuth(); const unsubscribe = auth.onAuthStateChanged(setUser); return () => unsubscribe(); }, []);
            useEffect(() => { if (!user || !db) return; localStorage.setItem('fm_sync_id', syncId); const docRef = db.doc(`artifacts/${appId}/public/data/financial_sheets/${syncId}`); const unsubscribe = docRef.onSnapshot((docSnap) => { if (docSnap.exists) { const cloudData = docSnap.data(); setFinancialData(prev => { if (JSON.stringify(prev) !== JSON.stringify(cloudData)) return cloudData; return prev; }); setLastUpdated(Date.now()); } }); return () => unsubscribe(); }, [user, syncId]);
            useEffect(() => { if (!user || !db) return; setIsSyncing(true); const timeoutId = setTimeout(async () => { try { await db.doc(`artifacts/${appId}/public/data/financial_sheets/${syncId}`).set(financialData); setIsSyncing(false); } catch (err) { console.error(err); } }, 1500); return () => clearTimeout(timeoutId); }, [financialData, user, syncId]);
            const handleResetData = () => { if (confirm("모든 데이터를 초기화하시겠습니까?")) { const initial = generateInitialData(); setFinancialData(initial); localStorage.removeItem('financialData'); } };
            const TABS = [
                {id: 'dashboard', label: '대시보드', icon: Icons.LayoutDashboard}, 
                {id: 'assets', label: '자산 관리', icon: Icons.Table2}, 
                {id: 'budget', label: '수입/지출', icon: Icons.Banknote}, 
                {id: 'loans', label: '대출 관리', icon: Icons.CreditCard}, 
                {id: 'realestate', label: '부동산 관리', icon: Icons.Home}, 
                {id: 'stocks', label: '주식 실현 손익', icon: Icons.CandlestickChart}, 
                {id: 'salary', label: '연봉 관리', icon: Icons.TrendingUp}
            ];
            const [activeTab, setActiveTab] = useState('dashboard');

            return (
                <ErrorBoundary>
                    <div className="h-screen bg-slate-100 font-sans text-slate-800 selection:bg-slate-800 selection:text-white overflow-hidden flex flex-col">
                        <SyncModal isOpen={showSyncModal} onClose={() => setShowSyncModal(false)} currentId={syncId} onSyncIdChange={setSyncId} />
                        <div className="sticky top-0 z-50 bg-white/80 backdrop-blur-xl border-b border-slate-200 shadow-sm shrink-0">
                            <div className="flex items-center h-16 max-w-[1600px] mx-auto px-6 lg:px-10">
                                <div className="flex items-center gap-8 flex-1">
                                    <div className="flex items-center gap-2 text-indigo-600 shrink-0">
                                        <Icons.LayoutDashboard className="w-8 h-8" />
                                        <span className="text-xl font-black tracking-tighter text-slate-900 hidden sm:inline">FinMaster</span>
                                    </div>
                                    <nav className="hidden md:flex items-center gap-1 overflow-x-auto no-scrollbar">
                                        {TABS.map(tab => (
                                            <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${activeTab === tab.id ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-100 hover:text-indigo-600'}`}>
                                                <tab.icon className={`w-4 h-4 ${activeTab === tab.id ? 'text-white' : 'text-slate-400'}`}/> 
                                                {tab.label}
                                            </button>
                                        ))}
                                    </nav>
                                </div>
                                <div className="flex items-center gap-3 shrink-0 ml-4">
                                    <button onClick={() => setShowSyncModal(true)} className="text-xs font-bold text-slate-500 hover:text-indigo-600 flex items-center gap-1.5 transition-colors px-3 py-1.5 rounded-lg bg-white/50 border border-transparent hover:border-indigo-100">
                                        <Icons.Cloud className={`w-3.5 h-3.5 ${isSyncing ? 'animate-pulse text-indigo-500' : ''}`}/>
                                        <span className="hidden sm:inline">{isSyncing ? '저장 중...' : '연동'}</span>
                                    </button>
                                    <button onClick={handleResetData} className="text-xs text-slate-400 hover:text-rose-500 flex items-center gap-1 transition-colors px-2 py-1 rounded-lg" title="초기화">
                                        <Icons.RefreshCw className="w-4 h-4"/>
                                    </button>
                                </div>
                            </div>
                            <div className="md:hidden overflow-x-auto no-scrollbar px-4 py-2 border-t border-slate-100 flex gap-2">{TABS.map(tab => (<button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex-shrink-0 flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${activeTab === tab.id ? 'bg-indigo-600 text-white' : 'text-slate-500 bg-slate-50'}`}>{tab.label}</button>)) }</div>
                        </div>
                        <div className="flex-1 flex flex-col relative z-10 overflow-hidden"><main className="flex-1 overflow-auto p-4 lg:p-8 custom-scrollbar"><div className="max-w-[1600px] mx-auto space-y-6 pb-20">
                            {activeTab === 'dashboard' && <Dashboard key={lastUpdated} data={financialData} onUpdate={updateFinancialData} />}
                            {activeTab === 'assets' && <GenericSpreadsheet data={financialData} type="assets" onUpdate={updateFinancialData} categories={ASSET_CATEGORIES} hasCategory={true} />}
                            {activeTab === 'realestate' && <RealEstateSheet data={financialData} onUpdate={updateFinancialData} />}
                            {activeTab === 'budget' && <GenericSpreadsheet data={financialData} type="budget" onUpdate={updateFinancialData} categories={BUDGET_CATEGORIES} hasCategory={true} />}
                            {activeTab === 'loans' && <LoanManagement data={financialData} onUpdate={updateFinancialData} />}
                            {activeTab === 'stocks' && <GenericSpreadsheet data={financialData} type="stockProfit" onUpdate={updateFinancialData} hasCategory={false} />}
                            {activeTab === 'salary' && <SalarySheet data={financialData} onUpdate={updateFinancialData} />}
                        </div></main></div>
                    </div>
                </ErrorBoundary>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
 />);
    </script>
</body>
