        const CashFlowSankeyChart = ({ data, isWrapped }) => {
            const [viewMode, setViewMode] = useState('year');
            const months = useMemo(() => Object.keys(data).filter(isMonthKey).sort(), [data]);
            const years = useMemo(() => [...new Set(months.map(m => m.substring(0, 4)))], [months]);
            const [selectedYear, setSelectedYear] = useState(years[years.length - 1] || new Date().getFullYear().toString());
            const [selectedMonth, setSelectedMonth] = useState(months[months.length - 1] || '');

            useEffect(() => {
                if (!years.includes(selectedYear) && years.length > 0) setSelectedYear(years[years.length - 1]);
                if (!months.includes(selectedMonth) && months.length > 0) setSelectedMonth(months[months.length - 1]);
            }, [years, months, selectedYear, selectedMonth]);

            const sankeyData = useMemo(() => {
                let targetMonths = viewMode === 'year' ? months.filter(m => m.startsWith(selectedYear)) : [selectedMonth].filter(Boolean);
                let totalIncome = 0, totalExpense = 0, totalSaving = 0, totalInvest = 0;
                const incomeBySrc = {}, expenseByDst = {}, savingByDst = {}, investByDst = {};

                targetMonths.forEach(m => {
                   (data[m]?.budget || []).forEach(b => {
                       if (isItemHidden(b, 'budget', data.meta)) return;
                       const val = evaluateFormula(b.amount) || 0;
                       if (val <= 0) return;
                        const cat1 = normalizeCategory(b.category || b.name, 'budget');
                        const cat2 = b.category2 || '기타';
                        
                        if (cat1 === 'INCOME') { totalIncome += val; incomeBySrc[cat2] = (incomeBySrc[cat2] || 0) + val; } 
                        else if (cat1 === 'EXPENSE') { totalExpense += val; expenseByDst[cat2] = (expenseByDst[cat2] || 0) + val; } 
                        else if (cat1 === 'SAVING') { totalSaving += val; savingByDst[cat2] = (savingByDst[cat2] || 0) + val; } 
                        else if (cat1 === 'INVEST') { totalInvest += val; investByDst[cat2] = (investByDst[cat2] || 0) + val; }
                    });
                });

                const totalOutflow = totalExpense + totalSaving + totalInvest;
                const balance = totalIncome - totalOutflow;

                const nodeNames = [], links = [];
                const addNode = (name) => { 
                    let idx = nodeNames.indexOf(name); 
                    if (idx === -1) { 
                        nodeNames.push(name); 
                        idx = nodeNames.length - 1; 
                    } 
                    return idx; 
                };
                const addLink = (srcName, targetName, value) => { if (value > 0) links.push({ source: addNode(srcName), target: addNode(targetName), value }); };

                const hubNode = "총 수입";

                if (totalExpense > 0) addLink(hubNode, "총 지출", totalExpense);
                if (totalSaving > 0) addLink(hubNode, "총 저축", totalSaving);
                if (totalInvest > 0) addLink(hubNode, "총 투자", totalInvest);
                if (balance > 0) addLink(hubNode, "미분류", balance);

                Object.entries(expenseByDst).forEach(([dst, val]) => addLink("총 지출", dst, val));
                Object.entries(savingByDst).forEach(([dst, val]) => addLink("총 저축", dst, val));
                Object.entries(investByDst).forEach(([dst, val]) => addLink("총 투자", dst, val));

                return { nodes: nodeNames.map(name => ({name})), links };
                }, [data, viewMode, selectedYear, selectedMonth, months]);

                const CustomNode = ({ x, y, width, height, index, payload }) => {
                const name = payload.name;
                const isHub = name === "총 수입";
                const isFirstLvl = isHub;
                const isMidLvl = name === '총 지출' || name === '총 저축' || name === '총 투자' || name === '미분류';

                let fill = '#94a3b8'; // default slate-400
                if (isHub) fill = '#4f46e5'; // indigo-600
                else if (name.includes('지출')) fill = '#f43f5e'; // rose-500
                else if (name.includes('저축')) fill = '#10b981'; // emerald-500
                else if (name.includes('투자')) fill = '#8b5cf6'; // violet-500
                return (
                    <Layer key={`CustomNode${index}`}>
                        <Rectangle x={x} y={y} width={width} height={height} fill={fill} rx={3} />
                        <text textAnchor={isFirstLvl ? "end" : "start"} x={isFirstLvl ? x - 8 : x + width + 8} y={y + height / 2 + 4} fontSize="11" fill="#475569" fontWeight="bold">{name}</text>
                    </Layer>
                );
            };

            const CustomTooltip = ({ active, payload }) => {
                if (active && payload && payload.length) {
                    const data = payload[0].payload;
                    const isNode = data.source === undefined;
                    const value = data.value || 0;
                    return (
                        <div className="bg-white/95 backdrop-blur-md p-3 rounded-xl shadow-lg border border-slate-100 text-xs z-[1000]">
                            {isNode ? (
                                <p className="font-bold text-slate-700 mb-1">{data.name}</p>
                            ) : (
                                <p className="font-bold text-slate-700 mb-1">{data.source?.name || data.source} → {data.target?.name || data.target}</p>
                            )}
                            <p className="text-indigo-600 font-mono font-bold text-sm tracking-tighter">{formatCurrency(value)}원</p>
                        </div>
                    );
                }
                return null;
            };

            const handleSlicerChange = (direction) => {
                if (viewMode === 'year') {
                    const idx = years.indexOf(selectedYear);
                    if (idx !== -1) {
                        const newIdx = idx + direction;
                        if (newIdx >= 0 && newIdx < years.length) setSelectedYear(years[newIdx]);
                    }
                } else {
                    const idx = months.indexOf(selectedMonth);
                    if (idx !== -1) {
                        const newIdx = idx + direction;
                        if (newIdx >= 0 && newIdx < months.length) setSelectedMonth(months[newIdx]);
                    }
                }
            };

            const controls = (
                <div className="flex flex-col md:flex-row items-start md:items-center gap-4 w-full md:w-auto">
                    <div className="flex p-1 bg-slate-100 rounded-xl shrink-0">
                        <button onClick={() => setViewMode('year')} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${viewMode === 'year' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>연도별</button>
                        <button onClick={() => setViewMode('month')} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${viewMode === 'month' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>월별</button>
                    </div>
                    <div className="flex items-center gap-3 bg-white px-3 py-1 rounded-full shadow-sm border border-slate-200">
                        <button onClick={() => handleSlicerChange(-1)} className="p-1 hover:bg-slate-100 rounded-full text-slate-400 transition-colors">
                            <Icons.ChevronLeft className="w-4 h-4"/>
                        </button>
                        <span className="text-xs font-extrabold text-indigo-600 min-w-[70px] text-center">
                            {viewMode === 'year' ? `${selectedYear}년` : selectedMonth}
                        </span>
                        <button onClick={() => handleSlicerChange(1)} className="p-1 hover:bg-slate-100 rounded-full text-slate-400 transition-colors">
                            <Icons.ChevronRight className="w-4 h-4"/>
                        </button>
                    </div>
                </div>
            );

            const chartContent = (
                <div className="w-full h-[380px] mt-4 relative">
                    {sankeyData.nodes.length > 0 && sankeyData.links.length > 0 ? (
                        <ResponsiveContainer width="100%" height="100%">
                            <Sankey 
                                data={sankeyData} 
                                nodeWidth={12} 
                                nodePadding={30} 
                                margin={{ left: 120, right: 120, top: 10, bottom: 10 }} 
                                link={{ stroke: '#94a3b8', strokeOpacity: 0.15 }} 
                                node={<CustomNode />}
                                iterations={64}
                                style={{ cursor: 'pointer' }}
                            >
                                <RechartsTooltip content={<CustomTooltip />} wrapperStyle={{ zIndex: 1000 }} />
                            </Sankey>
                        </ResponsiveContainer>
                    ) : (                        <div className="w-full h-full flex flex-col items-center justify-center text-slate-400 font-bold text-sm bg-slate-50/50 rounded-2xl border border-dashed border-slate-200">
                            <Icons.PieChart className="w-8 h-8 mb-2 opacity-50"/>
                            표시할 자금 흐름 데이터가 없습니다.
                        </div>
                    )}
                </div>
            );

            if (isWrapped) {
                return (
                    <div className="flex flex-col w-full h-full">
                        <div className="flex w-full overflow-hidden">{controls}</div>
                        {chartContent}
                    </div>
                );
            }

            return (
                <GlassCard className="p-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-2 gap-4">
                        <div className="flex items-center gap-3 shrink-0">
                            <div className="p-2.5 rounded-xl bg-indigo-50 text-indigo-600"><Icons.TrendingUp className="w-5 h-5"/></div>
                            <div>
                                <h3 className="text-lg font-bold text-slate-800">자금 흐름 파이프라인</h3>
                                <p className="text-xs text-slate-500 font-medium tracking-tight">Income & Expense Path</p>
                            </div>
                        </div>
                        {controls}
                    </div>
                    {chartContent}
                </GlassCard>
            );
        };

        const GenericSpreadsheet = ({ data = {}, type, onUpdate, categories, hasCategory }) => {
            const safeData = data || {};
            const months = Object.keys(safeData).filter(isMonthKey).sort();
            const listKey = (type === 'stockProfit') ? 'stockProfit' : type;
            const [newItemName, setNewItemName] = useState('');
            const [targetCategory, setTargetCategory] = useState(hasCategory ? Object.keys(categories)[0] : '');
            const [targetCategory2, setTargetCategory2] = useState('');
            const [editingItemOption, setEditingItemOption] = useState(null);
            const [colWidths, setColWidths] = useState(() => {
                const saved = localStorage.getItem(`colWidths_${type}`);
                return saved ? JSON.parse(saved) : { c1: 70, c2: 60, c3: 100 };
            });
            useEffect(() => {
                localStorage.setItem(`colWidths_${type}`, JSON.stringify(colWidths));
            }, [colWidths, type]);
            const [resizing, setResizing] = useState(null);
            const [isUploading, setIsUploading] = useState(false);
            
            useEffect(() => {
                if (!resizing) return;
                const handleMouseMove = (e) => {
                    const diff = e.clientX - resizing.startX;
                    let newWidth = Math.max(40, resizing.startW + diff);
                    setColWidths(prev => ({ ...prev, [resizing.col]: newWidth }));
                };
                const handleMouseUp = () => setResizing(null);
                document.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('mouseup', handleMouseUp);
                return () => { document.removeEventListener('mousemove', handleMouseMove); document.removeEventListener('mouseup', handleMouseUp); };
            }, [resizing]);
            const fileInputRef = useRef(null);
            const containerRef = useRef(null);
            const [hiddenItems, setHiddenItems] = useState(() => { const savedHidden = safeData.meta?.hiddenRows?.[type]; return new Set(savedHidden || []); });
            const [showHidden, setShowHidden] = useState(false);
            const [hiddenMonths, setHiddenMonths] = useState(() => { const savedHidden = safeData.meta?.hiddenMonths?.[type]; return new Set(savedHidden || []); });
            const [showHiddenMonths, setShowHiddenMonths] = useState(false);
            const [orderedItems, setOrderedItems] = useState({});
            const visibleMonths = useMemo(() => months.filter(m => showHiddenMonths || !hiddenMonths.has(m)), [months, showHiddenMonths, hiddenMonths]);
            
            useEffect(() => { const savedHidden = safeData.meta?.hiddenRows?.[type]; if (savedHidden) setHiddenItems(new Set(savedHidden)); }, [safeData.meta?.hiddenRows, type]);
            useEffect(() => { const savedHiddenMonths = safeData.meta?.hiddenMonths?.[type]; if (savedHiddenMonths) setHiddenMonths(new Set(savedHiddenMonths)); }, [safeData.meta?.hiddenMonths, type]);
            const toggleHide = (itemKey) => { 
                const next = new Set(hiddenItems); if (next.has(itemKey)) next.delete(itemKey); else next.add(itemKey);
                setHiddenItems(next); const newData = JSON.parse(JSON.stringify(safeData)); if (!newData.meta) newData.meta = {}; if (!newData.meta.hiddenRows) newData.meta.hiddenRows = {}; newData.meta.hiddenRows[type] = Array.from(next); onUpdate(newData);
            };
            const toggleHideMonth = (month) => {
                const next = new Set(hiddenMonths); if (next.has(month)) next.delete(month); else next.add(month);
                setHiddenMonths(next); const newData = JSON.parse(JSON.stringify(safeData)); if (!newData.meta) newData.meta = {}; if (!newData.meta.hiddenMonths) newData.meta.hiddenMonths = {}; newData.meta.hiddenMonths[type] = Array.from(next); onUpdate(newData);
            };
            useEffect(() => {
                const currentUnique = new Set();
                const tempGroups = hasCategory ? Object.fromEntries(Object.keys(categories).map(k => [k, []])) : { ALL: [] };
                Object.values(safeData).forEach(m => { (m[listKey] || []).forEach(i => {
                    const itemKey = `${i.category||'ALL'}|${i.category2||''}|${i.name}`;
                    if (!currentUnique.has(itemKey)) {
                        currentUnique.add(itemKey);
                        const cat = hasCategory ? i.category : 'ALL';
                        const validCat = (hasCategory && categories[cat]) ? cat : (hasCategory ? Object.keys(categories)[0] : 'ALL');
                        if(tempGroups[validCat]) tempGroups[validCat].push({ name: i.name, category: validCat, category2: i.category2 || '', itemKey });
                    }
                }); });
                setOrderedItems(prev => {
                    const next = { ...prev }; let changed = false;
                    const keys = hasCategory ? Object.keys(categories) : ['ALL'];
                    keys.forEach(cat => {
                        const itemsInGroup = tempGroups[cat] || [];
                        itemsInGroup.sort((a, b) => {
                            if (hasCategory) {
                                const c2A = a.category2 || '';
                                const c2B = b.category2 || '';
                                if (c2A !== c2B) return c2A.localeCompare(c2B);
                            }
                            return a.name.localeCompare(b.name);
                        });
                        if (JSON.stringify(itemsInGroup) !== JSON.stringify(next[cat])) { next[cat] = itemsInGroup; changed = true; }
                    });
                    return changed ? next : prev;
                });
            }, [safeData, listKey, hasCategory, categories]);
            const handleReorder = (targetCat, fromName, toName, sourceCat) => {
                if (fromName === toName && targetCat === sourceCat) return;
                if (hasCategory && targetCat !== sourceCat) {
                    if(confirm(`'${fromName}' 항목을 '${categories[sourceCat]?.label}'에서 '${categories[targetCat]?.label}'(으)로 이동하시겠습니까?`)) {
                        const newData = JSON.parse(JSON.stringify(safeData));
                        Object.keys(newData).forEach(month => { if (isMonthKey(month) && newData[month][listKey]) { const item = newData[month][listKey].find(i => i.name === fromName); if (item) item.category = targetCat; } });
                        onUpdate(newData);
                    }
                }
            };
            const handleDeleteRow = (itemKey, label) => { if (!confirm(`'${label}' 항목을 정말 삭제하시겠습니까?`)) return; const newData = JSON.parse(JSON.stringify(safeData)); Object.keys(newData).forEach(m => { if (isMonthKey(m) && newData[m][listKey]) newData[m][listKey] = newData[m][listKey].filter(i => `${i.category||'ALL'}|${i.category2||''}|${i.name}` !== itemKey); }); onUpdate(newData); };
            const handleRename = (oldN, newN) => { if (!newN || oldN === newN) return; const newData = JSON.parse(JSON.stringify(safeData)); Object.keys(newData).forEach(m => { if (isMonthKey(m) && newData[m][listKey]) { const item = newData[m][listKey].find(i => i.name === oldN); if (item) item.name = newN; } }); onUpdate(newData); };
            const handleCellChange = (month, itemName, field, val, itemCategory, itemCategory2) => {
                const newData = JSON.parse(JSON.stringify(safeData));
                if (!newData[month][listKey]) newData[month][listKey] = [];
                const list = newData[month][listKey];
                const searchCat1 = hasCategory ? (itemCategory || targetCategory || Object.keys(categories)[0]) : 'ALL';
                const searchCat2 = hasCategory ? (itemCategory2 !== undefined ? itemCategory2 : targetCategory2) : '';
                const idx = list.findIndex(i => i.name === itemName && (i.category||'ALL') === searchCat1 && (i.category2||'') === searchCat2);
                if (idx >= 0) { list[idx][field] = val; } 
                else {
                    const newItem = { id: Date.now(), name: itemName };
                    if (hasCategory) { newItem.category = searchCat1; newItem.category2 = searchCat2; }
                    if(type === 'assets') newItem.value = 0; else if(type === 'stockProfit') { newItem.profit = 0; newItem.dividend = 0; } else newItem.amount = 0;
                    newItem[field] = val; list.push(newItem);
                }
                onUpdate(newData);
            };
            const handleAddRow = () => { if(!newItemName) return; const lastMonth = months[months.length-1]; if (lastMonth) { const defaultField = type === 'assets' ? 'value' : type === 'stockProfit' ? 'profit' : 'amount'; handleCellChange(lastMonth, newItemName, defaultField, 0); } setNewItemName(''); };
            const handleSaveRowEdit = () => {
                if (!editingItemOption || !editingItemOption.newName) { setEditingItemOption(null); return; }
                const { oldName, newName, cat1, cat2, oldCat1, oldCat2 } = editingItemOption;
                const newData = JSON.parse(JSON.stringify(safeData));
                let conflict = false;
                if (oldName !== newName || oldCat1 !== cat1 || oldCat2 !== cat2) {
                    Object.values(newData).forEach(m => { if (m[listKey] && m[listKey].some(i => i.name === newName && (i.category||'ALL') === cat1 && (i.category2||'') === cat2)) conflict = true; });
                }
                if (conflict) { alert('이미 존재하는 항목입니다.'); return; }
                Object.keys(newData).forEach(m => {
                    if (isMonthKey(m) && newData[m][listKey]) {
                        const item = newData[m][listKey].find(i => i.name === oldName && (i.category||'ALL') === oldCat1 && (i.category2||'') === oldCat2);
                        if (item) {
                            item.name = newName;
                            if (hasCategory) { item.category = cat1; item.category2 = cat2; }
                        }
                    }
                });
                onUpdate(newData);
                setEditingItemOption(null);
            };
            const handleAddMonth = () => { 
                const last = months[months.length - 1]; let newKey;
                if (!last) { const now = new Date(); newKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`; } 
                else { const [y, m] = last.split('-').map(Number); let ny = y, nm = m + 1; if (nm > 12) { ny++; nm = 1; } newKey = `${ny}-${String(nm).padStart(2, '0')}`; }
                const newData = JSON.parse(JSON.stringify(safeData)); if (!newData[newKey]) newData[newKey] = { assets: [], loans: [], budget: [], stockProfit: [] }; onUpdate(newData); 
            };
            const handleDeleteMonth = (month) => { if (!confirm(`${month} 데이터를 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.`)) return; const newData = JSON.parse(JSON.stringify(safeData)); delete newData[month]; onUpdate(newData); };
            return (
                <GlassCard className="flex flex-col h-[calc(100vh-180px)] overflow-hidden">
                    <div className="p-4 bg-white/50 border-b border-white/50 flex flex-wrap gap-3 justify-between items-center text-xs backdrop-blur-md z-40 relative">
                        <div className="flex gap-2 items-center">
                            {hasCategory && (
                                <>
                                    <select className="p-2 border border-white/60 rounded-xl bg-white/60 backdrop-blur-sm outline-none focus:ring-2 ring-indigo-500/20" value={targetCategory} onChange={(e) => setTargetCategory(e.target.value)}>{Object.entries(categories).map(([k, v]) => (<option key={k} value={k}>{v.label}</option>))}</select>
                                    <input type="text" placeholder="항목2 입력" className="p-2 border border-white/60 rounded-xl bg-white/60 w-24 outline-none focus:ring-2 ring-indigo-500/20" value={targetCategory2} onChange={(e) => setTargetCategory2(e.target.value)} />
                                </>
                            )}
                            <input type="text" placeholder="항목명 입력" className="p-2 border border-white/60 rounded-xl bg-white/60 w-32 outline-none focus:ring-2 ring-indigo-500/20" value={newItemName} onChange={(e) => setNewItemName(e.target.value)} />
                            <GlassButton onClick={handleAddRow} active><Icons.Plus className="w-3.5 h-3.5"/> 추가</GlassButton>
                        </div>
                        <div className="flex gap-2 items-center">
                            <label className="flex items-center gap-1.5 text-slate-600 cursor-pointer select-none mr-2 px-2 py-1 rounded-lg hover:bg-white/40"><input type="checkbox" checked={showHidden} onChange={e => setShowHidden(e.target.checked)} className="rounded text-indigo-600"/> 숨김 항목</label>
                            <label className="flex items-center gap-1.5 text-slate-600 cursor-pointer select-none mr-2 px-2 py-1 rounded-lg hover:bg-white/40"><input type="checkbox" checked={showHiddenMonths} onChange={e => setShowHiddenMonths(e.target.checked)} className="rounded text-indigo-600"/> 숨김 열</label>
                            <button onClick={handleAddMonth} className="bg-emerald-500 text-white px-3 py-2.5 rounded-xl hover:bg-emerald-600 flex gap-1 font-bold shadow-emerald-200 shadow-md transition-all hover:-translate-y-0.5"><Icons.CalendarPlus className="w-3.5 h-3.5"/> 월 추가</button>
                            <input type="file" accept=".csv" ref={fileInputRef} className="hidden" onChange={(e) => processFileUpload(e.target.files[0], safeData, type, onUpdate, setIsUploading)} />
                            <GlassButton onClick={() => fileInputRef.current.click()} disabled={isUploading}>{isUploading ? <Icons.Loader2 className="w-3.5 h-3.5 animate-spin"/> : <Icons.Upload className="w-3.5 h-3.5"/>} CSV 업로드</GlassButton>
                            <GlassButton onClick={() => downloadCSV(safeData, type)}><Icons.Download className="w-3.5 h-3.5"/> CSV 다운로드</GlassButton>
                        </div>
                    </div>
                    <div className="flex-1 overflow-auto custom-scrollbar bg-white/30 relative">
                        <table className="min-w-max text-sm text-right border-collapse">
                            <thead className="bg-slate-50 text-slate-500 sticky top-0 z-40 shadow-sm">
                                <tr>
                                    {hasCategory ? (
                                        <>
                                            <th className="sticky-c1-hdr p-2 text-center font-bold text-xs" style={{ left: 0, minWidth: colWidths.c1, maxWidth: colWidths.c1, width: colWidths.c1 }}>항목1<div className="absolute right-0 top-0 w-2 h-full cursor-col-resize hover:bg-slate-300 z-50 opacity-50" onMouseDown={(e) => setResizing({ col: 'c1', startX: e.clientX, startW: colWidths.c1 })}/></th>
                                            <th className="sticky-c2-hdr p-2 text-center font-bold text-xs" style={{ left: colWidths.c1, minWidth: colWidths.c2, maxWidth: colWidths.c2, width: colWidths.c2 }}>항목2<div className="absolute right-0 top-0 w-2 h-full cursor-col-resize hover:bg-slate-300 z-50 opacity-50" onMouseDown={(e) => setResizing({ col: 'c2', startX: e.clientX, startW: colWidths.c2 })}/></th>
                                            <th className="sticky-c3-hdr p-2 text-center font-bold text-xs" style={{ left: colWidths.c1 + colWidths.c2, minWidth: colWidths.c3, maxWidth: colWidths.c3, width: colWidths.c3 }}>항목3<div className="absolute right-0 top-0 w-2 h-full cursor-col-resize hover:bg-slate-300 z-50 opacity-50" onMouseDown={(e) => setResizing({ col: 'c3', startX: e.clientX, startW: colWidths.c3 })}/></th>
                                        </>
                                    ) : (
                                        <th className="sticky-col-header p-2 text-left border-r-2 border-slate-200 w-28 pl-6 font-bold text-xs">항목명</th>
                                    )}
                                    {visibleMonths.map(m => (
                                        <th key={m} className={`p-2 min-w-[72px] border-r border-slate-300 font-bold text-center text-slate-600 group/th relative ${hiddenMonths.has(m) ? 'bg-slate-100/50' : ''}`}>
                                            <div className="flex flex-col items-center justify-center gap-1">
                                                <span className="text-[10px] text-slate-400 font-medium tracking-tighter uppercase">{m.split('-')[0]}</span>
                                                <div className="flex items-center gap-1">
                                                    <span className="text-sm font-black">{m.split('-')[1]}월</span>
                                                    <button onClick={(e) => { e.stopPropagation(); toggleHideMonth(m); }} className={`p-1 rounded-md transition-all shadow-sm border ${hiddenMonths.has(m) ? 'bg-emerald-50 border-emerald-200 text-emerald-600' : 'bg-white border-slate-200 text-slate-400 hover:text-indigo-600 hover:border-indigo-200'}`} title={hiddenMonths.has(m) ? "열 보이기" : "열 숨기기"}>
                                                        {hiddenMonths.has(m) ? <Icons.Eye className="w-3 h-3"/> : <Icons.EyeOff className="w-3 h-3"/>}
                                                    </button>
                                                </div>
                                                <button onClick={(e) => { e.stopPropagation(); handleDeleteMonth(m); }} className="opacity-0 group-hover/th:opacity-100 p-1 hover:bg-rose-50 rounded text-slate-300 hover:text-rose-500 transition-all absolute top-1 right-1" title="열 삭제"><Icons.X className="w-2.5 h-2.5"/></button>
                                            </div>
                                        </th>
                                    ))}
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-200">
                            {(hasCategory ? Object.keys(categories) : ['ALL']).map(catKey => {
                                const items = orderedItems[catKey] || [];
                                const visibleItems = items.filter(i => showHidden || !hiddenItems.has(i.itemKey || i.name));
                                if (hasCategory && visibleItems.length === 0) return null;
                                return (
                                    <React.Fragment key={catKey}>
                                        {visibleItems.map((item, idx) => {
                                            const iKey = item.itemKey || item.name;
                                            const isEditing = editingItemOption?.oldName === item.name && editingItemOption?.oldCat1 === (item.category || catKey) && editingItemOption?.oldCat2 === (item.category2 || '');
                                            const isFirstCat1 = isEditing || idx === 0;
                                            const isFirstCat2 = isEditing || idx === 0 || (idx > 0 && visibleItems[idx - 1].category2 !== item.category2);
                                            return (
                                                <tr key={iKey} className={`${idx % 2 === 0 ? 'bg-white' : 'bg-slate-50/50'} hover:bg-indigo-50/30 transition-colors group/row`}>
                                                    {hasCategory ? (
                                                        <>
                                                            <td className="sticky-c1 bg-inherit p-2 text-center text-xs font-bold text-slate-700 overflow-hidden" style={{ left: 0, minWidth: colWidths.c1, maxWidth: colWidths.c1, width: colWidths.c1 }}>
                                                                {isEditing ? (
                                                                    <select className="w-full bg-white border border-indigo-300 rounded focus:outline-none p-0.5" value={editingItemOption.cat1} onChange={(e) => setEditingItemOption({...editingItemOption, cat1: e.target.value})}>
                                                                        {Object.entries(categories).map(([k, v]) => (<option key={k} value={k}>{v.label}</option>))}
                                                                    </select>
                                                                ) : isFirstCat1 ? <span className="block truncate w-full">{categories[catKey].label}</span> : ''}
                                                            </td>
                                                            <td className="sticky-c2 bg-inherit p-2 text-center text-xs font-medium text-slate-600 overflow-hidden" style={{ left: colWidths.c1, minWidth: colWidths.c2, maxWidth: colWidths.c2, width: colWidths.c2 }}>
                                                                {isEditing ? (
                                                                    <input type="text" className="w-full bg-white border border-indigo-300 rounded focus:outline-none p-0.5 text-center" value={editingItemOption.cat2} onChange={(e) => setEditingItemOption({...editingItemOption, cat2: e.target.value})} onKeyDown={(e) => e.key === 'Enter' && handleSaveRowEdit()} />
                                                                ) : isFirstCat2 ? <span className="block truncate w-full">{item.category2 || ''}</span> : ''}
                                                            </td>
                                                            <td className="sticky-c3 bg-inherit p-2" style={{ left: colWidths.c1 + colWidths.c2, minWidth: colWidths.c3, maxWidth: colWidths.c3, width: colWidths.c3 }}>
                                                                {isEditing ? (
                                                                    <div className="flex items-center justify-between">
                                                                        <input type="text" autoFocus className="w-full bg-white border border-indigo-300 rounded focus:outline-none p-0.5 text-xs" value={editingItemOption.newName} onChange={(e) => setEditingItemOption({...editingItemOption, newName: e.target.value})} onKeyDown={(e) => e.key === 'Enter' && handleSaveRowEdit()} />
                                                                        <div className="flex items-center gap-0.5 ml-1">
                                                                            <button onClick={handleSaveRowEdit} className="p-1 text-emerald-500 hover:bg-emerald-50 rounded"><Icons.Check className="w-3 h-3"/></button>
                                                                            <button onClick={() => setEditingItemOption(null)} className="p-1 text-slate-400 hover:bg-slate-100 rounded"><Icons.X className="w-3 h-3"/></button>
                                                                        </div>
                                                                    </div>
                                                                ) : (
                                                                    <div className="flex items-center justify-between group">
                                                                        <div className="flex items-center gap-2 overflow-hidden w-full">
                                                                            <button onClick={() => toggleHide(iKey)} className="text-slate-300 hover:text-indigo-500 transition-colors shrink-0">
                                                                                {hiddenItems.has(iKey) ? <Icons.EyeOff className="w-3.5 h-3.5" /> : <Icons.Eye className="w-3.5 h-3.5" />}
                                                                            </button>
                                                                            <span className={`text-xs font-bold truncate ${hiddenItems.has(iKey) ? 'text-slate-300 line-through' : 'text-slate-700'}`} title={item.name}>{item.name}</span>
                                                                        </div>
                                                                        <div className="flex items-center opacity-0 group-hover:opacity-100 transition-all shrink-0">
                                                                            <button onClick={() => setEditingItemOption({ oldName: item.name, newName: item.name, cat1: item.category || catKey, cat2: item.category2 || '', oldCat1: item.category || catKey, oldCat2: item.category2 || '' })} className="p-1 text-slate-300 hover:text-indigo-500"><Icons.Edit2 className="w-3.5 h-3.5"/></button>
                                                                            <button onClick={() => handleDeleteRow(iKey, item.name)} className="p-1 text-slate-300 hover:text-rose-500"><Icons.Trash2 className="w-3.5 h-3.5"/></button>
                                                                        </div>
                                                                    </div>
                                                                )}
                                                            </td>
                                                        </>
                                                    ) : (
                                                        <td className="sticky left-0 z-20 bg-inherit p-2 border-r border-slate-100 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)]" style={{ minWidth: colWidths.c1+colWidths.c2+colWidths.c3, maxWidth: colWidths.c1+colWidths.c2+colWidths.c3, width: colWidths.c1+colWidths.c2+colWidths.c3 }}>
                                                            {isEditing ? (
                                                                <div className="flex items-center justify-between">
                                                                    <input type="text" autoFocus className="w-full bg-white border border-indigo-300 rounded focus:outline-none p-0.5 text-xs" value={editingItemOption.newName} onChange={(e) => setEditingItemOption({...editingItemOption, newName: e.target.value})} onKeyDown={(e) => e.key === 'Enter' && handleSaveRowEdit()} />
                                                                    <div className="flex items-center gap-0.5 ml-1">
                                                                        <button onClick={handleSaveRowEdit} className="p-1 text-emerald-500 hover:bg-emerald-50 rounded"><Icons.Check className="w-3 h-3"/></button>
                                                                        <button onClick={() => setEditingItemOption(null)} className="p-1 text-slate-400 hover:bg-slate-100 rounded"><Icons.X className="w-3 h-3"/></button>
                                                                    </div>
                                                                </div>
                                                            ) : (
                                                                <div className="flex items-center justify-between group">
                                                                    <div className="flex items-center gap-2 overflow-hidden w-full">
                                                                        <button onClick={() => toggleHide(iKey)} className="text-slate-300 hover:text-indigo-500 transition-colors shrink-0">
                                                                            {hiddenItems.has(iKey) ? <Icons.EyeOff className="w-3.5 h-3.5" /> : <Icons.Eye className="w-3.5 h-3.5" />}
                                                                        </button>
                                                                        <span className={`text-xs font-bold truncate ${hiddenItems.has(iKey) ? 'text-slate-300 line-through' : 'text-slate-700'}`} title={item.name}>{item.name}</span>
                                                                    </div>
                                                                    <div className="flex items-center opacity-0 group-hover:opacity-100 transition-all shrink-0">
                                                                        <button onClick={() => setEditingItemOption({ oldName: item.name, newName: item.name, cat1: item.category || 'ALL', cat2: '', oldCat1: item.category || 'ALL', oldCat2: '' })} className="p-1 text-slate-300 hover:text-indigo-500"><Icons.Edit2 className="w-3.5 h-3.5"/></button>
                                                                        <button onClick={() => handleDeleteRow(iKey, item.name)} className="p-1 text-slate-300 hover:text-rose-500"><Icons.Trash2 className="w-3.5 h-3.5"/></button>
                                                                    </div>
                                                                </div>
                                                            )}
                                                        </td>
                                                    )}
                                                    {visibleMonths.map(month => {
                                                        const found = (safeData[month][listKey] || []).find(i => i.name === item.name);
                                                        if (type === 'stockProfit') {
                                                            const profit = found ? (found.profit || 0) : 0;
                                                            const dividend = found ? (found.dividend || 0) : 0;
                                                            return (
                                                                <td key={month} className="p-1 border-r border-slate-100 relative group/cell min-w-[72px]">
                                                                    <div className="flex flex-col gap-1">
                                                                        <div className="flex items-center gap-1 bg-white/40 rounded px-1"><span className="text-[9px] font-bold text-slate-400 w-3">P</span><CurrencyInput value={profit} onChange={(v) => handleCellChange(month, item.name, 'profit', v, item.category)} className={`flex-1 text-right bg-transparent outline-none text-[11px] font-mono ${profit < 0 ? 'text-blue-500' : profit > 0 ? 'text-rose-500' : 'text-slate-600'}`} /></div>
                                                                        <div className="flex items-center gap-1 bg-indigo-50/30 rounded px-1 border-t border-indigo-100/50"><span className="text-[9px] font-bold text-indigo-400 w-3">D</span><CurrencyInput value={dividend} onChange={(v) => handleCellChange(month, item.name, 'dividend', v, item.category)} className="flex-1 text-right bg-transparent outline-none text-[11px] font-mono text-emerald-600" /></div>
                                                                    </div>
                                                                </td>
                                                            );
                                                        } else {
                                                            const val = found ? (found.value ?? found.amount ?? 0) : 0;
                                                            const fieldName = type === 'assets' ? 'value' : 'amount';
                                                            return (
                                                                <td key={month} className="p-0 border-r border-slate-300/50 bg-white/30 min-w-[72px]"><CurrencyInput value={val} onChange={(v) => handleCellChange(month, item.name, fieldName, v, item.category, item.category2)} className="w-full h-full p-2 text-right bg-transparent focus:bg-indigo-100/50 focus:outline-none text-xs font-mono text-slate-700 hover:bg-indigo-50/30 transition-colors"/></td>
                                                            );
                                                        }
                                                    })}
                                                </tr>
                                            );
                                        })}
                                        {hasCategory && (
                                            <tr className="bg-slate-50 border-t border-slate-200 font-bold text-slate-700">
                                                <td className="sticky-c-sum p-2 text-right text-xs" colSpan={3} style={{ left: 0, paddingRight: '0.75rem', minWidth: colWidths.c1+colWidths.c2+colWidths.c3, width: colWidths.c1+colWidths.c2+colWidths.c3, maxWidth: colWidths.c1+colWidths.c2+colWidths.c3 }}>{categories[catKey].label} 합계</td>
                                                {visibleMonths.map(month => {
                                                    const sum = visibleItems.reduce((acc, item) => { 
                                                        const found = (safeData[month][listKey] || []).find(i => i.name === item.name && (i.category||'ALL') === (item.category||'ALL') && (i.category2||'') === (item.category2||'')); 
                                                        const val = found ? (found.value ?? found.amount ?? 0) : 0; 
                                                        return acc + evaluateFormula(val); 
                                                    }, 0);
                                                    return (<td key={month} className="p-2 text-right border-r border-slate-200 text-xs bg-slate-50 min-w-[72px]">{formatCurrency(sum)}</td>);
                                                })}
                                            </tr>
                                        )}
                                    </React.Fragment>
                                );
                            })}
                            </tbody>
                        </table>
                    </div>
                </GlassCard>
            );
        };

        const OWNERSHIP_TYPES = {
            OWN: { label: '자가', color: 'bg-indigo-500', text: 'text-indigo-500', light: 'bg-indigo-50' },
            JEONSE: { label: '전세', color: 'bg-emerald-500', text: 'text-emerald-500', light: 'bg-emerald-50' },
            RENT: { label: '월세', color: 'bg-amber-500', text: 'text-amber-500', light: 'bg-amber-50' }
        };

        const RealEstateSheet = ({ data, onUpdate }) => {
            const realEstate = data.realEstate || [];
            const [newItem, setNewItem] = useState({ name: '', category: 'APARTMENT', ownershipType: 'OWN', purchaseDate: '', purchasePrice: 0, currentValue: 0, loan: 0, deposit: 0, monthlyRent: 0 });

            const stats = useMemo(() => {
                const totalValue = realEstate.reduce((acc, item) => acc + (Number(item.currentValue) || 0), 0);
                const totalLoanDeposit = realEstate.reduce((acc, item) => acc + (Number(item.loan) || 0) + (Number(item.deposit) || 0), 0);
                const totalRent = realEstate.reduce((acc, item) => acc + (Number(item.monthlyRent) || 0), 0);
                return { totalValue, netWorth: totalValue - totalLoanDeposit, totalRent, count: realEstate.length };
            }, [realEstate]);

            const handleAddItem = () => {
                if (!newItem.name) return;
                const newData = JSON.parse(JSON.stringify(data));
                if (!newData.realEstate) newData.realEstate = [];
                newData.realEstate.push({ ...newItem, id: Date.now() });
                onUpdate(newData);
                setNewItem({ name: '', category: 'APARTMENT', ownershipType: 'OWN', purchaseDate: '', purchasePrice: 0, currentValue: 0, loan: 0, deposit: 0, monthlyRent: 0 });
            };

            const handleUpdateItem = (id, field, value) => {
                const newData = JSON.parse(JSON.stringify(data));
                const item = newData.realEstate.find(i => i.id === id);
                if (item) {
                    item[field] = value;
                    onUpdate(newData);
                }
            };

            const handleDeleteItem = (id) => {
                if (!confirm("이 부동산 항목을 삭제하시겠습니까?")) return;
                const newData = JSON.parse(JSON.stringify(data));
                newData.realEstate = newData.realEstate.filter(i => i.id !== id);
                onUpdate(newData);
            };

            return (
                <div className="space-y-6 animate-fade-in">
                    {/* Summary Header */}
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <GlassCard className="p-5 border-l-4 border-indigo-500">
                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">총 부동산 평가액</span>
                            <h3 className="text-2xl font-black text-slate-800 mt-1">{formatCurrency(stats.totalValue)}</h3>
                        </GlassCard>
                        <GlassCard className="p-5 border-l-4 border-emerald-500">
                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">부동산 순자산</span>
                            <h3 className="text-2xl font-black text-emerald-600 mt-1">{formatCurrency(stats.netWorth)}</h3>
                        </GlassCard>
                        <GlassCard className="p-5 border-l-4 border-rose-500">
                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">대출 및 보증금 합계</span>
                            <h3 className="text-2xl font-black text-rose-600 mt-1">{formatCurrency(stats.totalValue - stats.netWorth)}</h3>
                        </GlassCard>
                        <GlassCard className="p-5 border-l-4 border-amber-500">
                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">월 임대 수익 (Total)</span>
                            <h3 className="text-2xl font-black text-amber-600 mt-1">{formatCurrency(stats.totalRent)}</h3>
                        </GlassCard>
                    </div>

                    {/* Input Form */}
                    <CollapsibleCard title="신규 부동산 등록" icon={Icons.Plus} initialOpen={false}>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-2">
                            <div className="space-y-1">
                                <label className="text-[10px] font-bold text-slate-400 ml-1">자산명</label>
                                <input type="text" placeholder="예: 래미안 84A" className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500/20 outline-none" value={newItem.name} onChange={e => setNewItem({...newItem, name: e.target.value})} />
                            </div>
                            <div className="space-y-1">
                                <label className="text-[10px] font-bold text-slate-400 ml-1">부동산 형태</label>
                                <select className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none" value={newItem.category} onChange={e => setNewItem({...newItem, category: e.target.value})}>
                                    {Object.entries(REAL_ESTATE_CATEGORIES).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
                                </select>
                            </div>
                            <div className="space-y-1">
                                <label className="text-[10px] font-bold text-slate-400 ml-1">거주 형태</label>
                                <div className="flex bg-slate-50 p-1 rounded-xl gap-1 border border-slate-200">
                                    {Object.entries(OWNERSHIP_TYPES).map(([k, v]) => (
                                        <button 
                                            key={k}
                                            onClick={() => setNewItem({...newItem, ownershipType: k})}
                                            className={`flex-1 py-1.5 rounded-lg text-[10px] font-bold transition-all ${newItem.ownershipType === k ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}
                                        >
                                            {v.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            <div className="space-y-1">
                                <label className="text-[10px] font-bold text-slate-400 ml-1">취득일 (또는 계약일)</label>
                                <input type="text" placeholder="YYYY-MM-DD" className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none" value={newItem.purchaseDate} onChange={e => setNewItem({...newItem, purchaseDate: e.target.value})} />
                            </div>
                            <div className="space-y-1">
                                <label className="text-[10px] font-bold text-slate-400 ml-1">{newItem.ownershipType === 'OWN' ? '취득가액' : '계약금액'}</label>
                                <CurrencyInput value={newItem.purchasePrice} onChange={v => setNewItem({...newItem, purchasePrice: v})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm" />
                            </div>
                            <div className="space-y-1">
                                <label className="text-[10px] font-bold text-slate-400 ml-1">현재가액 (시세)</label>
                                <CurrencyInput value={newItem.currentValue} onChange={v => setNewItem({...newItem, currentValue: v})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm" />
                            </div>
                            <div className="space-y-1">
                                <label className="text-[10px] font-bold text-slate-400 ml-1">대출금</label>
                                <CurrencyInput value={newItem.loan} onChange={v => setNewItem({...newItem, loan: v})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm" />
                            </div>
                            <div className="space-y-1">
                                <label className="text-[10px] font-bold text-slate-400 ml-1">보증금 (받은/준)</label>
                                <CurrencyInput value={newItem.deposit} onChange={v => setNewItem({...newItem, deposit: v})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm" />
                            </div>
                            <div className="space-y-1">
                                <label className="text-[10px] font-bold text-slate-400 ml-1">월세</label>
                                <div className="flex gap-2">
                                    <CurrencyInput value={newItem.monthlyRent} onChange={v => setNewItem({...newItem, monthlyRent: v})} className="flex-1 p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm" />
                                    <button onClick={handleAddItem} className="bg-indigo-600 text-white px-6 rounded-xl font-bold hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-100">등록</button>
                                </div>
                            </div>
                        </div>
                    </CollapsibleCard>

                    {/* Property List */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {realEstate.map(item => {
                            const cat = REAL_ESTATE_CATEGORIES[item.category] || REAL_ESTATE_CATEGORIES.OTHER;
                            const own = OWNERSHIP_TYPES[item.ownershipType] || OWNERSHIP_TYPES.OWN;
                            const investment = (Number(item.purchasePrice) || 0) - (Number(item.deposit) || 0);
                            const yieldRate = investment > 0 ? ((Number(item.monthlyRent) || 0) * 12 / investment * 100).toFixed(2) : 0;
                            const profit = (Number(item.currentValue) || 0) - (Number(item.purchasePrice) || 0);
                            const profitRate = (Number(item.purchasePrice) || 0) > 0 ? (profit / item.purchasePrice * 100).toFixed(1) : 0;

                            return (
                                <GlassCard key={item.id} className="overflow-hidden flex flex-col">
                                    <div className={`p-4 ${cat.bg} border-b border-slate-100 flex justify-between items-center`}>
                                        <div className="flex items-center gap-3">
                                            <div className="p-2 bg-white rounded-lg shadow-sm"><Icons.Home className={`w-5 h-5 ${cat.text}`} /></div>
                                            <div>
                                                <div className="flex items-center gap-2">
                                                    <span className={`text-[10px] font-black px-1.5 py-0.5 rounded uppercase ${own.light} ${own.text} border border-current`}>{own.label}</span>
                                                    <span className={`text-[10px] font-black px-1.5 py-0.5 rounded uppercase ${cat.bg} ${cat.text} border border-current opacity-70`}>{cat.label}</span>
                                                    <h4 className="font-bold text-slate-800">{item.name}</h4>
                                                </div>
                                                <p className="text-[10px] text-slate-400 font-medium">계약일: {item.purchaseDate || '-'}</p>
                                            </div>
                                        </div>
                                        <button onClick={() => handleDeleteItem(item.id)} className="p-2 text-slate-300 hover:text-rose-500 hover:bg-rose-50 rounded-lg transition-colors"><Icons.Trash2 className="w-4 h-4" /></button>
                                    </div>
                                    <div className="p-6 grid grid-cols-2 sm:grid-cols-3 gap-6">
                                        <div>
                                            <p className="text-[10px] font-bold text-slate-400 uppercase mb-1">현재 가치</p>
                                            <CurrencyInput value={item.currentValue} onChange={v => handleUpdateItem(item.id, 'currentValue', v)} className="text-xl font-black text-slate-800" />
                                            <div className="flex items-center gap-1 mt-1">
                                                <span className={`text-[10px] font-bold ${profit >= 0 ? 'text-rose-500' : 'text-blue-500'}`}>{profit >= 0 ? '▲' : '▼'} {formatCurrency(Math.abs(profit))} ({profitRate}%)</span>
                                            </div>
                                        </div>
                                        <div>

                                        <span className="text-[10px] font-bold text-slate-400">{item.ownershipType === 'OWN' ? '취득가액' : '계약금액'}: {formatCurrency(item.purchasePrice)}</span>
                                        <div className="flex items-center gap-2">

                                            <div className="h-3 w-px bg-slate-200"></div>

                        {realEstate.length === 0 && (
                            <div className="col-span-full py-20 flex flex-col items-center justify-center text-slate-300">

                                <p className="font-bold">등록된 부동산 자산이 없습니다.</p>
                                <p className="text-xs mt-1">상단의 등록 폼을 통해 새로운 자산을 추가해보세요.</p>
                            </div>

            );
        };

        const SalarySheet = ({ data, onUpdate }) => {
            const salaryData = data.salary || { years: Array.from({length: 12}, (_, i) => String(2014 + i)), items: [{ id: 1, name: '융기', values: {} }, { id: 2, name: '수아', values: {} }] };
            const [years, setYears] = useState(salaryData.years);
            const fileInputRef = useRef(null);
            const containerRef = useRef(null);
            useEffect(() => { if (data.salary) setYears(data.salary.years); }, [data.salary]);
            
            const handleValueChange = (itemId, year, val) => {
                const newData = JSON.parse(JSON.stringify(data)); if (!newData.salary) newData.salary = salaryData;
                const item = newData.salary.items.find(i => i.id === itemId); if (item) { item.values[year] = val; onUpdate(newData); }
            };
            const addYear = () => {
                const lastYear = parseInt(years[years.length - 1]); const newYear = String(lastYear + 1);
                const newData = JSON.parse(JSON.stringify(data)); if (!newData.salary) newData.salary = salaryData;
                newData.salary.years.push(newYear); newData.salary.items.forEach(item => item.values[newYear] = 0); onUpdate(newData);
            };
            const handleDeleteYear = (yearToDelete) => {
                if (!confirm(`${yearToDelete}년 데이터를 삭제하시겠습니까?`)) return;
                const newData = JSON.parse(JSON.stringify(data)); if (!newData.salary) return;
                newData.salary.years = newData.salary.years.filter(y => y !== yearToDelete);
                newData.salary.items.forEach(item => { if (item.values) delete item.values[yearToDelete]; }); onUpdate(newData);
            };
            const chartData = years.map(year => { const point = { year }; salaryData.items.forEach(item => point[item.name] = item.values[year] || 0); return point; });
            const itemTotals = salaryData.items.map(item => ({ id: item.id, name: item.name, total: Object.values(item.values).reduce((acc, val) => acc + (Number(val) || 0), 0) }));
            const grandTotal = itemTotals.reduce((acc, curr) => acc + curr.total, 0);
            const getLevel = (total) => {
                if (total > 2000000000) return { label: '전생에 나라를 구한 재벌', color: 'text-amber-600', emoji: '🏰' };
                if (total > 1000000000) return { label: '자산가 꿈나무', color: 'text-emerald-600', emoji: '🏙️' };
                if (total > 500000000) return { label: '프로 일잘러', color: 'text-indigo-600', emoji: '☕' };
                if (total > 100000000) return { label: '성실한 개미', color: 'text-blue-600', emoji: '🐜' };
                return { label: '열정 가득 새내기', color: 'text-slate-500', emoji: '🥚' };

            const mainLevel = getLevel(grandTotal);
            return (
                <div className="space-y-6 animate-fade-in">

                            <div className="flex flex-col md:flex-row md:items-end gap-4"><span className="text-5xl font-black tracking-tighter">{formatCurrency(grandTotal)}</span><span className={`text-lg font-bold bg-white/20 backdrop-blur-md px-4 py-1 rounded-full mb-1 flex items-center gap-2`}><span>{mainLevel.emoji}</span><span>{mainLevel.label}</span></span></div>
                            <p className="mt-4 text-indigo-100 text-sm font-medium">"열심히 번 당신, 고기 사 드세요! 🥩 우리는 오늘보다 내일 더 부자가 될 거예요."</p>
                        </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">{itemTotals.map(it => { const lv = getLevel(it.total); return (<GlassCard key={it.id} className="p-6 border-t-4 border-indigo-500"><div className="flex justify-between items-start mb-4"><div><span className="text-xs font-bold text-slate-400 uppercase tracking-wider">{it.name} 님의 누적 수령액</span><h3 className="text-3xl font-black text-slate-800 tracking-tight mt-1">{formatCurrency(it.total)}</h3></div><div className="text-2xl">{lv.emoji}</div></div><div className={`text-xs font-bold ${lv.color} bg-slate-50 px-3 py-1.5 rounded-lg inline-block`}>Level: {lv.label}</div></GlassCard>); })}</div>
                    <GlassCard className="p-6"><div className="flex items-center justify-between mb-6"><h3 className="text-lg font-bold text-slate-800 flex items-center gap-2"><Icons.TrendingUp className="w-5 h-5 text-indigo-600"/> 우리가 걸어온 '부'의 발자취</h3><div className="text-[10px] text-slate-400 font-bold uppercase">Income History Chart</div></div><div className="h-72"><ResponsiveContainer width="100%" height="100%"><LineChart data={chartData}><CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" /><XAxis dataKey="year" fontSize={12} stroke="#94a3b8" axisLine={false} tickLine={false} /><YAxis fontSize={12} width={60} stroke="#94a3b8" tickFormatter={(val) => `${(val/10000).toFixed(0)}만`} axisLine={false} tickLine={false} /><RechartsTooltip formatter={(val) => formatCurrency(val)} contentStyle={{borderRadius: '16px', border: 'none', boxShadow: '0 10px 15px -3px rgba(0,0,0,0.1)'}} /><Legend iconType="circle" /><Line type="monotone" dataKey="융기" stroke="#3b82f6" strokeWidth={4} dot={{r: 4, strokeWidth: 2, fill: '#fff'}} activeDot={{r: 8, strokeWidth: 0}} /><Line type="monotone" dataKey="수아" stroke="#ec4899" strokeWidth={4} dot={{r: 4, strokeWidth: 2, fill: '#fff'}} activeDot={{r: 8, strokeWidth: 0}} /></LineChart></ResponsiveContainer></div></GlassCard>
                    <GlassCard className="flex flex-col overflow-hidden">
                        <div className="p-5 bg-white/50 border-b border-slate-100 flex justify-between items-center backdrop-blur-md"><div className="flex flex-col"><span className="font-bold text-slate-800 text-sm">연도별 연봉 상세 데이터</span><span className="text-[10px] text-slate-400 font-medium mt-0.5">단위: 원 (원천징수 영수증 기준 권장)</span></div><div className="flex gap-2">
                            <button onClick={addYear} className="bg-indigo-600 text-white px-4 py-2 rounded-xl flex items-center gap-2 hover:bg-indigo-700 transition-all font-bold text-xs shadow-md shadow-indigo-100 active:scale-95"><Icons.Plus className="w-4 h-4"/> 연도 추가</button>
                            <input type="file" accept=".csv" ref={fileInputRef} className="hidden" onChange={(e) => {
                                const file = e.target.files[0]; if (!file) return; const reader = new FileReader();
                                reader.onload = (ev) => {
                                    const text = ev.target.result; const lines = text.split(/\r\n|\n|\r/).filter(l => l.trim() !== ''); if (lines.length < 2) return;
                                    const header = lines[0].split(',').map(s => s.trim().replace(/^"|"$/g, '')); const fileYears = header.slice(1);
                                    const newData = JSON.parse(JSON.stringify(data)); if(!newData.salary) newData.salary = { years: [], items: [] };
                                    const allYears = Array.from(new Set([...newData.salary.years, ...fileYears])).sort(); newData.salary.years = allYears;
                                    for(let i=1; i<lines.length; i++) {
                                        const row = lines[i].split(',').map(s => s.trim().replace(/^"|"$/g, '')); if(row.length < 2) continue;
                                        const name = row[0]; let item = newData.salary.items.find(it => it.name === name);
                                        if (!item) { item = { id: Date.now() + i, name: name, values: {} }; newData.salary.items.push(item); }
                                        fileYears.forEach((year, idx) => { item.values[year] = parseFloat(row[idx+1] || 0); });
                                    }
                                    onUpdate(newData); alert("데이터가 성공적으로 불러와졌습니다! 🚀");
                                }; reader.readAsText(file);
                            }} />

                            <GlassButton onClick={() => {

                                const link = document.createElement("a"); link.setAttribute("href", encodeURI(csv)); link.setAttribute("download", "our_salary_history.csv"); document.body.appendChild(link); link.click(); document.body.removeChild(link);
                            }}><Icons.Download className="w-3.5 h-3.5"/> 다운로드</GlassButton>
                        </div></div>
                        <div className="overflow-auto custom-scrollbar" ref={containerRef}>
                            <table className="min-w-full text-sm text-right">
                                <thead className="bg-slate-50/80 text-slate-500"><tr><th className="p-4 text-left w-28 font-bold border-r border-slate-100 sticky left-0 bg-slate-50/95 backdrop-blur-sm z-20 shadow-sm">이름</th><th className="p-4 w-32 font-black text-indigo-600 border-r border-slate-100 sticky left-28 bg-indigo-50/95 backdrop-blur-sm z-20 shadow-sm">합계</th>
                                    {years.map(year => (<th key={year} data-year={year} className="p-4 min-w-[88px] font-bold border-r border-slate-100 last:border-0 group/th relative"><div className="flex items-center justify-center gap-1">{year}<button onClick={(e) => { e.stopPropagation(); handleDeleteYear(year); }} className="opacity-0 group-hover/th:opacity-100 p-1.5 hover:bg-rose-100 rounded-lg text-rose-400 transition-all absolute right-1 top-1/2 -translate-y-1/2" title="연도 삭제"><Icons.X className="w-3 h-3"/></button></div></th>))}
                                </tr></thead>
                                <tbody className="divide-y divide-slate-100">{salaryData.items.map((item, idx) => {
                                    const itemTotal = Object.values(item.values).reduce((acc, val) => acc + (Number(val) || 0), 0);
                                    return (<tr key={item.id} className={`hover:bg-indigo-50/20 transition-colors group/tr ${idx % 2 === 0 ? 'bg-white' : 'bg-slate-50/30'}`}><td className="p-4 text-left font-extrabold text-slate-700 bg-white sticky left-0 border-r border-slate-100 z-10 group-hover/tr:bg-indigo-50/50 transition-colors">{item.name}</td><td className="p-4 text-right font-black text-indigo-600 bg-indigo-50/30 sticky left-28 border-r border-slate-100 z-10 group-hover/tr:bg-indigo-100/50 transition-colors">{formatCurrency(itemTotal)}</td>{years.map(year => (<td key={year} className="p-0 border-r border-slate-100/50"><CurrencyInput value={item.values[year] || 0} onChange={(val) => handleValueChange(item.id, year, val)} className="w-full h-full p-4 text-right bg-transparent focus:bg-white outline-none text-xs font-mono text-slate-600 hover:bg-white transition-all"/></td>))}</tr>);
                                })}</tbody>
                            </table>
                        </div>
                    </GlassCard>
                </div>
            );
        };

        const SyncModal = ({ isOpen, onClose, currentId, onSyncIdChange }) => {
            const [inputValue, setInputValue] = useState(''); if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 animate-fade-in" onClick={onClose}><div className="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl m-4" onClick={e => e.stopPropagation()}><div className="flex justify-between items-center mb-6"><h3 className="text-xl font-bold text-slate-800 flex items-center gap-2"><div className="p-2 bg-indigo-100 rounded-lg text-indigo-600"><Icons.Cloud className="w-5 h-5"/></div>기기 연동 (Data Sync)</h3><button onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icons.X className="w-5 h-5"/></button></div><div className="space-y-6"><div className="bg-slate-50 p-4 rounded-xl border border-slate-200"><label className="block text-xs font-bold text-slate-500 uppercase mb-2">현재 기기 연동 키</label><div className="flex gap-2"><code className="flex-1 bg-white border border-slate-200 rounded-lg p-3 text-xs font-mono text-slate-600 break-all select-all">{currentId}</code><button onClick={() => { navigator.clipboard.writeText(currentId); alert('복사되었습니다!'); }} className="p-3 bg-white border border-slate-200 rounded-lg text-slate-500 hover:text-indigo-600 hover:border-indigo-200 transition-colors"><Icons.Copy className="w-4 h-4"/></button></div><p className="text-[10px] text-slate-400 mt-2">* 이 키를 복사하여 다른 기기의 "불러오기"에 입력하면 데이터가 연동됩니다.</p></div><div className="border-t border-slate-100 pt-6"><label className="block text-sm font-bold text-slate-700 mb-2">다른 기기의 데이터 불러오기</label><div className="flex gap-2"><input type="text" value={inputValue} onChange={(e) => setInputValue(e.target.value)} placeholder="연동 키 입력" className="flex-1 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20"/><button onClick={() => { if(confirm('데이터를 불러오시겠습니까? 기존 데이터는 덮어씌워질 수 있습니다.')) { onSyncIdChange(inputValue.trim()); onClose(); } }} disabled={!inputValue.trim()} className="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-indigo-700 disabled:opacity-50 transition-colors">불러오기</button></div></div></div></div></div>
            );
        };

        const SliderInput = ({ label, value, min, max, step = 1, unit = '', onChange, formatter = (v) => v }) => (
            <div className="space-y-2">
                <div className="flex justify-between items-center">
                    <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">{label}</label>
                    <span className="text-xs font-black text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-lg">{formatter(value)}{unit}</span>
                </div>
                <input 
                    type="range" min={min} max={max} step={step} value={value} 
                    onChange={(e) => onChange(Number(e.target.value))}
                    className="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600"
                />
            </div>
        );

        const LoanCalculator = () => {
            const [purchasePrice, setPurchasePrice] = useState(500000000);
            const [equityRatio, setEquityRatio] = useState(30);
            const [rate, setRate] = useState(3.5);
            const [term, setTerm] = useState(30); // years
            const [gracePeriod, setGracePeriod] = useState(0); // years
            const [type, setType] = useState('level'); // level, principal, maturity

            const loanAmount = useMemo(() => purchasePrice * (1 - equityRatio / 100), [purchasePrice, equityRatio]);

            const results = useMemo(() => {
                const L = loanAmount;
                const r = rate / 100 / 12;
                const n = term * 12;
                const g = gracePeriod * 12;
                
                let monthlyPayment = 0;
                let totalInterest = 0;
                const yearlyData = [];

                if (r === 0) {
                    const mp = L / (n - g);
                    return { monthlyPayment: mp, totalInterest: 0, totalPayment: L, yearlyData: [] };
                }

                let currentBalance = L;
                let cumulativeInterest = 0;

                for (let year = 1; year <= term; year++) {
                    let yearPrincipal = 0;
                    let yearInterest = 0;

                    for (let month = 1; month <= 12; month++) {
                        const currentMonth = (year - 1) * 12 + month;
                        let mInterest = currentBalance * r;
                        let mPrincipal = 0;

                        if (currentMonth <= g) {
                            mPrincipal = 0;
                            if (type === 'maturity' && currentMonth === n) {
                                // Handled below
                            }
                        } else {
                            if (type === 'level') {
                                const remainingMonths = n - g;
                                const mp = L * r * Math.pow(1 + r, remainingMonths) / (Math.pow(1 + r, remainingMonths) - 1);
                                monthlyPayment = mp; // Last one set will be the repayment phase amount
                                mPrincipal = mp - mInterest;
                            } else if (type === 'principal') {
                                mPrincipal = L / (n - g);
                                monthlyPayment = mPrincipal + mInterest; // Varies, but for display we'll show initial or avg?
                            } else if (type === 'maturity') {
                                mPrincipal = 0;
                                monthlyPayment = mInterest;
                            }
                        }

                        if (type === 'maturity' && currentMonth === n) {
                            mPrincipal = L;
                        }

                        yearPrincipal += mPrincipal;
                        yearInterest += mInterest;
                        currentBalance -= mPrincipal;
                        cumulativeInterest += mInterest;
                    }

                    yearlyData.push({
                        name: `${year}년`,
                        원금: Math.round(yearPrincipal),
                        이자: Math.round(yearInterest)
                    });
                }

                // For display in the summary card
                let displayMonthly = 0;
                if (type === 'level') {
                    const remainingMonths = n - g;
                    displayMonthly = L * r * Math.pow(1 + r, remainingMonths) / (Math.pow(1 + r, remainingMonths) - 1);
                } else if (type === 'principal') {
                    displayMonthly = (L / (n - g)) + (L * r); // Initial payment
                } else {
                    displayMonthly = L * r; // Monthly interest
                }

                return { 
                    monthlyPayment: displayMonthly, 
                    totalInterest: cumulativeInterest, 
                    totalPayment: L + cumulativeInterest,
                    yearlyData 
                };
            }, [loanAmount, rate, term, gracePeriod, type]);

            return (
                <GlassCard className="p-6 h-full flex flex-col">
                    <div className="flex items-center justify-between mb-8">
                        <div className="flex items-center gap-2">
