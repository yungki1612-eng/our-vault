        .sticky-col-header { 
            position: sticky;

            backdrop-filter: blur(8px); 
            border-right: 2px solid #e2e8f0 !important;
        }

            -webkit-backdrop-filter: blur(8px);

        .sticky-c2 { position: sticky; left: 70px; z-index: 40 !important; background-color: rgba(255, 255, 255, 0.98); border-right: 1px solid #f1f5f9; }
        .sticky-c3 { position: sticky; left: 130px; z-index: 40 !important; background-color: rgba(255, 255, 255, 0.98); border-right: 2px solid #e2e8f0 !important; box-shadow: 2px 0 5px -2px rgba(0,0,0,0.05); }

        .dark .sticky-col-cell { background-color: rgba(15, 23, 42, 0.95); border-right-color: #334155 !important; }
        .dark .sticky-sum-cell { background-color: rgba(30, 41, 59, 0.95); border-right-color: #475569 !important; }

            position: sticky; 
            left: 0; 
            z-index: 45 !important; 
            border-right: 2px solid rgba(0,0,0,0.05) !important;
        }
        .cursor-move { cursor: move; }

        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */

        // --- Error Boundary & Utilities ---
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            componentDidCatch(error, errorInfo) { console.error("App Error:", error, errorInfo); }
            handleReset = () => {
                if (confirm("데이터를 초기화하고 복구하시겠습니까?")) {
                    localStorage.removeItem('financialData');
                    localStorage.removeItem('fm_sync_id'); 
                    window.location.reload();
                }
            };
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50 p-6 text-center">
                            <Icons.AlertOctagon className="w-16 h-16 text-rose-500 mb-4" />
                            <h2 className="text-2xl font-bold text-slate-800 mb-2">시스템 오류 발생</h2>
                            <p className="text-slate-600 mb-6">오류 내용: {this.state.error?.message || "알 수 없는 오류"}</p>
                            <button onClick={this.handleReset} className="bg-rose-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-rose-700 transition-colors shadow-lg">데이터 초기화 및 복구</button>
                        </div>
                    );
                }
                return this.props.children; 
            }
        }

        const formatCurrency = (value) => {
            if (typeof value !== 'number' || isNaN(value)) return '0';
            return new Intl.NumberFormat('ko-KR', { style: 'decimal', maximumFractionDigits: 0 }).format(value);
        };

        const formatNumberWithCommas = (value) => {
            if (!value && value !== 0) return '';
            return String(value).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        };

        const evaluateFormula = (val) => {
            if (typeof val === 'number') return val;
            if (typeof val !== 'string' || !val) return 0;
            try {
                const cleanExpr = val.replace(/,/g, '').replace(/^=/, '');
                if (!isNaN(cleanExpr) && cleanExpr.trim() !== '') return parseFloat(cleanExpr) || 0;
                const result = Function(`'use strict'; return (${cleanExpr})`)();
                return typeof result === 'number' ? result : 0;
            } catch (e) { return 0; }
        };

        const getPreviousMonth = (ym) => {
            if (!ym || typeof ym !== 'string') return '2024-01';
            const [y, m] = ym.split('-').map(Number);
            if (isNaN(y) || isNaN(m)) return '2024-01';
            let py = y - 1, pm = m; 
            if (py < 2024) return ym;
            return `${py}-${String(pm).padStart(2, '0')}`;
        };

        const isMonthKey = (key) => /^\d{4}-\d{2}$/.test(key);

        const generateInitialData = () => {
            const data = {};
            data['2024-01'] = { assets: [], loans: [], budget: [], stockProfit: [] };
            data.meta = { sortOrder: {}, dashboardMemo: '', hiddenRows: {}, goals: { loan: 30, invest: 30, netWorth: 1000000000 }, dashboardLayout: {} };
            const startYear = 2014;
            const endYear = 2025;
            const years = [];
            for (let y = startYear; y <= endYear; y++) years.push(String(y));
            
            data.salary = {
                years: years,
                items: [
                    { id: 1, name: '융기', values: {} },
                    { id: 2, name: '수아', values: {} }
                ]
            };
            data.salary.items.forEach(item => {
                years.forEach(y => item.values[y] = 0);
            });
            
            return data;
        };

        const ASSET_CATEGORIES = {
            SAVINGS:       { label: '예적금',   color: '#3B82F6', bg: 'bg-blue-50',    text: 'text-blue-700' }, 
            INVESTMENT:    { label: '주식',     color: '#8B5CF6', bg: 'bg-violet-50',  text: 'text-violet-700' }, 
            COIN:          { label: '코인',     color: '#F59E0B', bg: 'bg-amber-50',   text: 'text-amber-700' },

            PENSION:       { label: '연금',     color: '#EC4899', bg: 'bg-pink-50',    text: 'text-pink-700' }  
        };

        const REAL_ESTATE_CATEGORIES = {
            APARTMENT: { label: '아파트', bg: 'bg-indigo-50', text: 'text-indigo-700' },
            OFFICETEL: { label: '오피스텔', bg: 'bg-blue-50', text: 'text-blue-700' },

            OTHER: { label: '기타', bg: 'bg-slate-50', text: 'text-slate-700' }
        };

        const BUDGET_CATEGORIES = {
            INCOME:  { label: '수입', type: 'income',  bg: 'bg-sky-100',  text: 'text-sky-900' },
            SAVING:  { label: '저축', type: 'expense', bg: 'bg-teal-50',  text: 'text-teal-700' }, 
            INVEST:  { label: '투자', type: 'expense', bg: 'bg-indigo-50', text: 'text-indigo-700' }, 
            EXPENSE: { label: '지출', type: 'expense', bg: 'bg-rose-50',  text: 'text-rose-700' },        
        };

        const normalizeCategory = (cat, type) => {
             if (!cat) return '';
            const upper = String(cat).toUpperCase().trim();
            if (type === 'assets') {
                if (['SAVING', 'SAVINGS', '예적금', '현금', '적금', '예금', '저축', 'BANK', 'DEPOSIT'].some(k => upper.includes(k))) return 'SAVINGS';
                if (['INVEST', 'STOCK', '주식', '증권', '펀드'].some(k => upper.includes(k))) return 'INVESTMENT';
                if (['COIN', 'CRYPTO', '코인', '비트코인'].some(k => upper.includes(k))) return 'COIN';
                if (['ESTATE', 'REAL', '부동산', '전세', '보증금', '아파트', '주택', 'REALESTATE'].some(k => upper.includes(k))) return 'REAL_ESTATE';
                if (['PENSION', 'IRP', '퇴직연금', '연금'].some(k => upper.includes(k))) return 'PENSION';
                if (ASSET_CATEGORIES[upper]) return upper;
                return 'SAVINGS'; 
            }
            if (type === 'budget') {
                if (['수입', '급여', '월급'].some(k => upper.includes(k))) return 'INCOME';
                if (['저축', '적금'].some(k => upper.includes(k)))          return 'SAVING';
                if (['투자'].some(k => upper.includes(k)))                  return 'INVEST';
                if (['지출', '소비', '카드'].some(k => upper.includes(k))) return 'EXPENSE';
                if (BUDGET_CATEGORIES[upper]) return upper;
                return 'EXPENSE'; 
            }
            if (type === 'loans') {
                if (upper === 'LEASE' || upper.includes('전세')) return 'LEASE';
                return 'LOAN';
            }
            return upper;
        };

        const isItemHidden = (item, type, meta) => {
            if (!meta || !meta.hiddenRows || !meta.hiddenRows[type]) return false;
            const itemKey = `${item.category||'ALL'}|${item.category2||''}|${item.name}`;
            return meta.hiddenRows[type].includes(itemKey);
        };

        const parseCSVLine = (text) => {
            const result = []; let current = ''; let inQuote = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (char === '"') inQuote = !inQuote;
                else if (char === ',' && !inQuote) { result.push(current.trim()); current = ''; } 
                else current += char;
            }
            result.push(current.trim());
            return result.map(cell => cell.replace(/^"|"$/g, '').replace(/""/g, ''));
        };

        const parseDateHeader = (header) => {
            if (!header) return null;
            let cleanHeader = header.replace(/^\uFEFF/, '').trim();
            const matchStandard = cleanHeader.match(/^(\d{4})[-./](\d{1,2})$/);
            if (matchStandard) return `${matchStandard[1]}-${String(matchStandard[2]).padStart(2, '0')}`;
            const matchShort = cleanHeader.match(/^(\d{2})[-./](\d{1,2})$/);
            if (matchShort) return `20${matchShort[1]}-${String(matchShort[2]).padStart(2, '0')}`;
            if (/^\d{6}$/.test(cleanHeader)) return `${cleanHeader.substring(0,4)}-${cleanHeader.substring(4,6)}`;
            const matchKorean = cleanHeader.match(/^(\d{4})년\s*(\d{1,2})월$/);
            if (matchKorean) return `${matchKorean[1]}-${String(matchKorean[2]).padStart(2, '0')}`;
            const months = { jan: '01', feb: '02', mar: '03', apr: '04', may: '05', jun: '06', jul: '07', aug: '08', sep: '09', oct: '10', nov: '11', dec: '12' };
            const lowerHeader = cleanHeader.toLowerCase();
            const matchEngYearFirst = lowerHeader.match(/^(\d{2})[-.\s]([a-z]{3})$/);
            if (matchEngYearFirst && months[matchEngYearFirst[2]]) return `20${matchEngYearFirst[1]}-${months[matchEngYearFirst[2]]}`;
            const matchEngMonthFirst = lowerHeader.match(/^([a-z]{3})[-.\s]?(\d{2,4})$/);
            if (matchEngMonthFirst && months[matchEngMonthFirst[1]]) {
                let year = matchEngMonthFirst[2]; if (year.length === 2) year = '20' + year;
                return `${year}-${months[matchEngMonthFirst[1]]}`;
            }
            return null;
        };

        const processFileUpload = (file, currentData, type, onUpdate, setIsUploading) => {
            if (!file) return;
            setIsUploading(true);
            const parseFile = (encoding) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.onerror = (e) => reject(e);
                    reader.readAsText(file, encoding);
                });
            };
            const processText = (text) => {
                if (text.charCodeAt(0) === 0xFEFF) text = text.substr(1);
                const lines = text.split(/\r\n|\n|\r/).filter(line => line.trim() !== '');
                if (lines.length < 2) return { success: false, message: "데이터가 부족합니다." };
                const header = parseCSVLine(lines[0]);
                const monthIndices = {};
                header.forEach((col, idx) => {
                    const parsedDate = parseDateHeader(col);
                    if (parsedDate) monthIndices[parsedDate] = idx;
                });
                if (Object.keys(monthIndices).length === 0) return { success: false, message: "날짜 컬럼을 찾을 수 없습니다." };
                const newData = JSON.parse(JSON.stringify(currentData));
                Object.keys(monthIndices).forEach(m => {
                    if (!newData[m]) newData[m] = { assets: [], loans: [], budget: [], stockProfit: [] };
                });
                for (let i = 1; i < lines.length; i++) {
                    const row = parseCSVLine(lines[i]);
                    if (row.length < 2) continue;
                    let category = ''; let name = '';
                    if (type === 'stockProfit') {
                        const rawType = (row[0] || '').trim().toUpperCase();
                        category = (rawType === 'PROFIT' || rawType === 'DIVIDEND' || rawType === 'P' || rawType === 'D') ? rawType : 'PROFIT';
                        name = (row[1] || '').trim();
                    } else {
                        category = normalizeCategory((row[0] || '').trim(), type);
                        name = (row[1] || '').trim();
                    }
                    if (!name) continue;
                    Object.entries(monthIndices).forEach(([month, colIdx]) => {
                        const rawVal = row[colIdx] ? row[colIdx].replace(/,/g, '') : '0';
                        const val = parseFloat(rawVal) || 0;
                        if (!newData[month]) newData[month] = { assets: [], loans: [], budget: [], stockProfit: [] };
                        const listKey = type === 'stockProfit' ? 'stockProfit' : type;
                        if (!newData[month][listKey]) newData[month][listKey] = [];
                        const list = newData[month][listKey];
                        const existingItem = list.find(item => item.name === name);
                        if (existingItem) {
                            if (type === 'stockProfit') {
                                if (category === 'DIVIDEND' || category === 'D') existingItem.dividend = val; else existingItem.profit = val;
                            } else {
                                if (category) existingItem.category = category;
                                if (type === 'assets') existingItem.value = val; else existingItem.amount = val;
                            }
                        } else {
                            const newItem = { id: Date.now() + Math.random() + i, name };
                            if (type === 'stockProfit') {
                                newItem.profit = 0; newItem.dividend = 0;
                                if (category === 'DIVIDEND' || category === 'D') newItem.dividend = val; else newItem.profit = val;
                            } else {
                                if (category) newItem.category = category;
                                if (type === 'assets') newItem.value = val; else newItem.amount = val;
                            }
                            list.push(newItem);
                        }
                    });
                }
                return { success: true, data: newData };
            };
            parseFile('UTF-8').then(text => {
                let result = processText(text);
                if (result.success) { onUpdate(result.data); alert('데이터 업로드 완료!'); setIsUploading(false); }
                else {
                    parseFile('EUC-KR').then(textKR => {
                        result = processText(textKR);
                        if (result.success) { onUpdate(result.data); alert('데이터 업로드 완료! (EUC-KR)'); }
                        else { alert(`오류: ${result.message}\n(지원 형식: 2024-01, 24.01, 2024년 1월 등)`); }
                        setIsUploading(false);
                    }).catch(() => { alert(`오류: ${result.message}\n(지원 형식: 2024-01, 24.01, 2024년 1월 등)`); setIsUploading(false); });
                }
            }).catch(err => { console.error(err); alert("파일 읽기 실패"); setIsUploading(false); });
        };

        const downloadCSV = (data, type) => {
            const months = Object.keys(data).filter(isMonthKey).sort();
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            let header = (type === 'stockProfit') ? "Type,Item" : "Category,Item";
            months.forEach(m => header += `,${m}`);
            csvContent += header + "\n";
            const listKey = type === 'stockProfit' ? 'stockProfit' : type;
            const uniqueItemsMap = new Map();
            months.forEach(m => { (data[m]?.[listKey] || []).forEach(item => { if (!uniqueItemsMap.has(item.name)) uniqueItemsMap.set(item.name, item.category || ''); }); });
            uniqueItemsMap.forEach((category, name) => {
                if (type === 'stockProfit') {
                    const rowProfit = [`PROFIT`, `"${name}"`];
                    const rowDividend = [`DIVIDEND`, `"${name}"`];
                    months.forEach(m => {
                        const found = (data[m]?.[listKey] || []).find(i => i.name === name);
                        rowProfit.push(found ? (found.profit || 0) : 0);
                        rowDividend.push(found ? (found.dividend || 0) : 0);
                    });
                    csvContent += rowProfit.join(",") + "\n" + rowDividend.join(",") + "\n";
                } else {
                    const row = [`"${category}"`, `"${name}"`];
                    months.forEach(m => {
                        const found = (data[m]?.[listKey] || []).find(i => i.name === name);
                        let val = 0;
                        if (found) { if (type === 'assets') val = found.value; else val = found.amount; }
                        row.push(val);
                    });
                    csvContent += row.join(",") + "\n";
                }
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `${type}_data.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // --- Base UI Components ---
        const GlassCard = ({ children, className = "", onClick }) => (

        const CurrencyInput = ({ value, onChange, className }) => {
            const [localValue, setLocalValue] = useState(String(value || 0));
            const [isEditing, setIsEditing] = useState(false);

            const calculate = (expression) => {
                if (typeof expression !== 'string') return expression;
                try {
                    const cleanExpr = expression.replace(/,/g, '').replace(/^=/, '');
                    if (!isNaN(cleanExpr) && cleanExpr.trim() !== '') return parseFloat(cleanExpr) || 0;
                    // 간단한 사칙연산 수식 계산
                    const result = Function(`'use strict'; return (${cleanExpr})`)();
                    return typeof result === 'number' ? result : 0;
                } catch (e) { return 0; }
            };

            useEffect(() => {
                if (!isEditing) {
                    const displayVal = (typeof value === 'string' && /[\+\-\*\/\(\)]/.test(value)) 
                        ? calculate(value) 
                        : value;
                    setLocalValue(formatNumberWithCommas(displayVal));
                }
            }, [value, isEditing]);

            const handleBlur = () => {
                setIsEditing(false);
                const cleanInput = localValue.replace(/,/g, '').trim();
                const isFormula = /[\+\-\*\/\(\)]/.test(cleanInput) && isNaN(cleanInput);
                const finalValue = isFormula ? cleanInput : (parseFloat(cleanInput) || 0);
                onChange(finalValue);
                setLocalValue(formatNumberWithCommas(calculate(cleanInput)));
            };

            return (
                <input 
                    type="text" 
                    value={localValue}
                    onChange={(e) => setLocalValue(e.target.value)}
                    onFocus={() => { setIsEditing(true); setLocalValue(String(value || 0).replace(/,/g, '')); }}
                    onBlur={handleBlur}
                    onKeyDown={(e) => e.key === 'Enter' && e.target.blur()}
                    className={`bg-transparent border-none outline-none w-full text-right font-medium text-slate-700 placeholder:text-slate-300 focus:ring-0 ${className}`}
                />
            );
        };

            const [isEditing, setIsEditing] = useState(false);
            const [newName, setNewName] = useState(item.name);
            useEffect(() => { setNewName(item.name); }, [item.name]);
            const handleDragStart = (e) => { if (isEditing) { e.preventDefault(); return; } e.dataTransfer.setData('app/json', JSON.stringify({ name: item.name, category })); };
            const handleDrop = (e) => { e.preventDefault(); try { const data = JSON.parse(e.dataTransfer.getData('app/json')); if (data.name !== item.name) onDrop(category, data.name, item.name, data.category); } catch (err) {} };
            const saveName = () => { if (newName && newName !== item.name) onRename(item.name, newName); setIsEditing(false); };
            return (

                    <td className="sticky-col-cell border-r-2 border-slate-200 align-middle">

                            <button onClick={(e) => { e.stopPropagation(); onToggleHide(); }} className="p-1.5 text-slate-400 hover:text-indigo-500 rounded-lg hover:bg-white transition-colors">{isHidden ? <Icons.EyeOff className="w-3.5 h-3.5"/> : <Icons.Eye className="w-3.5 h-3.5"/>}</button>
                            {isEditing ? (
                                <div className="flex items-center flex-1">
                                    <input autoFocus type="text" value={newName} onChange={(e) => setNewName(e.target.value)} onBlur={saveName} onKeyDown={(e) => { if (e.key === 'Enter' && !e.nativeEvent.isComposing) saveName(); }} className="bg-white border border-indigo-300 rounded-lg px-2 py-1 text-sm w-full focus:outline-none shadow-sm text-left" onClick={(e) => e.stopPropagation()} />
                                    <button onClick={saveName} className="p-1.5 text-emerald-600 ml-1"><Icons.Check className="w-3.5 h-3.5" /></button>
                                </div>
                            ) : (

                                    <button className="p-1.5 text-slate-300 hover:text-indigo-600 opacity-0 group-hover/edit:opacity-100 transition-opacity"><Icons.Edit2 className="w-3.5 h-3.5" /></button>
                                </div>
                            )}
                            <button onClick={(e) => { e.stopPropagation(); onDelete(); }} className="p-1.5 text-slate-300 hover:text-rose-500 rounded-lg ml-1 opacity-0 group-hover:opacity-100 transition-opacity"><Icons.Trash2 className="w-3.5 h-3.5" /></button>
                        </div>
                    </td>
                    {children}
                </tr>
            );
        };

        const CompactScoreCard = ({ title, value, yoy, icon: Icon, colorClass, tooltip, breakdown }) => {

            let valueColor = colorClass || 'text-slate-800';
            if (title.includes('손익') || title.includes('수익')) { if (value > 0) valueColor = 'text-rose-600'; else if (value < 0) valueColor = 'text-blue-600'; }
            
            const isNoHover = title === "총 자산" || title === "순자산";
            
            return (
                <GlassCard className={`p-3 flex flex-col justify-between h-full min-h-[90px] relative overflow-visible ${isNoHover ? '' : 'group hover:-translate-y-1 transition-transform'}`}>
                    <div className="flex justify-between items-center mb-1">
                        <div className="flex items-center gap-1.5 relative"><div className={`p-1 rounded bg-slate-50 text-slate-500 ${isNoHover ? '' : 'group-hover:bg-indigo-50 group-hover:text-indigo-600'} transition-colors`}>{Icon ? <Icon className="w-3.5 h-3.5" /> : <Icons.Wallet className="w-3.5 h-3.5"/>}</div><span className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">{title}</span>{(tooltip || breakdown) && !isNoHover && (<div className="group/tip relative flex items-center"><Icons.Info className="w-3 h-3 text-slate-300 hover:text-indigo-500 cursor-help" /><div className="absolute left-0 top-full mt-2 w-48 bg-slate-800/95 backdrop-blur-sm text-white text-[10px] rounded-lg p-3 opacity-0 group-hover/tip:opacity-100 pointer-events-none transition-opacity z-50 shadow-xl border border-slate-700/50">{breakdown ? (<div className="space-y-1.5"><div className="font-bold text-slate-300 border-b border-slate-600 pb-1 mb-1">{title} 구성</div>{breakdown.map((item, idx) => (<div key={idx} className="flex justify-between items-center"><span className="text-slate-400">{item.label}</span><span className={`font-mono ${item.value < 0 ? 'text-rose-400' : 'text-slate-200'}`}>{formatNumberWithCommas(item.value)}</span></div>))}</div>) : tooltip}</div></div>)}</div>

                 <div className="flex items-center gap-1.5 mb-2"><div className="p-1 rounded bg-white text-indigo-600 shadow-sm"><Icons.Calendar className="w-3 h-3"/></div><span className="text-[10px] font-bold text-slate-500 uppercase tracking-wider">{year}년 누적 실적</span></div>

        const AIAnalysisCard = ({ assets, liabilities, netWorth, income, expense, year, data, isWrapped }) => {
            const debtRatio = netWorth !== 0 ? (liabilities / netWorth) * 100 : 0;

            let assetStatus = "안정", assetColor = "text-emerald-500", assetBg = "bg-emerald-500";
            if (debtRatio > 40) { assetStatus = "위험"; assetColor = "text-rose-500"; assetBg = "bg-rose-500"; } else if (debtRatio > 20) { assetStatus = "주의"; assetColor = "text-amber-500"; assetBg = "bg-amber-500"; }

            let adviceTitle = "안정적인 자산 관리 중입니다.";

            else if (budgetStatus === "적자") { adviceTitle = "지출 통제가 필요합니다."; adviceDetail = "수입보다 지출이 많습니다. 불필요한 소비를 점검하고 예산을 다시 세우세요."; }
            else if (assetStatus === "주의" || budgetStatus === "부족") { adviceTitle = "조금 더 노력이 필요합니다."; adviceDetail = "저축률을 높이거나 부채를 조금 더 줄이면 훨씬 안정적인 상태가 될 것입니다."; }

            const content = (
                <div className={`relative overflow-hidden ${isWrapped ? '' : 'bg-gradient-to-br from-indigo-600 to-violet-700 text-white rounded-2xl shadow-xl p-4 sm:p-5 group transition-all hover:shadow-2xl hover:scale-[1.01]'} h-full flex flex-col`}>
                    {!isWrapped && <div className="absolute top-0 right-0 w-56 h-56 bg-white/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2 pointer-events-none"></div>}
                    {!isWrapped && (
                        <div className="relative z-10 flex items-center justify-between mb-3">
                            <div className="flex items-center gap-2"><div className="p-1.5 bg-white/20 backdrop-blur-md rounded-xl border border-white/20 shadow-inner"><Icons.Sparkles className="w-4 h-4 text-yellow-300 animate-pulse" /></div><span className="font-bold text-base tracking-tight leading-tight">AI Asset Advisor</span></div>
                            <div className="px-2 py-0.5 bg-white/20 backdrop-blur-md rounded-lg border border-white/10 text-[10px] font-bold uppercase tracking-wider text-indigo-100">Beta</div>
                        </div>
                    )}
                    <div className={`relative z-10 flex-1 flex flex-col min-h-0 ${isWrapped ? 'text-slate-800' : 'text-white'}`}>
                        <div className="flex items-baseline gap-2 mb-1"><span className={`text-2xl font-black ${isWrapped ? 'text-indigo-600' : 'text-transparent bg-clip-text bg-gradient-to-r from-white to-indigo-200'} leading-none`}>{Math.max(0, 100 - (debtRatio * 0.5) + (savingsRate * 0.5)).toFixed(0)}</span><span className={`text-[10px] font-bold ${isWrapped ? 'text-slate-400' : 'text-indigo-200'} leading-tight uppercase tracking-wider`}>Health Score</span></div>

        const Dashboard = ({ data = {}, onUpdate }) => {
            const safeData = data || {};
            const allMonths = Object.keys(safeData).filter(isMonthKey).sort();
            const [viewDate, setViewDate] = useState(() => {
                const today = new Date();
                const key = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
                return allMonths.includes(key) ? key : (allMonths[allMonths.length - 1] || '2024-01');
            });
            const viewYear = viewDate.split('-')[0];
            const todayStr = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
            const currentData = safeData[viewDate] || { assets: [], loans: [], budget: [], stockProfit: [] };
            const prevYearDate = getPreviousMonth(viewDate);
            const prevYearData = safeData[prevYearDate] || null;
            
            const reStats = useMemo(() => {
                const list = safeData.realEstate || [];
                return {
                    totalValue: list.reduce((acc, item) => acc + (evaluateFormula(item.currentValue) || 0), 0),
                    totalDebt: list.reduce((acc, item) => acc + (evaluateFormula(item.loan) || 0) + (evaluateFormula(item.deposit) || 0), 0),
                    ownedDebt: list.filter(item => item.ownershipType === 'OWN' || !item.ownershipType).reduce((acc, item) => acc + (evaluateFormula(item.loan) || 0) + (evaluateFormula(item.deposit) || 0), 0)
                };
            }, [safeData.realEstate]);

            const assetBreakdown = Object.keys(ASSET_CATEGORIES).map(catKey => {
                let sum = (currentData.assets || []).filter(a => a.category === catKey && !isItemHidden(a, 'assets', safeData.meta)).reduce((acc, cur) => acc + (evaluateFormula(cur.value) || 0), 0);
                if (catKey === 'REAL_ESTATE') sum += reStats.totalValue;
                return { label: ASSET_CATEGORIES[catKey].label, value: sum };
            }).filter(i => i.value > 0);

            const totalAssets = (currentData.assets || []).filter(a => !isItemHidden(a, 'assets', safeData.meta)).reduce((acc, cur) => acc + (evaluateFormula(cur.value) || 0), 0) + reStats.totalValue;
            const prevTotalAssets = prevYearData ? (prevYearData.assets || []).filter(a => !isItemHidden(a, 'assets', safeData.meta)).reduce((acc, cur) => acc + (evaluateFormula(cur.value) || 0), 0) + reStats.totalValue : totalAssets;
            
            const liabilitiesExclJeonse = (currentData.loans || []).filter(l => l.category !== 'LEASE' && !l.name.includes('전세') && !isItemHidden(l, 'loans', safeData.meta)).reduce((acc, cur) => acc + (evaluateFormula(cur.amount) || 0), 0) + reStats.ownedDebt;
            const prevLiabilities = prevYearData ? (prevYearData.loans || []).filter(l => l.category !== 'LEASE' && !l.name.includes('전세') && !isItemHidden(l, 'loans', safeData.meta)).reduce((acc, cur) => acc + (evaluateFormula(cur.amount) || 0), 0) + reStats.ownedDebt : liabilitiesExclJeonse;
            const netWorth = totalAssets - liabilitiesExclJeonse;
            const prevNetWorth = prevTotalAssets - prevLiabilities;
            const calcYoY = (curr, prev) => (prev && prev !== 0) ? ((curr - prev) / prev) * 100 : 0;
            const totalStockAssets = (currentData.assets || []).filter(a => a.category === 'INVESTMENT' && !isItemHidden(a, 'assets', safeData.meta)).reduce((acc, cur) => acc + (evaluateFormula(cur.value) || 0), 0);
            const prevTotalStockAssets = prevYearData ? (prevYearData.assets || []).filter(a => a.category === 'INVESTMENT' && !isItemHidden(a, 'assets', safeData.meta)).reduce((acc, cur) => acc + (evaluateFormula(cur.value) || 0), 0) : 0;
            
            // 신규 지표: 비상금 지수 (Months of coverage)
            const liquidAssets = (currentData.assets || []).filter(a => a.category === 'SAVINGS' && !isItemHidden(a, 'assets', safeData.meta)).reduce((acc, cur) => acc + (evaluateFormula(cur.value) || 0), 0);

            const fullGrowthData = allMonths.map(month => {
                const d = safeData[month];

            });
            const recentMonths = allMonths.slice(Math.max(0, allMonths.indexOf(viewDate) - 11), allMonths.indexOf(viewDate) + 1);
            const assetGrowthData = recentMonths.map(month => {
                const d = safeData[month];
                const result = { name: month };
                Object.keys(ASSET_CATEGORIES).forEach(key => {
                    result[ASSET_CATEGORIES[key].label] = (d?.assets || []).filter(a => a.category === key && !isItemHidden(a, 'assets', safeData.meta)).reduce((acc, cur) => acc + (evaluateFormula(cur.value) || 0), 0);
                });
                return result;
            });
            const cashFlowData = recentMonths.map(month => {
                const d = safeData[month];
                const income = (d?.budget || []).filter(b => (b.category === 'INCOME' || normalizeCategory(b.category || b.name, 'budget') === 'INCOME') && !isItemHidden(b, 'budget', safeData.meta)).reduce((a,b)=>a+(evaluateFormula(b.amount) || 0), 0);
                const expense = (d?.budget || []).filter(b => (b.category === 'EXPENSE' || normalizeCategory(b.category || b.name, 'budget') === 'EXPENSE') && !isItemHidden(b, 'budget', safeData.meta)).reduce((a,b)=>a+(evaluateFormula(b.amount) || 0), 0);
                const saving = (d?.budget || []).filter(b => (b.category === 'SAVING' || normalizeCategory(b.category || b.name, 'budget') === 'SAVING') && !isItemHidden(b, 'budget', safeData.meta)).reduce((a,b)=>a+(evaluateFormula(b.amount) || 0), 0);
                const invest = (d?.budget || []).filter(b => (b.category === 'INVEST' || normalizeCategory(b.category || b.name, 'budget') === 'INVEST') && !isItemHidden(b, 'budget', safeData.meta)).reduce((a,b)=>a+(evaluateFormula(b.amount) || 0), 0);
                
                return {
                    name: month,
                    수입: income,
                    지출: expense,
                    저축: saving,
                    투자: invest,
                    저축률: income > 0 ? parseFloat(((income - expense) / income * 100).toFixed(1)) : 0,
                    투자비중: income > 0 ? parseFloat((invest / income * 100).toFixed(1)) : 0
                };
            });
            const portfolioData = Object.keys(ASSET_CATEGORIES).map(catKey => {
                const categoryItems = (currentData.assets || []).filter(a => a.category === catKey && !isItemHidden(a, 'assets', safeData.meta));
                let val = categoryItems.reduce((a,b)=>a+(evaluateFormula(b.value) || 0), 0);
                if (catKey === 'REAL_ESTATE') val += reStats.totalValue;
                return { name: ASSET_CATEGORIES[catKey].label, value: val, color: ASSET_CATEGORIES[catKey].color };

            const [activeItem, setActiveIndex] = useState(null);

                onUpdate(newData);

            const investGoal = safeData.meta?.goals?.invest || 30;
            const netWorthGoal = safeData.meta?.goals?.netWorth || 1000000000;

                        </CollapsibleCard>
                        <CollapsibleCard title="자금 흐름" icon={Icons.Banknote} className="h-64">
                            <div className="h-full"><ResponsiveContainer width="100%" height="100%"><BarChart data={cashFlowData} barGap={4}><CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" /><XAxis dataKey="name" fontSize={10} stroke="#94a3b8" axisLine={false} tickLine={false} /><YAxis fontSize={10} width={40} stroke="#94a3b8" tickFormatter={(val) => `${(val/10000).toFixed(0)}만`} axisLine={false} tickLine={false} /><RechartsTooltip cursor={{fill: '#f8fafc'}} formatter={(val) => formatCurrency(val)} contentStyle={{ borderRadius: '8px', padding: '6px 10px', border: 'none', boxShadow: '0 4px 6px -1px rgba(0, 0, 0, 0.1)' }} itemStyle={{ fontSize: '11px', padding: 0 }} labelStyle={{ fontSize: '11px', marginBottom: '2px' }} /><Legend wrapperStyle={{fontSize:'11px'}} /><Bar dataKey="수입" fill="#38bdf8" radius={[4,4,0,0]} barSize={12} /><Bar dataKey="지출" stackId="out" fill="#fb7185" barSize={12} /><Bar dataKey="저축" stackId="out" fill="#34d399" barSize={12} /><Bar dataKey="투자" stackId="out" fill="#818cf8" radius={[4,4,0,0]} barSize={12} /></BarChart></ResponsiveContainer></div>
                        </CollapsibleCard>
                        <CollapsibleCard title="자산 포트폴리오" icon={Icons.PieChart} className="h-64" headerExtra={<span className="text-[10px] text-slate-400 font-bold">{viewDate} 기준</span>}>
                            <div className="flex-1 flex items-center gap-2 min-h-0">

                            <YearlyRatioCard year={viewYear} data={safeData} isWrapped />

                            <AIAnalysisCard assets={totalAssets} liabilities={liabilitiesExclJeonse} netWorth={netWorth} income={totalIncome} expense={totalExpense} year={viewYear} data={safeData} isWrapped />
                        </CollapsibleCard>
