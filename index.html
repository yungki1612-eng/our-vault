            const handleBlur = () => { if (text !== memo) onUpdate(text); };
            const content = (
                <div className="flex flex-col h-full">
                    {!isWrapped && <div className="flex items-center gap-2 mb-3 text-slate-400 font-bold text-sm"><Icons.Edit2 className="w-4 h-4"/> Console Memo</div>}
                    <textarea 
                        className="flex-1 w-full bg-black/35 border border-white/10 rounded-xl p-3 text-sm focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-400/50 outline-none resize-none transition-all custom-scrollbar placeholder:text-slate-600 text-slate-200" 
                        placeholder="Write down notes here..." 
                        value={text} 
                        onChange={(e) => setText(e.target.value)} 
                        onBlur={handleBlur}
                    ></textarea>
                </div>
            );
            return isWrapped ? content : <GlassCard className="p-5 h-full">{content}</GlassCard>;
        };

        const MonthlyAssetAllocationCard = ({ date, data, isWrapped, onUpdate }) => {
            // 기본 타겟 비율 (meta에 저장된 값이 있으면 그걸 사용)
            const savedTargets = (data?.meta?.allocationTargets) || {};
            const DEFAULT_TARGETS = { Stocks: 37, Crypto: 3, 'Loan Repayment': 8, 'Credit Cards': 20 };
            const getTarget = (label) => savedTargets[label] !== undefined ? savedTargets[label] : DEFAULT_TARGETS[label];

            const updateTarget = (label, newVal) => {
                if (!onUpdate || isNaN(newVal) || newVal < 0 || newVal > 100) return;
                const newData = { ...data, meta: { ...(data.meta || {}), allocationTargets: { ...savedTargets, [label]: newVal } } };
                onUpdate(newData);
            };

            // 인라인 편집 상태
            const [editingLabel, setEditingLabel] = useState(null);
            const [editValue, setEditValue] = useState('');

            const allocationPlan = [
                { label: 'Stocks', color: '#818cf8', bgColor: 'bg-indigo-500/10', textColor: 'text-indigo-400', borderColor: 'border-indigo-500/20',
                  getActual: (budget) => budget.filter(b => normalizeCategory(b.category, 'budget') === 'INVEST' && !isItemHidden(b, 'budget', data.meta) && b.name && (b.name.trim() === '주식' || b.name.trim() === 'ISA' || b.name.trim().includes('주식') || b.name.trim().includes('ISA'))).reduce((a,b) => a + (evaluateFormula(b.amount) || 0), 0) },
                { label: 'Crypto', color: '#f59e0b', bgColor: 'bg-amber-500/10', textColor: 'text-amber-400', borderColor: 'border-amber-500/20',
                  getActual: (budget) => budget.filter(b => normalizeCategory(b.category, 'budget') === 'INVEST' && !isItemHidden(b, 'budget', data.meta) && b.name && b.name.trim() === '가상자산').reduce((a,b) => a + (evaluateFormula(b.amount) || 0), 0) },
                { label: 'Loan Repayment', color: '#f43f5e', bgColor: 'bg-rose-500/10', textColor: 'text-rose-400', borderColor: 'border-rose-500/20',
                  getActual: (budget) => budget.filter(b => normalizeCategory(b.category, 'budget') === 'EXPENSE' && !isItemHidden(b, 'budget', data.meta) && b.name && b.name.trim() === '대출이자/상환' && (b.category2||'').trim() === 'Joint').reduce((a,b) => a + (evaluateFormula(b.amount) || 0), 0) },
                { label: 'Credit Cards', isLimit: true, color: '#06b6d4', bgColor: 'bg-cyan-500/10', textColor: 'text-cyan-400', borderColor: 'border-cyan-500/20',
                  getActual: (budget) => budget.filter(b => normalizeCategory(b.category, 'budget') === 'EXPENSE' && !isItemHidden(b, 'budget', data.meta) && b.name && b.name.trim() === '신용카드').reduce((a,b) => a + (evaluateFormula(b.amount) || 0), 0) },
            ].map(p => ({ ...p, targetRatio: getTarget(p.label) }));

            const stats = useMemo(() => {
                const year = date.substring(0, 4);
                const monthsWithData = Array.from({ length: 12 }, (_, i) => {
                    const monthKey = `${year}-${String(i + 1).padStart(2, '0')}`;
                    const mBudget = data[monthKey]?.budget || [];
                    const mIncome = mBudget.filter(b => normalizeCategory(b.category, 'budget') === 'INCOME' && !isItemHidden(b, 'budget', data.meta)).reduce((a,b) => a + (evaluateFormula(b.amount) || 0), 0);
                    return { monthKey, month: i + 1, budget: mBudget, income: mIncome, hasData: mIncome > 0 };
                }).filter(m => m.hasData);
                const dataMonthCount = monthsWithData.length;
                const annualIncome = monthsWithData.reduce((s, m) => s + m.income, 0);
                const items = allocationPlan.map(plan => {
                    const annualActualAmt = monthsWithData.reduce((s, m) => s + plan.getActual(m.budget), 0);
                    const annualTargetAmt = annualIncome * (plan.targetRatio / 100);
                    const achieved = annualIncome > 0 && (plan.isLimit ? annualActualAmt <= annualTargetAmt : annualActualAmt >= annualTargetAmt);
                    const progress = annualTargetAmt > 0 ? Math.min((annualActualAmt / annualTargetAmt) * 100, 100) : (annualActualAmt > 0 ? 100 : 0);
                    const actualRatio = annualIncome > 0 ? (annualActualAmt / annualIncome) * 100 : 0;
                    return { ...plan, income: annualIncome, targetAmt: annualTargetAmt, actualAmt: annualActualAmt, achieved, progress, actualRatio };
                });
                const yearlyAchieved = Array.from({ length: 12 }, (_, i) => {
                    const monthKey = `${year}-${String(i + 1).padStart(2, '0')}`;
                    const mBudget = data[monthKey]?.budget || [];
                    const mIncome = mBudget.filter(b => normalizeCategory(b.category, 'budget') === 'INCOME' && !isItemHidden(b, 'budget', data.meta)).reduce((a,b) => a + (evaluateFormula(b.amount) || 0), 0);
                    if (mIncome <= 0) return { month: i + 1, achieved: false, hasData: false };
                    const allAchieved = allocationPlan.every(plan => {
                        const targetAmt = mIncome * (plan.targetRatio / 100);
                        const actualAmt = plan.getActual(mBudget);
                        return plan.isLimit ? actualAmt <= targetAmt : actualAmt >= targetAmt;
                    });
                    return { month: i + 1, achieved: allAchieved, hasData: true };
                });
                return { income: annualIncome, items, yearlyAchieved, year, dataMonthCount };
            }, [date, data, savedTargets]);

            const content = (
                <div className="flex-1 flex flex-col min-h-0 w-full">
                    {/* 수입 합계 헤더 */}
                    <div className="flex items-center justify-between mb-3 px-1">
                        <div className="flex items-center gap-1.5">
                            <div className="w-1.5 h-4 rounded-full bg-emerald-400"></div>
                            <span className="text-xs font-bold text-slate-400">Annual Income ({stats.dataMonthCount}M)</span>
                        </div>
                        <span className="text-base font-black text-emerald-400 font-grotesk">{formatCurrency(stats.income)}</span>
                    </div>
                    {/* 배분 항목 */}
                    <div className="flex flex-col gap-2.5 flex-1">
                        {stats.items.map((item, idx) => (
                            <div key={idx} className={`rounded-xl border ${item.borderColor} ${item.bgColor} px-3 py-3 flex-1`}>
                                <div className="flex items-center justify-between mb-2">
                                    <div className="flex items-center gap-2">
                                        <div className="w-2 h-2 rounded-full flex-shrink-0" style={{ backgroundColor: item.color }}></div>
                                        <span className="text-xs font-bold text-slate-200">{item.label}</span>
                                        {/* 타겟 뱃지 - 클릭하면 인라인 편집 */}
                                        {editingLabel === item.label ? (
                                            <div className="flex items-center gap-1">
                                                <input
                                                    autoFocus
                                                    type="number"
                                                    min="0" max="100" step="1"
                                                    value={editValue}
                                                    onChange={e => setEditValue(e.target.value)}
                                                    onBlur={() => {
                                                        const v = parseFloat(editValue);
                                                        if (!isNaN(v)) updateTarget(item.label, v);
                                                        setEditingLabel(null);
                                                    }}
                                                    onKeyDown={e => {
                                                        if (e.key === 'Enter') { const v = parseFloat(editValue); if (!isNaN(v)) updateTarget(item.label, v); setEditingLabel(null); }
                                                        if (e.key === 'Escape') setEditingLabel(null);
                                                    }}
                                                    className="w-12 text-center text-[10px] font-bold bg-black/60 border border-cyan-500/50 rounded px-1 py-0.5 text-cyan-300 outline-none focus:ring-1 focus:ring-cyan-500/50"
                                                />
                                                <span className={`text-[9px] font-bold ${item.textColor}`}>%</span>
                                            </div>
                                        ) : (
                                            <button
                                                onClick={() => { setEditingLabel(item.label); setEditValue(String(item.targetRatio)); }}
                                                title="클릭해서 타겟 수정"
                                                className={`group/target flex items-center gap-0.5 text-[9px] font-bold px-1.5 py-0.5 rounded-full ${item.textColor} bg-white/5 border border-white/10 hover:border-cyan-500/40 hover:bg-cyan-500/10 transition-all cursor-pointer`}
                                            >
                                                Target {item.targetRatio}%
                                                <Icons.Pencil className="w-2.5 h-2.5 opacity-0 group-hover/target:opacity-70 transition-opacity ml-0.5" />
                                            </button>
                                        )}
                                    </div>
                                    <div className={`flex items-center gap-0.5 px-2 py-0.5 rounded-full text-[9px] font-bold ${item.achieved ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : (item.isLimit ? 'bg-rose-500/10 text-rose-400 border border-rose-500/20' : 'bg-white/5 text-slate-400 border border-white/10')}`}>
                                        {item.achieved ? (
                                            <><svg className="w-2.5 h-2.5 mr-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7"/></svg>Achieved</>
                                        ) : (
                                            <>{item.isLimit ? 'Over Limit' : 'In Progress'}</>
                                        )}
                                    </div>
                                </div>
                                <div className="flex items-center gap-1.5 mb-2">
                                    <div className="flex-1 bg-white/5 rounded-full h-1.5 overflow-hidden">
                                        <div className="h-full rounded-full transition-all duration-700" style={{ width: `${item.progress}%`, backgroundColor: item.color }}></div>
                                    </div>
                                    <span className="text-[9px] font-mono text-slate-400 w-8 text-right font-bold">{item.progress.toFixed(0)}%</span>
                                </div>
                                <div className="flex justify-between items-center">
                                    <div className="flex items-center gap-1.5">
                                        <span className="text-[10px] text-slate-500 font-medium">Target</span>
                                        <span className="text-xs font-extrabold text-slate-200 font-grotesk">{formatCurrency(item.targetAmt)}</span>
                                    </div>
                                    <div className="flex items-center gap-1.5">
                                        <span className="text-[10px] text-slate-500 font-medium">Actual</span>
                                        <span className={`text-xs font-extrabold font-grotesk ${item.achieved ? 'text-emerald-400' : item.textColor}`}>{formatCurrency(item.actualAmt)}</span>
                                        <span className="text-[9px] text-slate-400">({item.actualRatio.toFixed(1)}%)</span>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            return isWrapped ? content : (
                <GlassCard className="w-full p-5 h-full flex flex-col">
                    <div className="flex items-center justify-between mb-3">
                        <div className="flex items-center gap-2">
                            <div className="p-2 rounded-lg bg-sky-500/10 text-sky-400"><Icons.PieChart className="w-5 h-5" /></div>
                            <div><h4 className="text-sm font-bold text-slate-200">Asset Allocation Strategy</h4><p className="text-[10px] text-slate-500 font-medium">As of {date}</p></div>
                        </div>
                    </div>
                    {content}
                </GlassCard>
            );
        };
        const MonthlyAssetRatioCard = MonthlyAssetAllocationCard;


        const FinancialGoalCombinedCard = ({ year, data, loanGoal, investGoal, onGoalChange, isWrapped }) => {
            const loanStats = useMemo(() => {
                let totalIncome = 0, actualRepayment = 0;
                for (let m = 1; m <= 12; m++) {
                    const monthKey = `${year}-${String(m).padStart(2, '0')}`;
                    const monthData = data[monthKey];
                    if (monthData && monthData.budget) {
                        if ([3, 6, 9, 12].includes(m)) {
                            totalIncome += monthData.budget
                                .filter(b => normalizeCategory(b.category, 'budget') === 'INCOME' && !isItemHidden(b, 'budget', data.meta))
                                .reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
                        }
                        const repaymentItem = monthData.budget.find(b => ['대출상환', 'loanrepayment', 'loanrepay'].includes(b.name.replace(/\s/g, '').toLowerCase()) && !isItemHidden(b, 'budget', data.meta));
                        if (repaymentItem) actualRepayment += (Number(repaymentItem.amount) || 0);
                    }
                }
                return { required: totalIncome * (loanGoal / 100), actual: actualRepayment };
            }, [year, data, loanGoal]);

            const investStats = useMemo(() => {
                let totalIncome = 0, actualInvest = 0;
                for (let m = 1; m <= 12; m++) {
                    const monthKey = `${year}-${String(m).padStart(2, '0')}`;
                    const monthData = data[monthKey];
                    if (monthData && monthData.budget) {
                        totalIncome += monthData.budget
                            .filter(b => normalizeCategory(b.category, 'budget') === 'INCOME' && !isItemHidden(b, 'budget', data.meta))
                            .reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
                        actualInvest += monthData.budget
                            .filter(b => normalizeCategory(b.category, 'budget') === 'INVEST' && !isItemHidden(b, 'budget', data.meta))
                            .reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
                    }
                }
                return { target: totalIncome * (investGoal / 100), actual: actualInvest };
            }, [year, data, investGoal]);

            const loanProgress = loanStats.required > 0 ? Math.min((loanStats.actual / loanStats.required) * 100, 100) : 0;
            const investProgress = investStats.target > 0 ? Math.min((investStats.actual / investStats.target) * 100, 100) : 0;

            const content = (
                <div className="flex flex-col gap-6">
                    {!isWrapped && (
                        <div className="flex items-center gap-2 mb-2">
                            <div className="p-2 bg-indigo-500/10 rounded-lg text-indigo-400 border border-indigo-500/20"><Icons.Target className="w-5 h-5" /></div>
                            <h4 className="text-lg font-bold text-slate-200">{year} Key Financial Goals Status</h4>
                        </div>
                    )}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 sm:gap-10">
                        {/* Loan Repayment Section */}
                        <div className="space-y-3">
                            <div className="flex justify-between items-end">
                                <div>
                                    <span className="text-xs font-bold text-slate-500 uppercase tracking-widest font-grotesk">Loan Repayment Status</span>
                                    <h3 className={`text-2xl font-black mt-1 font-grotesk ${loanStats.actual >= loanStats.required ? 'text-emerald-400' : 'text-slate-300'}`}>{formatCurrency(loanStats.actual)}</h3>
                                </div>
                                <div className="flex items-center gap-2">
                                    <span className={`text-[10px] font-bold px-2.5 py-1 rounded-full ${loanStats.actual >= loanStats.required ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-white/5 text-slate-400 border border-white/10'}`}>
                                        {loanStats.actual >= loanStats.required ? 'Achieved' : 'In Progress'}
                                    </span>
                                    <button onClick={() => { const val = prompt("Loan Repayment Target Ratio (%)", loanGoal); if (val) onGoalChange('loan', Number(val)); }} className="p-1.5 text-slate-400 hover:text-cyan-400 transition-colors bg-white/5 border border-white/10 rounded-lg hover:bg-cyan-500/10"><Icons.Settings className="w-4 h-4"/></button>
                                </div>
                            </div>
                            <div className="w-full bg-white/5 rounded-full h-3 overflow-hidden">
                                <div className={`h-full transition-all duration-1000 ${loanStats.actual >= loanStats.required ? 'bg-emerald-500' : 'bg-indigo-500'}`} style={{ width: `${loanProgress}%` }}></div>
                            </div>
                            <div className="flex justify-between text-[10px] font-bold">
                                <span className="text-slate-500">Repayment Target {loanGoal}% of Bonus ({formatCurrency(loanStats.required)})</span>
                                <span className="text-slate-400">{loanProgress.toFixed(1)}%</span>
                            </div>
                        </div>

                        {/* Investment Section */}
                        <div className="space-y-3">
                            <div className="flex justify-between items-end">
                                <div>
                                    <span className="text-xs font-bold text-slate-500 uppercase tracking-widest font-grotesk">Cumulative Investment Status</span>
                                    <h3 className={`text-2xl font-black mt-1 font-grotesk ${investStats.actual >= investStats.target ? 'text-emerald-400' : 'text-slate-300'}`}>{formatCurrency(investStats.actual)}</h3>
                                </div>
                                <div className="flex items-center gap-2">
                                    <span className={`text-[10px] font-bold px-2.5 py-1 rounded-full ${investStats.actual >= investStats.target ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-white/5 text-slate-400 border border-white/10'}`}>
                                        {investStats.actual >= investStats.target ? 'Achieved' : 'In Progress'}
                                    </span>
                                    <button onClick={() => { const val = prompt("Investment Target Ratio (%)", investGoal); if (val) onGoalChange('invest', Number(val)); }} className="p-1.5 text-slate-400 hover:text-cyan-400 transition-colors bg-white/5 border border-white/10 rounded-lg hover:bg-cyan-500/10"><Icons.Settings className="w-4 h-4"/></button>
                                </div>
                            </div>
                            <div className="w-full bg-white/5 rounded-full h-3 overflow-hidden">
                                <div className={`h-full transition-all duration-1000 ${investStats.actual >= investStats.target ? 'bg-emerald-500' : 'bg-indigo-500'}`} style={{ width: `${investProgress}%` }}></div>
                            </div>
                            <div className="flex justify-between text-[10px] font-bold">
                                <span className="text-slate-500">Investment Target {investGoal}% of Income ({formatCurrency(investStats.target)})</span>
                                <span className="text-slate-400">{investProgress.toFixed(1)}%</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
            return isWrapped ? content : <GlassCard className="p-6">{content}</GlassCard>;
        };

        const NetWorthGoalCard = ({ netWorth, onGoalChange, targetAmount }) => {
            const progress = targetAmount > 0 ? Math.min((netWorth / targetAmount) * 100, 100) : 0;
            const isSuccess = netWorth >= targetAmount;
            return (
                <GlassCard className="p-5 h-full flex flex-col justify-center relative">
                    <div className="flex items-center justify-between mb-4"><div className="flex items-center gap-2"><div className={`p-2 rounded-lg ${isSuccess ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-[#0f1026] text-cyan-400 border border-cyan-500/20'}`}><Icons.Flag className="w-5 h-5" /></div><div><h4 className="text-sm font-bold text-slate-200">Net Worth Target (FIRE)</h4></div></div><button onClick={() => { const newGoal = prompt("Enter target net worth (KRW):", targetAmount); if (newGoal !== null && !isNaN(newGoal)) onGoalChange(Number(newGoal)); }} className="text-slate-400 hover:text-cyan-400"><Icons.Settings className="w-4 h-4" /></button></div>
                    <div className="w-full bg-white/5 rounded-full h-2.5 mb-4 overflow-hidden"><div className={`h-2.5 rounded-full transition-all duration-1000 ${isSuccess ? 'bg-emerald-500' : 'bg-cyan-500'}`} style={{ width: `${progress}%` }}></div></div>
                    <div className="flex justify-between items-center text-xs mt-auto"><div className="flex flex-col"><span className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Progress</span><span className="font-bold text-slate-300 font-grotesk">{progress.toFixed(1)}%</span></div><div className="flex flex-col items-end"><span className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Target</span><span className="font-bold text-cyan-400 font-grotesk">{formatCurrency(targetAmount)}</span></div></div>
                </GlassCard>
            );
        };

        const YearlyRatioCard = ({ year, data, isWrapped }) => {
            const [activeItem, setActiveIndex] = useState(null);
            const stats = useMemo(() => {
                let totalIncome = 0, totalExpense = 0, totalSaving = 0, totalInvest = 0;
                const months = Object.keys(data).filter(k => k.startsWith(year));
                months.forEach(m => {
                    const budget = data[m]?.budget || [];
                    totalIncome += budget.filter(b => normalizeCategory(b.category, 'budget') === 'INCOME' && !isItemHidden(b, 'budget', data.meta)).reduce((a,b) => a + (Number(b.amount) || 0), 0);
                    totalExpense += budget.filter(b => normalizeCategory(b.category, 'budget') === 'EXPENSE' && !isItemHidden(b, 'budget', data.meta)).reduce((a,b) => a + (Number(b.amount) || 0), 0);
                    totalSaving += budget.filter(b => normalizeCategory(b.category, 'budget') === 'SAVING' && !isItemHidden(b, 'budget', data.meta)).reduce((a,b) => a + (Number(b.amount) || 0), 0);
                    totalInvest += budget.filter(b => normalizeCategory(b.category, 'budget') === 'INVEST' && !isItemHidden(b, 'budget', data.meta)).reduce((a,b) => a + (Number(b.amount) || 0), 0);
                });
                return { totalIncome, totalExpense, totalSaving, totalInvest };
            }, [year, data]);
            const getPercent = (val) => stats.totalIncome > 0 ? (val / stats.totalIncome) * 100 : 0;
            const items = [ { label: 'Expenses', value: stats.totalExpense, color: '#fb7185', percent: getPercent(stats.totalExpense) }, { label: 'Savings', value: stats.totalSaving, color: '#34d399', percent: getPercent(stats.totalSaving) }, { label: 'Investment', value: stats.totalInvest, color: '#818cf8', percent: getPercent(stats.totalInvest) } ];
            const content = (
                <div className="flex-1 flex items-center gap-2 min-h-0 w-full h-full p-2">
                    <div className="w-2/5 h-full relative"><ResponsiveContainer width="100%" height="100%"><PieChart><Pie data={items} cx="50%" cy="50%" innerRadius="60%" outerRadius="90%" paddingAngle={2} dataKey="value" cornerRadius={3} onMouseEnter={(_, index) => setActiveIndex(index)} onMouseLeave={() => setActiveIndex(null)} activeIndex={activeItem === null ? -1 : activeItem} activeShape={renderActiveShape}>{items.map((entry, index) => (<Cell key={`cell-${index}`} fill={entry.color} stroke="none" />))}</Pie></PieChart></ResponsiveContainer></div>
                    <div className="w-3/5 h-full flex flex-col justify-center pr-1 overflow-y-auto custom-scrollbar"><div className="space-y-1">{items.map((entry, index) => (<div key={index} className={`flex justify-between items-center text-[10px] p-1 rounded transition-colors ${activeItem === index ? 'bg-white/5' : ''}`} onMouseEnter={() => setActiveIndex(index)} onMouseLeave={() => setActiveIndex(null)}><div className="flex items-center gap-1.5 overflow-hidden"><div className="w-2 h-2 rounded-full flex-shrink-0" style={{ backgroundColor: entry.color }}></div><span className="font-bold text-slate-400 truncate" title={entry.label}>{entry.label}</span></div><div className="flex items-center gap-2 flex-shrink-0"><span className="font-bold text-slate-300 font-grotesk">{formatCurrency(entry.value)}</span><span className="text-slate-500 font-mono w-10 text-right font-grotesk">{entry.percent.toFixed(1)}%</span></div></div>))}</div></div>
                </div>
            );
            return isWrapped ? content : (
                <GlassCard className="w-full p-5 h-full flex flex-col">
                    <div className="flex items-center justify-between mb-2"><div className="flex items-center gap-2"><div className="p-2 rounded-lg bg-indigo-500/10 text-indigo-400 border border-indigo-500/20"><Icons.PieChart className="w-5 h-5" /></div><div><h4 className="text-sm font-bold text-slate-200">{year} Cumulative Ratio</h4><p className="text-[10px] text-slate-500 font-medium">Annual Total</p></div></div></div>
                    {content}
                </GlassCard>
            );
        };

                const Dashboard = ({ data = {}, onUpdate, viewDate: viewDateProp, setViewDate: setViewDateProp }) => {
            const safeData = data || {};
            const allMonths = Object.keys(safeData).filter(isMonthKey).sort();
            const [viewDateLocal, setViewDateLocal] = useState(() => {
                const today = new Date();
                const key = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
                return allMonths.includes(key) ? key : (allMonths[allMonths.length - 1] || '2024-01');
            });
            const viewDate = viewDateProp !== undefined ? viewDateProp : viewDateLocal;
            const setViewDate = setViewDateProp !== undefined ? setViewDateProp : setViewDateLocal;
            const viewYear = viewDate.split('-')[0];
            const todayStr = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            const currentData = safeData[viewDate] || { assets: [], loans: [], budget: [], stockProfit: [] };
            const prevYearDate = getPreviousMonth(viewDate);
            const prevYearData = safeData[prevYearDate] || null;
            
            // Lifetime Earnings Calculations
            const salaryData = useMemo(() => {
                return safeData.salary || { 
                    years: Array.from({length: 12}, (_, i) => String(2014 + i)),

            const salaryYears = salaryData.years || [];

            }, [salaryYears, salaryData.items]);
            
            const salaryItemTotals = useMemo(() => {
                return salaryData.items.map(item => ({ 
                    id: item.id, 
                    name: item.name, 
                    total: Object.values(item.values).reduce((acc, val) => acc + (Number(val) || 0), 0) 
                }));
            }, [salaryData.items]);
            
            const salaryGrandTotal = useMemo(() => {
                return salaryItemTotals.reduce((acc, curr) => acc + curr.total, 0);

            const getSalaryLevel = (total) => {
                if (total > 2000000000) return { label: 'Generational Wealth Owner', color: 'text-amber-400', emoji: '🏰' };
                if (total > 1000000000) return { label: 'Rising Capitalist', color: 'text-emerald-400', emoji: '🏙️' };

                if (total > 100000000) return { label: 'Diligent Ant', color: 'text-blue-400', emoji: '🐜' };

            const liabilitiesExclJeonse = (currentData.loans || []).filter(l => normalizeCategory(l.category, 'loans') !== 'LEASE' && !isItemHidden(l, 'loans', safeData.meta)).reduce((acc, cur) => acc + (evaluateFormula(cur.amount) || 0), 0) + reStats.ownedDebt;

            const netWorth = totalAssets - liabilitiesExclJeonse;
            const prevNetWorth = prevTotalAssets - prevLiabilities;
            const calcYoY = (curr, prev) => (prev && prev !== 0) ? ((curr - prev) / prev) * 100 : 0;

            const liquidAssets = (currentData.assets || []).filter(a => normalizeCategory(a.category, 'assets') === 'SAVINGS' && !isItemHidden(a, 'assets', safeData.meta)).reduce((acc, cur) => acc + (evaluateFormula(cur.value) || 0), 0);

            const totalIncome = (currentData.budget || []).filter(b => normalizeCategory(b.category, 'budget') === 'INCOME' && !isItemHidden(b, 'budget', data.meta)).reduce((a,b) => a + (evaluateFormula(b.amount) || 0), 0);

            const cashFlowData = recentMonths.map(month => {
                const d = safeData[month];
                const income = (d?.budget || []).filter(b => normalizeCategory(b.category, 'budget') === 'INCOME' && !isItemHidden(b, 'budget', safeData.meta)).reduce((a,b)=>a+(evaluateFormula(b.amount) || 0), 0);
                const expense = (d?.budget || []).filter(b => normalizeCategory(b.category, 'budget') === 'EXPENSE' && !isItemHidden(b, 'budget', safeData.meta)).reduce((a,b)=>a+(evaluateFormula(b.amount) || 0), 0);
                const saving = (d?.budget || []).filter(b => normalizeCategory(b.category, 'budget') === 'SAVING' && !isItemHidden(b, 'budget', safeData.meta)).reduce((a,b)=>a+(evaluateFormula(b.amount) || 0), 0);
                const invest = (d?.budget || []).filter(b => normalizeCategory(b.category, 'budget') === 'INVEST' && !isItemHidden(b, 'budget', safeData.meta)).reduce((a,b)=>a+(evaluateFormula(b.amount) || 0), 0);
                
                return {
                    name: month,
                    income: income,
                    expenses: expense,
                    savings: saving,
                    investment: invest,
                    savingsRate: income > 0 ? parseFloat(((income - expense) / income * 100).toFixed(1)) : 0,
                    investmentShare: income > 0 ? parseFloat((invest / income * 100).toFixed(1)) : 0
                };

            const portfolioData = Object.keys(ASSET_CATEGORIES).map(catKey => {
                const categoryItems = (currentData.assets || []).filter(a => normalizeCategory(a.category, 'assets') === catKey && !isItemHidden(a, 'assets', safeData.meta));
                let val = categoryItems.reduce((a,b)=>a+(evaluateFormula(b.value) || 0), 0);
                if (catKey === 'REAL_ESTATE') val += reStats.totalValue;
                return { name: ASSET_CATEGORIES[catKey].label, value: val, color: ASSET_CATEGORIES[catKey].color };

            const currentLoans = (currentData.loans || []).filter(l => !isItemHidden(l, 'loans', safeData.meta));

            const allLoanNamesSet = new Set();
            recentMonths.forEach(month => {
                const loans = (safeData[month]?.loans || []).filter(l => !isItemHidden(l, 'loans', safeData.meta));

                    if (l.name) allLoanNamesSet.add(l.name);

            const allLoanNames = Array.from(allLoanNamesSet);
            const loanColors = ['#ec4899', '#8b5cf6', '#06b6d4', '#10b981', '#f59e0b', '#ef4444', '#3b82f6', '#14b8a6', '#f43f5e', '#84cc16'];
            const loanColorMap = {};
            allLoanNames.forEach((name, i) => loanColorMap[name] = loanColors[i % loanColors.length]);

            const loanPieData = currentLoans.map((l, i) => ({
                name: l.name || 'Unknown',
                value: evaluateFormula(l.amount) || 0,
                color: loanColorMap[l.name] || loanColors[i % loanColors.length]
            })).filter(l => l.value > 0).sort((a,b) => b.value - a.value);

            const loanTrendData = recentMonths.map(month => {
                const d = safeData[month];
                const loans = (d?.loans || []).filter(l => !isItemHidden(l, 'loans', safeData.meta));
                const dataPoint = { name: month };
                allLoanNames.forEach(name => dataPoint[name] = 0);
                loans.forEach(l => {
                    if (l.name) {
                        dataPoint[l.name] += evaluateFormula(l.amount) || 0;
                    }

                return dataPoint;
            });

            const [activeItem, setActiveIndex] = useState(null); 
            const updateGoal = (type, value) => {
                const newData = JSON.parse(JSON.stringify(safeData));
                if (!newData.meta) newData.meta = {};
                if (!newData.meta.goals) newData.meta.goals = { loan: 30, invest: 30, netWorth: 1000000000 };
                newData.meta.goals[type] = value;
                onUpdate(newData);

            const loanGoal = safeData.meta?.goals?.loan || 30;
            const investGoal = safeData.meta?.goals?.invest || 30;
            const netWorthGoal = safeData.meta?.goals?.netWorth || 1000000000;
            const handleMonthChange = (direction) => {

            const renderScoreCard = (id) => {

                                            Liquid assets (savings) divided by monthly expenses. Recommended to be 6+ months.

            const [viewMode, setViewMode] = useState('year');
            const months = useMemo(() => Object.keys(data).filter(isMonthKey).sort(), [data]);
            const years = useMemo(() => [...new Set(months.map(m => m.substring(0, 4)))], [months]);
            const [selectedYear, setSelectedYear] = useState(years[years.length - 1] || new Date().getFullYear().toString());
            const [selectedMonth, setSelectedMonth] = useState(months[months.length - 1] || '');

            useEffect(() => {
                if (!years.includes(selectedYear) && years.length > 0) setSelectedYear(years[years.length - 1]);
                if (!months.includes(selectedMonth) && months.length > 0) setSelectedMonth(months[months.length - 1]);
            }, [years, months, selectedYear, selectedMonth]);

                                            <th className="sticky-c3-hdr p-2 text-center font-bold text-xs text-[var(--ss-hdr-text)] border-r-2 border-[var(--ss-hdr-border-strong)] overflow-hidden" style={{ left: colWidths.c1 + colWidths.c2, width: colWidths.c3, minWidth: colWidths.c3, maxWidth: colWidths.c3 }}>Item Name<div className="absolute right-0 top-0 w-1.5 h-full cursor-col-resize hover:bg-cyan-400 z-50 opacity-50" onMouseDown={(e) => setResizing({ col: 'c3', startX: e.clientX, startW: colWidths.c3 })}/></th>

                                        <th className="sticky-col-header p-2 text-left pl-3 font-bold text-xs text-[var(--ss-hdr-text)]" style={{ left: 0, width: colWidths.c1 + colWidths.c2 + colWidths.c3, minWidth: colWidths.c1 + colWidths.c2 + colWidths.c3, maxWidth: colWidths.c1 + colWidths.c2 + colWidths.c3 }}>Item Name</th>
                                    )}
                                    {visibleMonths.map(m => (
                                        <th key={m} className={`p-0 border-r border-[var(--ss-hdr-border)] font-bold text-center text-[var(--ss-hdr-text)] group/th relative border-b-2 border-b-[var(--ss-hdr-border-strong)] ${hiddenMonths.has(m) ? 'opacity-50' : ''}`} style={{ background: 'var(--ss-hdr-bg)', minWidth: '102px', maxWidth: '102px', width: '102px' }}>
                                            <div className="flex flex-col items-center justify-center py-2 px-2">
                                                <span className="text-[9px] text-slate-500 font-medium tracking-widest uppercase font-grotesk">{m.split('-')[0]}</span>
                                                <div className="flex items-center gap-1">
                                                    <span className="text-xs font-bold text-slate-300 font-grotesk">{MONTH_NAMES[parseInt(m.split('-')[1]) - 1]}</span>
                                                    <button onClick={(e) => { e.stopPropagation(); toggleHideMonth(m); }} className={`p-0.5 transition-colors ${hiddenMonths.has(m) ? 'text-emerald-400' : 'text-slate-500 hover:text-cyan-400'}`} title={hiddenMonths.has(m) ? "Show Column" : "Hide Column"}>
                                                        {hiddenMonths.has(m) ? <Icons.Eye className="w-3 h-3"/> : <Icons.EyeOff className="w-3 h-3"/>}
                                                    </button>
                                                </div>
                                                <button onClick={(e) => { e.stopPropagation(); handleDeleteMonth(m); }} className="opacity-0 group-hover/th:opacity-100 p-0.5 text-slate-400 hover:text-rose-400 transition-all absolute top-0.5 right-0.5" title="Delete Column"><Icons.X className="w-2.5 h-2.5"/></button>

                                        </th>
                                    ))}
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-[var(--ss-cell-border)]">
                            {(hasCategory ? Object.keys(categories) : ['ALL']).map(catKey => {
                                const items = orderedItems[catKey] || [];
                                const visibleItems = items.filter(i => showHidden || !hiddenItems.has(i.itemKey || i.name));
                                if (hasCategory && visibleItems.length === 0) return null;
                                return (
                                    <React.Fragment key={catKey}>
                                        {visibleItems.map((item, idx) => {
                                            const iKey = item.itemKey || item.name;
                                            const isEditing = editingItemOption?.oldName === item.name && editingItemOption?.oldCat1 === (item.category || catKey) && editingItemOption?.oldCat2 === (item.category2 || '');
                                            const isFirstCat1 = isEditing || idx === 0;
                                            const isFirstCat2 = isEditing || idx === 0 || (idx > 0 && visibleItems[idx - 1].category2 !== item.category2);
                                            return (
                                                <tr key={iKey} className={`${idx % 2 === 0 ? 'bg-[var(--ss-cell-bg)]' : 'bg-[var(--ss-cell-bg-alt)]'} hover:bg-cyan-500/5 transition-colors group/row`}>
                                                    {hasCategory ? (
                                                        <>
                                                            <td className="sticky-c1 p-2 text-center text-xs font-bold text-slate-300 overflow-hidden" style={{ left: 0, width: colWidths.c1, minWidth: colWidths.c1, maxWidth: colWidths.c1 }}>
                                                                {isEditing ? (
                                                                    <select className="w-full bg-slate-900 border border-white/10 text-white rounded focus:outline-none p-0.5 focus:border-cyan-400" value={editingItemOption.cat1} onChange={(e) => setEditingItemOption({...editingItemOption, cat1: e.target.value})}>
                                                                        {Object.entries(categories).map(([k, v]) => (<option key={k} value={k}>{v.label}</option>))}
                                                                    </select>
                                                                ) : (
                                                                    <span className={`block truncate w-full cursor-pointer hover:text-cyan-400 transition-colors ${!isFirstCat1 ? 'opacity-0' : ''}`} 
                                                                          onClick={() => setEditingItemOption({ oldName: item.name, newName: item.name, cat1: item.category || catKey, cat2: item.category2 || '', oldCat1: item.category || catKey, oldCat2: item.category2 || '' })}>
                                                                        {categories[catKey].label}
                                                                    </span>
                                                                )}
                                                            </td>
                                                            <td className="sticky-c2 p-2 text-center text-xs font-medium text-slate-400 overflow-hidden" style={{ left: colWidths.c1, width: colWidths.c2, minWidth: colWidths.c2, maxWidth: colWidths.c2 }}>
                                                                {isEditing ? (
                                                                    <input type="text" className="w-full bg-slate-900 border border-white/10 text-white rounded focus:outline-none p-0.5 text-center focus:border-cyan-400" value={editingItemOption.cat2} onChange={(e) => setEditingItemOption({...editingItemOption, cat2: e.target.value})} onKeyDown={(e) => e.key === 'Enter' && handleSaveRowEdit()} />
                                                                ) : (
                                                                    <span className={`block truncate w-full cursor-pointer hover:text-cyan-400 transition-colors min-h-[1.25rem] ${!isFirstCat2 ? 'opacity-0' : ''}`} 
                                                                          onClick={() => setEditingItemOption({ oldName: item.name, newName: item.name, cat1: item.category || catKey, cat2: item.category2 || '', oldCat1: item.category || catKey, oldCat2: item.category2 || '' })}>
                                                                        {item.category2 || '-'}
                                                                    </span>
                                                                )}
                                                            </td>
                                                            <td className="sticky-c3 p-2 overflow-hidden" style={{ left: colWidths.c1 + colWidths.c2, width: colWidths.c3, minWidth: colWidths.c3, maxWidth: colWidths.c3 }}>
                                                                {isEditing ? (
                                                                    <div className="flex items-center justify-between">
                                                                        <input type="text" autoFocus className="w-full bg-slate-900 border border-white/10 text-white rounded focus:outline-none p-0.5 text-xs focus:border-cyan-400" value={editingItemOption.newName} onChange={(e) => setEditingItemOption({...editingItemOption, newName: e.target.value})} onKeyDown={(e) => e.key === 'Enter' && handleSaveRowEdit()} />

                                                                            <button onClick={handleSaveRowEdit} className="p-1 text-emerald-400 hover:bg-emerald-500/20 rounded"><Icons.Check className="w-3 h-3"/></button>

                                                                            <button onClick={() => handleDeleteRow(iKey, item.name)} className="p-1 text-slate-500 hover:text-rose-400"><Icons.Trash2 className="w-3.5 h-3.5"/></button>
                                                                        </div>
                                                                    </div>

                                                                <div className="flex items-center justify-between">
                                                                    <input type="text" autoFocus className="w-full bg-slate-900 border border-white/10 text-white rounded focus:outline-none p-0.5 text-xs focus:border-cyan-400" value={editingItemOption.newName} onChange={(e) => setEditingItemOption({...editingItemOption, newName: e.target.value})} onKeyDown={(e) => e.key === 'Enter' && handleSaveRowEdit()} />
                                                                    <div className="flex items-center gap-0.5 ml-1">
                                                                        <button onClick={handleSaveRowEdit} className="p-1 text-emerald-400 hover:bg-emerald-500/20 rounded"><Icons.Check className="w-3 h-3"/></button>
                                                                        <button onClick={() => setEditingItemOption(null)} className="p-1 text-slate-400 hover:bg-white/10 rounded"><Icons.X className="w-3 h-3"/></button>
                                                                    </div>
                                                                </div>
                                                            ) : (
                                                                <div className="flex items-center justify-between group">
                                                                    <div className="flex items-center gap-2 overflow-hidden w-full">
                                                                        <button onClick={() => toggleHide(iKey)} className="text-slate-500 hover:text-cyan-400 transition-colors shrink-0">
                                                                            {hiddenItems.has(iKey) ? <Icons.EyeOff className="w-3.5 h-3.5" /> : <Icons.Eye className="w-3.5 h-3.5" />}
                                                                        </button>
                                                                        <span className={`text-xs font-bold truncate ${hiddenItems.has(iKey) ? 'text-slate-500 line-through' : 'text-slate-300'}`} title={item.name}>{item.name}</span>
                                                                    </div>
                                                                    <div className="flex items-center opacity-0 group-hover:opacity-100 transition-all shrink-0">
                                                                        <button onClick={() => setEditingItemOption({ oldName: item.name, newName: item.name, cat1: item.category || 'ALL', cat2: '', oldCat1: item.category || 'ALL', oldCat2: '' })} className="p-1 text-slate-500 hover:text-cyan-400"><Icons.Edit2 className="w-3.5 h-3.5"/></button>
                                                                        <button onClick={() => handleDeleteRow(iKey, item.name)} className="p-1 text-slate-500 hover:text-rose-400"><Icons.Trash2 className="w-3.5 h-3.5"/></button>
                                                                    </div>
                                                                </div>
                                                            )}
                                                        </td>
                                                    )}
                                                    {visibleMonths.map(month => {
                                                        const found = (safeData[month][listKey] || []).find(i => {
                                                            if (!hasCategory) {
                                                                return i.name === item.name;
                                                            }
                                                            const iCat = categories[i.category] ? i.category : Object.keys(categories)[0];
                                                            const iCat2 = i.category2 || '';
                                                            return i.name === item.name && iCat === (item.category || catKey) && iCat2 === (item.category2 || '');
                                                        });
                                                        if (type === 'stockProfit') {
                                                            const isCatDividend = (item.category === 'DIVIDEND');
                                                            const fieldKey = isCatDividend ? 'dividend' : 'profit';
                                                            const val = found ? (found[fieldKey] || 0) : 0;
                                                            return (
                                                                <td key={month} className="p-0 border-r border-[var(--ss-cell-border)]" style={{ minWidth: '102px', maxWidth: '102px', width: '102px' }}>
                                                                    <CurrencyInput value={val} onChange={(v) => handleCellChange(month, item.name, fieldKey, v, item.category, item.category2)} className={`w-full h-full p-2 text-right bg-transparent focus:bg-cyan-500/10 focus:outline-none focus:ring-inset focus:ring-2 focus:ring-cyan-500/20 text-xs font-mono hover:bg-white/5 transition-colors ${val < 0 ? 'text-cyan-400 font-bold' : val > 0 ? (isCatDividend ? 'text-emerald-400 font-bold' : 'text-fuchsia-400 font-bold') : 'text-slate-600'}`} />
                                                                </td>
                                                            );
                                                        } else {
                                                            const val = found ? (found.value ?? found.amount ?? 0) : 0;
                                                            const fieldName = type === 'assets' ? 'value' : 'amount';
                                                            return (
                                                                <td key={month} className="p-0 border-r border-[var(--ss-cell-border)]" style={{ minWidth: '102px', maxWidth: '102px', width: '102px' }}><CurrencyInput value={val} onChange={(v) => handleCellChange(month, item.name, fieldName, v, item.category, item.category2)} className="w-full h-full p-2 text-right bg-transparent focus:bg-cyan-500/10 focus:outline-none focus:ring-inset focus:ring-2 focus:ring-cyan-500/20 text-xs font-mono text-slate-200 hover:bg-white/5 transition-colors"/></td>
                                                            );
                                                        }
                                                    })}
                                                </tr>
                                            );
                                        })}
                                        {hasCategory && (
                                            <tr style={{ background: 'var(--ss-sum-bg)' }} className="font-bold text-cyan-400 border-t border-[var(--ss-sum-border)]">
                                                <td className="sticky-c-sum p-2 text-right text-xs text-cyan-400 font-grotesk" colSpan={3} style={{ left: 0, paddingRight: '0.75rem' }}>{categories[catKey].label} Total</td>
                                                {visibleMonths.map(month => {
                                                    const sum = visibleItems.reduce((acc, item) => { 
                                                        const found = (safeData[month][listKey] || []).find(i => {
                                                            const iCat = (hasCategory && categories[i.category]) ? i.category : (hasCategory ? Object.keys(categories)[0] : 'ALL');
                                                            const iCat2 = i.category2 || '';
                                                            const itemCat = (hasCategory && categories[item.category]) ? item.category : (hasCategory ? Object.keys(categories)[0] : 'ALL');
                                                            const itemCat2 = item.category2 || '';
                                                            return i.name === item.name && iCat === itemCat && iCat2 === itemCat2;
                                                        }); 
                                                        let val = 0;
                                                        if (found) {
                                                            if (type === 'stockProfit') {
                                                                val = item.category === 'DIVIDEND' ? (evaluateFormula(found.dividend) || 0) : (evaluateFormula(found.profit) || 0);
                                                            } else {
                                                                val = found.value ?? found.amount ?? 0;
                                                            }
                                                        }
                                                        return acc + (typeof val === 'number' ? val : evaluateFormula(val)); 
                                                    }, 0);
                                                    return (<td key={month} className="p-2 text-right border-r border-[var(--ss-hdr-border)] text-xs font-bold text-cyan-400 font-grotesk" style={{ background: 'var(--ss-sum-bg)', minWidth: '102px', maxWidth: '102px', width: '102px' }}>{formatCurrency(sum)}</td>);
                                                })}
                                            </tr>
                                        )}
                                    </React.Fragment>
                                );
                            })}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const OWNERSHIP_TYPES = {
            OWN: { label: 'Owned', color: 'bg-cyan-500', text: 'text-cyan-400', light: 'bg-cyan-500/10' },
            JEONSE: { label: 'Jeonse', color: 'bg-emerald-500', text: 'text-emerald-400', light: 'bg-emerald-500/10' },
            RENT: { label: 'Rent', color: 'bg-amber-500', text: 'text-amber-400', light: 'bg-amber-500/10' }
        };

        const RealEstateSheet = ({ data, onUpdate }) => {
            const realEstate = data.realEstate || [];
            const [newItem, setNewItem] = useState({ name: '', category: 'APARTMENT', ownershipType: 'OWN', purchaseDate: '', purchasePrice: 0, currentValue: 0, loan: 0, deposit: 0, monthlyRent: 0 });

            const stats = useMemo(() => {
                const totalValue = realEstate.reduce((acc, item) => acc + (Number(item.currentValue) || 0), 0);
                const totalLoanDeposit = realEstate.reduce((acc, item) => acc + (Number(item.loan) || 0) + (Number(item.deposit) || 0), 0);
                const totalRent = realEstate.reduce((acc, item) => acc + (Number(item.monthlyRent) || 0), 0);
                return { totalValue, netWorth: totalValue - totalLoanDeposit, totalRent, count: realEstate.length };
            }, [realEstate]);

            const handleAddItem = () => {
                if (!newItem.name) return;
                const newData = JSON.parse(JSON.stringify(data));
                if (!newData.realEstate) newData.realEstate = [];
                newData.realEstate.push({ ...newItem, id: Date.now() });
                onUpdate(newData);
                setNewItem({ name: '', category: 'APARTMENT', ownershipType: 'OWN', purchaseDate: '', purchasePrice: 0, currentValue: 0, loan: 0, deposit: 0, monthlyRent: 0 });
            };

            const handleUpdateItem = (id, field, value) => {
                const newData = JSON.parse(JSON.stringify(data));
                const item = newData.realEstate.find(i => i.id === id);
                if (item) {
                    item[field] = value;
                    onUpdate(newData);
                }
            };

            const handleDeleteItem = (id) => {
                if (!confirm("Are you sure you want to delete this property?")) return;
                const newData = JSON.parse(JSON.stringify(data));
                newData.realEstate = newData.realEstate.filter(i => i.id !== id);
                onUpdate(newData);
            };

            return (
                <div className="space-y-6 animate-fade-in">
                    {/* Summary Header */}
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <GlassCard className="p-5 border-l-4 border-cyan-500">
                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Total Property Value</span>
                            <h3 className="text-2xl font-black text-white mt-1 font-grotesk">{formatCurrency(stats.totalValue)}</h3>
                        </GlassCard>
                        <GlassCard className="p-5 border-l-4 border-emerald-500">
                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Real Estate Net Worth</span>
                            <h3 className="text-2xl font-black text-emerald-400 mt-1 font-grotesk">{formatCurrency(stats.netWorth)}</h3>
                        </GlassCard>
                        <GlassCard className="p-5 border-l-4 border-rose-500">
                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Total Loans & Deposits</span>
                            <h3 className="text-2xl font-black text-rose-400 mt-1 font-grotesk">{formatCurrency(stats.totalValue - stats.netWorth)}</h3>
                        </GlassCard>
                        <GlassCard className="p-5 border-l-4 border-amber-500">
                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Total Monthly Rent</span>
                            <h3 className="text-2xl font-black text-amber-400 mt-1 font-grotesk">{formatCurrency(stats.totalRent)}</h3>
                        </GlassCard>
                    </div>

                    {/* Input Form */}
                    <CollapsibleCard title="Register New Property" icon={Icons.Plus} initialOpen={false}>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-2">
                            <div className="space-y-1">
                                <label className="text-[10px] font-bold text-slate-400 ml-1">Property Name</label>
                                <input type="text" placeholder="e.g. Raemian 84A" className="w-full p-2.5 bg-black/30 border border-white/10 rounded-xl text-sm text-white focus:ring-2 focus:ring-cyan-500/20 outline-none focus:border-cyan-500/30" value={newItem.name} onChange={e => setNewItem({...newItem, name: e.target.value})} />
                            </div>
                            <div className="space-y-1">
                                <label className="text-[10px] font-bold text-slate-400 ml-1">Property Type</label>
                                <select className="w-full p-2.5 bg-slate-900 border border-white/10 rounded-xl text-sm text-slate-300 outline-none focus:border-cyan-500/30" value={newItem.category} onChange={e => setNewItem({...newItem, category: e.target.value})}>
                                    {Object.entries(REAL_ESTATE_CATEGORIES).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
                                </select>
                            </div>
                            <div className="space-y-1">
                                <label className="text-[10px] font-bold text-slate-400 ml-1">Ownership Type</label>
                                <div className="flex bg-black/30 p-1 rounded-xl gap-1 border border-white/10">
                                    {Object.entries(OWNERSHIP_TYPES).map(([k, v]) => (
                                        <button 
                                            key={k}
                                            onClick={() => setNewItem({...newItem, ownershipType: k})}
                                            className={`flex-1 py-1.5 rounded-lg text-[10px] font-bold transition-all ${newItem.ownershipType === k ? 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/30' : 'text-slate-400 hover:text-slate-300'}`}
                                        >
                                            {v.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            <div className="space-y-1">
                                <label className="text-[10px] font-bold text-slate-400 ml-1">Purchase Date</label>
                                <input type="text" placeholder="YYYY-MM-DD" className="w-full p-2.5 bg-black/30 border border-white/10 rounded-xl text-sm text-white outline-none focus:border-cyan-500/30" value={newItem.purchaseDate} onChange={e => setNewItem({...newItem, purchaseDate: e.target.value})} />
                            </div>
                            <div className="space-y-1">
                                <label className="text-[10px] font-bold text-slate-400 ml-1">{newItem.ownershipType === 'OWN' ? 'Purchase Price' : 'Deposit Amount'}</label>
                                <CurrencyInput value={newItem.purchasePrice} onChange={v => setNewItem({...newItem, purchasePrice: v})} className="w-full p-2.5 bg-black/30 border border-white/10 rounded-xl text-sm text-white focus:border-cyan-500/30" />
                            </div>
                            <div className="space-y-1">
                                <label className="text-[10px] font-bold text-slate-400 ml-1">Current Value</label>
                                <CurrencyInput value={newItem.currentValue} onChange={v => setNewItem({...newItem, currentValue: v})} className="w-full p-2.5 bg-black/30 border border-white/10 rounded-xl text-sm text-white focus:border-cyan-500/30" />
                            </div>

                const SyncModal = ({ isOpen, onClose, currentId, onSyncIdChange }) => {

        const SliderInput = ({ label, value, min, max, step = 1, unit = '', onChange, formatter = (v) => v }) => (
            <div className="space-y-2">

        const LoanCalculator = () => {
            const [purchasePrice, setPurchasePrice] = useState(500000000);
            const [equityRatio, setEquityRatio] = useState(30);
            const [rate, setRate] = useState(3.5);
            const [term, setTerm] = useState(30); // years
            const [gracePeriod, setGracePeriod] = useState(0); // years
            const [type, setType] = useState('level'); // level, principal, maturity

            const loanAmount = useMemo(() => purchasePrice * (1 - equityRatio / 100), [purchasePrice, equityRatio]);

            const results = useMemo(() => {
                const L = loanAmount;
                const r = rate / 100 / 12;
                const n = term * 12;
                const g = gracePeriod * 12;
                
                let monthlyPayment = 0;
                let totalInterest = 0;
                const yearlyData = [];

                if (r === 0) {
                    const mp = L / (n - g);
                    return { monthlyPayment: mp, totalInterest: 0, totalPayment: L, yearlyData: [] };
                }

                let currentBalance = L;
                let cumulativeInterest = 0;

                for (let year = 1; year <= term; year++) {
                    let yearPrincipal = 0;
                    let yearInterest = 0;

                    for (let month = 1; month <= 12; month++) {
                        const currentMonth = (year - 1) * 12 + month;
                        let mInterest = currentBalance * r;
                        let mPrincipal = 0;

                        if (currentMonth <= g) {
                            mPrincipal = 0;
                        } else {
                            if (type === 'level') {
                                const remainingMonths = n - g;
                                const mp = L * r * Math.pow(1 + r, remainingMonths) / (Math.pow(1 + r, remainingMonths) - 1);
                                monthlyPayment = mp;
                                mPrincipal = mp - mInterest;
                            } else if (type === 'principal') {
                                mPrincipal = L / (n - g);
                                monthlyPayment = mPrincipal + mInterest;
                            } else if (type === 'maturity') {
                                mPrincipal = 0;
                                monthlyPayment = mInterest;
                            }
                        }

                        if (type === 'maturity' && currentMonth === n) {
                            mPrincipal = L;
                        }

                        yearPrincipal += mPrincipal;
                        yearInterest += mInterest;
                        currentBalance -= mPrincipal;
                        cumulativeInterest += mInterest;
                    }

                    yearlyData.push({
                        name: `${year} Yr`,
                        Principal: Math.round(yearPrincipal),
                        Interest: Math.round(yearInterest)
                    });
                }

                let displayMonthly = 0;
                if (type === 'level') {
                    const remainingMonths = n - g;
                    displayMonthly = L * r * Math.pow(1 + r, remainingMonths) / (Math.pow(1 + r, remainingMonths) - 1);
                } else if (type === 'principal') {
                    displayMonthly = (L / (n - g)) + (L * r); // Initial payment
                } else {
                    displayMonthly = L * r; // Monthly interest
                }

                return { 
                    monthlyPayment: displayMonthly, 
                    totalInterest: cumulativeInterest, 
                    totalPayment: L + cumulativeInterest,
                    yearlyData 
                };
            }, [loanAmount, rate, term, gracePeriod, type]);

            return (
                <GlassCard className="p-6 h-full flex flex-col">
                    <div className="flex items-center justify-between mb-8">
                        <div className="flex items-center gap-2">

                                <Icons.Calculator className="w-5 h-5" />
                            </div>
                            <h4 className="text-lg font-bold text-white font-grotesk">Loan Simulator</h4>
                        </div>
                        <div className="flex bg-black/30 p-1 rounded-xl gap-1 border border-white/10">
                            {['level', 'principal', 'maturity'].map((t) => (
                                <button 
                                    key={t}
                                    onClick={() => setType(t)}
                                    className={`px-3 py-1.5 rounded-lg text-[10px] font-bold transition-all ${type === t ? 'bg-indigo-500/20 text-indigo-400 border border-indigo-500/30' : 'text-slate-400 hover:text-slate-300'}`}
                                >
                                    {t === 'level' ? 'Amortization' : t === 'principal' ? 'Equal Principal' : 'Maturity'}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-10 flex-1">
                        <div className="space-y-6">
                            <SliderInput 
                                label="Purchase Price" value={purchasePrice} min={50000000} max={2000000000} step={10000000} unit=" KRW" 
                                formatter={(v) => (v / 100000000).toFixed(1) + ' 100M'} onChange={setPurchasePrice} 
                            />
                            <SliderInput 
                                label="Equity Ratio" value={equityRatio} min={0} max={100} unit="%" 
                                onChange={setEquityRatio} 
                            />
                            <SliderInput 
                                label="Interest Rate" value={rate} min={1} max={15} step={0.1} unit="%" 
                                onChange={setRate} 
                            />
                            <div className="grid grid-cols-2 gap-4">
                                <SliderInput 
                                    label="Loan Term" value={term} min={1} max={50} unit=" Yrs" 
                                    onChange={setTerm} 
                                />
                                <SliderInput 
                                    label="Grace Period" value={gracePeriod} min={0} max={Math.min(term, 10)} unit=" Yrs" 
                                    onChange={setGracePeriod} 
                                />
                            </div>

                            <div className="p-5 bg-gradient-to-r from-cyan-950/60 to-indigo-950/60 border border-white/10 rounded-2xl text-white shadow-xl relative overflow-hidden shadow-cyan-500/5">
                                <div className="absolute top-0 right-0 w-32 h-32 bg-cyan-400/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"></div>
                                <div className="relative z-10 flex flex-col gap-4">
                                    <div>
                                        <p className="text-[10px] font-bold text-cyan-400 uppercase tracking-widest opacity-80 mb-1 font-grotesk">Estimated Loan Amount</p>
                                        <h3 className="text-2xl font-black font-grotesk">{formatCurrency(loanAmount)}</h3>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4 pt-4 border-t border-white/10">
                                        <div>
                                            <p className="text-[10px] font-bold text-slate-400">{type === 'principal' ? 'Monthly Payment (Max)' : 'Monthly Payment'}</p>
                                            <p className="text-lg font-black font-grotesk text-white">{formatCurrency(results.monthlyPayment)}</p>
                                        </div>
                                        <div>
                                            <p className="text-[10px] font-bold text-slate-400">Total Interest Paid</p>
                                            <p className="text-lg font-black font-grotesk text-white">{formatCurrency(results.totalInterest)}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="flex flex-col">
                            <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-4 font-grotesk">Yearly Principal & Interest Breakdown</p>
                            <div className="flex-1 min-h-[300px]">
                                <ResponsiveContainer width="100%" height="100%">
                                    <BarChart data={results.yearlyData} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="rgba(255, 255, 255, 0.05)" />
                                        <XAxis dataKey="name" fontSize={10} stroke="#94a3b8" axisLine={false} tickLine={false} />
                                        <YAxis fontSize={10} stroke="#94a3b8" axisLine={false} tickLine={false} tickFormatter={(val) => val >= 1000000 ? `${(val/1000000).toFixed(1)}M` : val >= 1000 ? `${(val/1000).toFixed(0)}k` : val} />
                                        <RechartsTooltip 
                                            cursor={{fill: 'rgba(255, 255, 255, 0.02)'}}
                                            formatter={(v) => formatCurrency(v)}
                                            contentStyle={{ background: 'rgba(10, 11, 22, 0.9)', border: '1px solid rgba(255, 255, 255, 0.1)', borderRadius: '12px', boxShadow: '0 8px 32px 0 rgba(0, 0, 0, 0.37)', color: '#e2e8f0' }}
                                        />
                                        <Legend iconType="circle" wrapperStyle={{ fontSize: '10px', paddingTop: '20px' }} />
                                        <Bar dataKey="Principal" stackId="a" fill="#6366f1" radius={[0, 0, 0, 0]} />
                                        <Bar dataKey="Interest" stackId="a" fill="#f43f5e" radius={[4, 4, 0, 0]} />
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    </div>
                </GlassCard>
            );
        };

        const LoanTrendGraph = ({ data }) => {
            const months = useMemo(() => Object.keys(data).filter(isMonthKey).sort(), [data]);
            
            const uniqueLoanNames = useMemo(() => {
                const names = new Set();
                months.forEach(m => {
                    (data[m]?.loans || []).forEach(loan => names.add(loan.name));
                });
                return Array.from(names);
            }, [data, months]);

            const graphData = useMemo(() => months.map(m => {
                const point = { name: m };
                (data[m]?.loans || []).forEach(loan => {
                    point[loan.name] = Number(loan.amount) || 0;
                });
                return point;
            }), [data, months]);

            const colors = ['#f43f5e', '#8b5cf6', '#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#06b6d4'];

            return (
                <GlassCard className="p-6 h-full">

                    </div>
                    <div className="h-64 sm:h-72">
                        <ResponsiveContainer width="100%" height="100%">
                            <LineChart data={graphData}>
                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="rgba(255, 255, 255, 0.05)" />
                                <XAxis dataKey="name" fontSize={10} stroke="#94a3b8" tickMargin={10} axisLine={false} tickLine={false} />
                                <YAxis fontSize={10} width={60} stroke="#94a3b8" tickFormatter={(val) => val >= 1000000 ? `${(val/1000000).toFixed(1)}M` : val >= 1000 ? `${(val/1000).toFixed(0)}k` : val} axisLine={false} tickLine={false} />
                                <RechartsTooltip 
                                    formatter={(val, name) => [formatCurrency(val), name]} 
                                    contentStyle={{ background: 'rgba(10, 11, 22, 0.9)', border: '1px solid rgba(255, 255, 255, 0.1)', borderRadius: '12px', color: '#e2e8f0' }} 
                                />
                                <Legend iconType="circle" wrapperStyle={{ fontSize: '11px', paddingTop: '10px' }} />
                                {uniqueLoanNames.map((loanName, index) => (
                                    <Line 
                                        key={loanName}
                                        type="monotone" 
                                        dataKey={loanName} 
                                        name={loanName}
                                        stroke={colors[index % colors.length]} 
                                        strokeWidth={3} 
                                        dot={{r: 3, strokeWidth: 2, fill: '#0f1026'}} 
                                        activeDot={{r: 6, strokeWidth: 0}} 
                                    />
