<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <script>
        window.onerror = function(msg, url, line, col, err) {
            document.getElementById('root').innerHTML = '<pre style="color:red;padding:20px">' + msg + '\nLine:' + line + '\n' + (err?err.stack:'') + '</pre>';
            return true;
        };
    </script>
    <script type="text/babel" data-presets="react">
        const { useState } = React;
        function App() {
            return <div style={{color:'lime', padding:'40px', background:'#0f1026', minHeight:'100vh', fontSize:'24px'}}>✅ React works!</div>;
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
